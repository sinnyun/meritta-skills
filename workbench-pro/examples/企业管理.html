<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>企业管理工作台</title>
<style>
  :root{
    --primary:#2563EB; --primary-deep:#1D4ED8; --primary-light:#EEF4FF;
    --page:#F3F5F9; --card:#FFFFFF; --line:#E8ECF3; --line-2:#EEF1F6;
    --t1:#1F2937; --t2:#6B7280; --t3:#9CA3AF;
    --green:#0F9D6E; --green-bg:#EAF7F1;
    --red:#E24B4A; --red-bg:#FCEBEB;
    --amber:#D97706; --amber-bg:#FDF3E7;
    --purple:#7C3AED; --purple-bg:#F5EEFC;
    --cyan:#0891B2; --cyan-bg:#E6F6FA;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 0 0 0.5px rgba(15,23,42,.04);
    --shadow-hover:0 6px 18px rgba(30,64,175,.10), 0 0 0 0.5px rgba(30,64,175,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D3D9E3;border-radius:4px;}
  ::-webkit-scrollbar-thumb:hover{background:#BFC7D4;}
  ::-webkit-scrollbar-track{background:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;background:
    radial-gradient(1100px 420px at 88% -120px, rgba(37,99,235,.09), transparent 62%),
    radial-gradient(880px 340px at -8% 320px, rgba(124,58,237,.05), transparent 60%),
    linear-gradient(180deg,#EDF2FB 0%,#F4F6FA 300px,#F3F5F9 100%);
    background-attachment:fixed;color:var(--t1);font-size:13px;}
  /* ===== 顶部导航 ===== */
  .topbar{background:linear-gradient(90deg,#172E7C 0%,#1E40AF 40%,#2563EB 78%,#3B82F6 100%);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;height:50px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(23,46,124,.30);}
  .brand{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600;white-space:nowrap;letter-spacing:.5px;}
  .nav-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
  .nav-tabs::-webkit-scrollbar{display:none;}
  .nav-tabs span{padding:0 12px;line-height:50px;font-size:12.5px;color:rgba(255,255,255,.72);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color .15s;}
  .nav-tabs span:hover{color:#fff;}
  .nav-tabs span.active{color:#fff;border-bottom-color:#93C5FD;font-weight:500;}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .global-search{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border:0.5px solid rgba(255,255,255,.22);border-radius:17px;padding:0 12px;height:32px;width:220px;transition:background .15s;}
  .global-search:focus-within{background:rgba(255,255,255,.24);}
  .global-search input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:#fff;font-size:12.5px;font-family:inherit;}
  .global-search input::placeholder{color:rgba(255,255,255,.55);}
  .nav-icon{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:background .15s;}
  .nav-icon:hover{background:rgba(255,255,255,.28);}
  .nav-icon .dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:#FCA5A5;border:1px solid #1E40AF;}
  .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#93C5FD,#3B82F6);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;box-shadow:0 0 0 2px rgba(255,255,255,.35);}
  /* ===== 欢迎横幅 ===== */
  .banner{background:linear-gradient(115deg,#1E3A8A 0%,#2563EB 55%,#3B82F6 100%);border-radius:14px;padding:18px 24px;color:#fff;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 6px 20px rgba(30,64,175,.22);}
  .banner::before{content:'';position:absolute;right:-60px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 68%);}
  .banner::after{content:'';position:absolute;right:120px;bottom:-110px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(147,197,253,.25) 0%,rgba(147,197,253,0) 70%);}
  .banner-left{position:relative;z-index:1;min-width:0;}
  .banner-hi{font-size:17px;font-weight:600;letter-spacing:.3px;}
  .banner-sub{font-size:12px;color:rgba(255,255,255,.78);margin-top:5px;}
  .banner-chips{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;}
  .b-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:0.5px solid rgba(255,255,255,.22);border-radius:14px;padding:4px 12px;font-size:11.5px;white-space:nowrap;}
  .b-chip b{font-weight:600;font-variant-numeric:tabular-nums;}
  .b-chip.warn{background:rgba(252,165,165,.24);border-color:rgba(252,165,165,.4);}
  .banner-cta{position:relative;z-index:1;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .banner-shine{position:absolute;inset:0;pointer-events:none;border-radius:14px;background:linear-gradient(100deg,transparent 36%,rgba(255,255,255,.15) 50%,transparent 64%);background-size:220% 100%;animation:shine 4.5s ease-in-out infinite;}
  @keyframes shine{0%{background-position:130% 0;}55%,100%{background-position:-70% 0;}}
  .banner-date{font-size:11.5px;color:rgba(255,255,255,.75);}
  .banner-btn{background:#fff;color:var(--primary-deep);border:none;border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(15,23,42,.18);transition:transform .15s, box-shadow .15s;min-height:38px;}
  .banner-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,23,42,.24);}
  /* ===== 布局 ===== */
  .wrap{max-width:1560px;margin:0 auto;padding:14px 16px 90px;display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--card);border:0.5px solid rgba(15,23,42,.055);border-radius:14px;box-shadow:var(--shadow);padding:13px 15px;min-width:0;transition:box-shadow .2s ease, transform .2s ease;}
  .card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px);}
  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .wrap>*{animation:rise .55s cubic-bezier(.22,.68,.35,1) backwards;}
  .wrap>*:nth-child(2){animation-delay:.06s;}
  .wrap>*:nth-child(3){animation-delay:.12s;}
  .wrap>*:nth-child(4){animation-delay:.18s;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
  .card-title{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;}
  .card-title .ti{width:21px;height:21px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .card-more{font-size:11.5px;color:var(--t3);white-space:nowrap;}
  .row-2{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:12px;}
  .row-3{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;align-items:start;}
  .col-stack{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .col-main{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .insights{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  /* ===== KPI ===== */
  .kpi-strip{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;padding:12px 14px;}
  .kpi{border-radius:10px;padding:10px 11px;position:relative;overflow:hidden;border:0.5px solid rgba(15,23,42,.045);transition:transform .15s ease, box-shadow .15s ease;}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(30,64,175,.10);}
  .kpi .k-label{font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
  .kpi .k-value{font-size:18.5px;font-weight:600;margin:4px 0 3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;}
  .kpi .k-sub{font-size:10.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi .k-ico{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(255,255,255,.6);}
  .kpi .k-spark{position:absolute;right:8px;bottom:8px;opacity:.9;}
  .k-blue{background:linear-gradient(135deg,#EFF5FF 0%,#FFFFFF 78%);} .k-blue .k-value{color:var(--primary);}
  .k-green{background:linear-gradient(135deg,#E9F7F0 0%,#FFFFFF 78%);} .k-green .k-value{color:var(--green);}
  .k-red{background:linear-gradient(135deg,#FCEDED 0%,#FFFFFF 78%);} .k-red .k-value{color:var(--red);}
  .k-amber{background:linear-gradient(135deg,#FDF4E7 0%,#FFFFFF 78%);} .k-amber .k-value{color:var(--amber);}
  .k-purple{background:linear-gradient(135deg,#F5EEFC 0%,#FFFFFF 78%);} .k-purple .k-value{color:var(--purple);}
  .k-cyan{background:linear-gradient(135deg,#E7F7FB 0%,#FFFFFF 78%);} .k-cyan .k-value{color:var(--cyan);}
  .up{color:var(--green);} .down{color:var(--red);}
  /* ===== 图表 ===== */
  .donut-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
  #donutWrap svg{filter:drop-shadow(0 3px 8px rgba(37,99,235,.16));}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;width:100%;font-size:11.5px;color:var(--t2);}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;}
  .legend b{font-weight:500;color:var(--t1);float:right;font-variant-numeric:tabular-nums;}
  .bars{width:100%;height:168px;display:block;}
  .fin-form{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center;}
  .fin-form select,.fin-form input{border:0.5px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12.5px;background:#fff;color:var(--t1);outline:none;transition:border-color .15s, box-shadow .15s;}
  .fin-form select:focus,.fin-form input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(37,99,235,.10);}
  .fin-form input{width:96px;}
  /* ===== 今日处理 ===== */
  .today-list{display:flex;flex-direction:column;gap:6px;}
  .today-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;background:#F7F9FC;border:0.5px solid var(--line-2);transition:background .15s;}
  .today-item:hover{background:#F0F4FA;}
  .today-item.overdue{background:var(--red-bg);border-color:#F5C6C6;}
  .today-item .ti-tag{flex-shrink:0;font-size:10.5px;padding:2px 7px;border-radius:9px;color:#fff;font-weight:500;}
  .today-item .ti-title{flex:1;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t1);}
  .today-item.overdue .ti-title{color:#8C2323;}
  .today-item .ti-date{font-size:11px;color:var(--t3);flex-shrink:0;font-variant-numeric:tabular-nums;}
  .today-item .ti-btn{flex-shrink:0;font-size:11.5px;color:var(--primary);background:#fff;border:0.5px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;transition:all .15s;}
  .today-item .ti-btn:hover{border-color:var(--primary);background:var(--primary-light);}
  .empty-tip{color:var(--t3);font-size:12px;text-align:center;padding:14px 0;}
  /* ===== 表格 ===== */
  .chips{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .chip{font-size:12px;color:var(--t2);background:#F7F9FC;border:0.5px solid var(--line-2);border-radius:14px;padding:5px 12px;cursor:pointer;transition:all .15s;font-variant-numeric:tabular-nums;}
  .chip:hover{border-color:var(--primary);color:var(--primary);}
  .chip.active{background:linear-gradient(135deg,#3B82F6,#1D4ED8);border-color:var(--primary);color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.32);}
  .chip b{font-weight:500;margin-left:3px;}
  .chip.c-red.active{background:var(--red);border-color:var(--red);box-shadow:0 2px 8px rgba(226,75,74,.28);}
  .table-toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .table-toolbar input,.table-toolbar select{border:0.5px solid var(--line);border-radius:7px;padding:8px 11px;font-size:12.5px;background:#fff;color:var(--t1);outline:none;transition:border-color .15s, box-shadow .15s;}
  .table-toolbar input:focus,.table-toolbar select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(37,99,235,.10);}
  .table-toolbar input{flex:1;min-width:150px;max-width:260px;}
  .table-scroll{overflow-x:auto;max-height:400px;overflow-y:auto;border-radius:8px;border:0.5px solid var(--line-2);}
  table{width:100%;border-collapse:collapse;min-width:780px;}
  thead th{position:sticky;top:0;z-index:2;font-size:11.5px;color:var(--t2);font-weight:500;text-align:left;padding:8px 10px;background:#F8FAFC;border-bottom:0.5px solid var(--line);white-space:nowrap;}
  td{font-size:12.5px;padding:8px 10px;border-bottom:0.5px solid var(--line-2);white-space:nowrap;vertical-align:middle;}
  tbody tr:nth-child(even) td{background:#FAFBFD;}
  tbody tr:hover td{background:#F1F5FF;}
  tbody tr:last-child td{border-bottom:none;}
  .money{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;}
  th.money{text-align:right;}
  .status-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:10px;font-weight:500;}
  .status-pill i{width:5px;height:5px;border-radius:50%;}
  .sp-blue{background:var(--primary-light);color:var(--primary);} .sp-blue i{background:var(--primary);}
  .sp-green{background:var(--green-bg);color:var(--green);} .sp-green i{background:var(--green);}
  .sp-amber{background:var(--amber-bg);color:var(--amber);} .sp-amber i{background:var(--amber);}
  .sp-red{background:var(--red-bg);color:var(--red);} .sp-red i{background:var(--red);}
  .row-status{border:0.5px solid var(--line);border-radius:5px;padding:4px 5px;font-size:11.5px;background:#fff;color:var(--t1);cursor:pointer;font-family:inherit;}
  .link-btn{border:none;background:none;color:var(--t3);font-size:11.5px;cursor:pointer;padding:4px 6px;font-family:inherit;}
  .link-btn:hover{color:var(--red);}
  /* ===== 客户 TOP ===== */
  .top-list{display:flex;flex-direction:column;gap:9px;}
  .top-item{display:flex;flex-direction:column;gap:4px;}
  .top-line{display:flex;align-items:baseline;gap:8px;font-size:12px;}
  .top-rank{width:17px;height:17px;border-radius:5px;background:#EEF1F6;color:var(--t2);font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;align-self:center;font-weight:600;}
  .top-rank.r1{background:linear-gradient(135deg,#FDE68A,#F59E0B);color:#7C2D12;}
  .top-rank.r2{background:linear-gradient(135deg,#E5E7EB,#9CA3AF);color:#374151;}
  .top-rank.r3{background:linear-gradient(135deg,#FDBA74,#EA580C);color:#7C2D12;}
  .top-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t1);}
  .top-amt{color:var(--t2);font-variant-numeric:tabular-nums;font-size:11.5px;flex-shrink:0;}
  .top-bar{height:6px;background:#F0F3F8;border-radius:3px;overflow:hidden;margin-left:25px;}
  .top-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#60A5FA,#2563EB);transition:width .5s ease;}
  /* ===== 动态时间轴 ===== */
  .tl{display:flex;flex-direction:column;}
  .tl-item{display:flex;gap:10px;position:relative;padding-bottom:12px;}
  .tl-item:last-child{padding-bottom:2px;}
  .tl-item::before{content:'';position:absolute;left:4.5px;top:14px;bottom:0;width:1px;background:var(--line);}
  .tl-item:last-child::before{display:none;}
  .tl-dot{width:10px;height:10px;border-radius:50%;background:#93C5FD;border:2px solid #DBEAFE;flex-shrink:0;margin-top:3px;position:relative;z-index:1;}
  .tl-item.hot .tl-dot{background:var(--red);border-color:#FCD4D4;}
  .tl-item.ok .tl-dot{background:var(--green);border-color:#C6EBDD;}
  .tl-body{min-width:0;flex:1;}
  .tl-text{font-size:12px;color:var(--t1);line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .tl-time{font-size:10.5px;color:var(--t3);margin-top:2px;}
  /* ===== 项目 ===== */
  .proj-list{display:flex;flex-direction:column;gap:8px;}
  .proj-item{display:flex;flex-direction:column;gap:6px;padding:8px 10px;background:#F7F9FC;border:0.5px solid var(--line-2);border-radius:8px;}
  .proj-top{display:flex;align-items:center;gap:8px;}
  .proj-item .pj-name{flex:1;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
  .proj-item.done .pj-name{color:var(--t3);text-decoration:line-through;font-weight:400;}
  .proj-item .pj-btn{font-size:11.5px;border:0.5px solid var(--line);background:#fff;border-radius:5px;padding:3px 8px;cursor:pointer;color:var(--t2);flex-shrink:0;font-family:inherit;transition:all .15s;}
  .proj-item .pj-btn:hover{color:var(--primary);border-color:var(--primary);}
  .pj-progress{display:flex;align-items:center;gap:8px;}
  .pj-bar{flex:1;height:5px;background:#E8ECF3;border-radius:3px;overflow:hidden;cursor:pointer;}
  .pj-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#60A5FA,#2563EB);transition:width .35s ease;position:relative;overflow:hidden;}
  .pj-bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 20%,rgba(255,255,255,.45) 50%,transparent 80%);transform:translateX(-100%);animation:pjshine 2.6s ease-in-out infinite;}
  @keyframes pjshine{to{transform:translateX(100%);}}
  .proj-item.done .pj-bar i{background:linear-gradient(90deg,#34D399,#0F9D6E);}
  .proj-item.over .pj-bar i{background:linear-gradient(90deg,#F87171,#E24B4A);}
  .pj-pct{font-size:10.5px;color:var(--t3);font-variant-numeric:tabular-nums;width:30px;text-align:right;flex-shrink:0;}
  .add-row{display:flex;gap:6px;margin-top:9px;}
  .add-row input{flex:1;min-width:100px;border:0.5px solid var(--line);border-radius:7px;padding:8px 11px;font-size:13px;outline:none;transition:border-color .15s, box-shadow .15s;}
  .add-row input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(37,99,235,.10);}
  /* ===== 待办 / 快捷 ===== */
  .todo-panel{display:flex;flex-direction:column;gap:6px;}
  .todo-card{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;font-size:11.5px;}
  .todo-card .tc-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .todo-card .tc-act{cursor:pointer;flex-shrink:0;font-weight:500;}
  .check-row{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:12.5px;border-bottom:0.5px dashed var(--line-2);}
  .check-row:last-child{border-bottom:none;}
  .check-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;flex-shrink:0;}
  .check-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .check-row.done span{color:var(--t3);text-decoration:line-through;}
  .check-row .del{margin-left:auto;border:none;background:none;color:var(--t3);cursor:pointer;font-size:13px;padding:2px 5px;flex-shrink:0;background:transparent;font-family:inherit;}
  .check-row .del:hover{color:var(--red);}
  .quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .quick-item{display:flex;align-items:center;gap:7px;padding:8px 9px;background:#F7F9FC;border:0.5px solid var(--line-2);border-radius:7px;cursor:pointer;font-size:11.5px;color:var(--t1);font-family:inherit;text-align:left;min-height:38px;transition:all .15s;}
  .quick-item:hover{background:var(--primary-light);border-color:#93C5FD;transform:translateY(-1px);}
  .quick-item .qi-ico{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .btn{border-radius:7px;padding:8px 13px;font-size:12.5px;cursor:pointer;border:0.5px solid var(--line);background:#fff;color:var(--t1);font-family:inherit;min-height:34px;transition:all .15s;}
  .btn:hover{border-color:var(--primary);color:var(--primary);}
  .btn-primary{background:linear-gradient(135deg,#3B82F6,#1D4ED8);border-color:var(--primary-deep);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.28);}
  .btn-primary:hover{background:var(--primary-deep);color:#fff;box-shadow:0 4px 10px rgba(37,99,235,.30);}
  .btn-danger{color:var(--red);}
  .btn-danger:hover{border-color:var(--red);color:var(--red);}
  .btn-sm{padding:5px 11px;font-size:11.5px;min-height:28px;}
  .backup-btns{display:flex;gap:7px;flex-wrap:wrap;}
  .backup-note{font-size:10.5px;color:var(--t3);margin-top:8px;line-height:1.6;}
  /* ===== 弹窗 ===== */
  .mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px);}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:14px;width:480px;max-width:100%;max-height:88vh;overflow-y:auto;padding:20px 22px;box-shadow:0 16px 48px rgba(15,23,42,.22);animation:pop .18s ease;}
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal h3{font-size:14.5px;font-weight:600;margin-bottom:14px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .form-item{display:flex;flex-direction:column;gap:5px;}
  .form-item.full{grid-column:1/3;}
  .form-item label{font-size:11.5px;color:var(--t2);}
  .form-item input,.form-item select,.form-item textarea{border:0.5px solid var(--line);border-radius:7px;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--t1);background:#fff;width:100%;outline:none;transition:border-color .15s, box-shadow .15s;}
  .form-item input:focus,.form-item select:focus,.form-item textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  .form-item textarea{resize:vertical;min-height:52px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:16px;}
  .confirm-body{font-size:13px;color:var(--t1);line-height:1.7;}
  /* ===== toast ===== */
  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(31,41,55,.92);color:#fff;font-size:12.5px;padding:9px 18px;border-radius:8px;z-index:200;display:none;max-width:80vw;box-shadow:0 6px 20px rgba(15,23,42,.3);}
  /* ===== 底部导航(移动) ===== */
  .bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:0.5px solid var(--line);z-index:60;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(15,23,42,.06);}
  .bottom-nav a{flex:1;text-align:center;padding:8px 0 6px;font-size:10.5px;color:var(--t2);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:46px;justify-content:center;}
  .bottom-nav a.active{color:var(--primary);font-weight:500;}
  .hint-bar{display:none;background:var(--amber-bg);color:var(--amber);font-size:12px;padding:8px 16px;text-align:center;}
  .hint-bar.show{display:block;}
  /* ===== 响应式 ===== */
  @media (max-width:1280px){
    .kpi-strip{grid-template-columns:repeat(4,1fr);}
    .row-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
    .row-2 #today{grid-column:1/3;}
    .row-3{grid-template-columns:1fr;}
    .global-search{display:none;}
  }
  @media (max-width:1100px){
    .insights{grid-template-columns:1fr;}
  }
  @media (max-width:768px){
    .nav-tabs{display:none;}
    .wrap{padding:10px 10px 90px;gap:10px;}
    .row-2{grid-template-columns:1fr;}
    .row-2 #today{grid-column:auto;}
    .kpi-strip{grid-template-columns:repeat(2,1fr);padding:10px;}
    .kpi .k-value{font-size:15px;}
    .banner{flex-direction:column;align-items:flex-start;padding:16px 18px;}
    .banner-cta{flex-direction:row;align-items:center;width:100%;justify-content:space-between;}
    .bottom-nav{display:flex;}
    .table-toolbar input{max-width:none;}
    .card{padding:12px;}
    .table-scroll{max-height:none;}
    .banner::before,.banner::after,.banner-shine{display:none;}
  }
</style>
</head>
<body>

<div class="hint-bar" id="backupHint">数据已积累 30 条以上，建议「导出 JSON 备份」保存一份数据</div>

<header class="topbar">
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 20 20"><rect x="1" y="1" width="8" height="8" rx="2" fill="#93C5FD"/><rect x="11" y="1" width="8" height="8" rx="2" fill="#fff"/><rect x="1" y="11" width="8" height="8" rx="2" fill="#fff"/><rect x="11" y="11" width="8" height="8" rx="2" fill="#93C5FD"/></svg>
    企业管理工作台
  </div>
  <nav class="nav-tabs">
    <span class="active" data-nav="dashboard">工作台</span>
    <span data-nav="contracts">合同台账</span>
    <span data-nav="finance">财务</span>
    <span data-nav="projects">项目看板</span>
    <span data-nav="today">待办提醒</span>
  </nav>
  <div class="nav-right">
    <div class="global-search">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.2" stroke="rgba(255,255,255,.75)" stroke-width="1.3"/><path d="M9.2 9.2L12.5 12.5" stroke="rgba(255,255,255,.75)" stroke-width="1.3" stroke-linecap="round"/></svg>
      <input type="text" id="globalSearch" placeholder="搜索合同 / 客户 / 负责人，回车定位">
    </div>
    <div class="nav-icon" title="提醒">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2a4 4 0 0 0-4 4v3l-1.2 2h10.4L12 9V6a4 4 0 0 0-4-4z" stroke="#fff" stroke-width="1.3"/><path d="M6.5 13a1.5 1.5 0 0 0 3 0" stroke="#fff" stroke-width="1.3"/></svg>
      <span class="dot" id="navDot" style="display:none"></span>
    </div>
    <div class="avatar">管</div>
  </div>
</header>

<div class="wrap">

  <!-- 欢迎横幅 -->
  <section class="banner">
    <div class="banner-shine"></div>
    <div class="banner-left">
      <div class="banner-hi" id="bannerHi">你好</div>
      <div class="banner-sub" id="bannerSub">祝你有高效的一天</div>
      <div class="banner-chips" id="bannerChips"></div>
    </div>
    <div class="banner-cta">
      <span class="banner-date" id="bannerDate"></span>
      <button class="banner-btn" id="bannerAddBtn">＋ 新增合同</button>
    </div>
  </section>

  <!-- 数据概览：1 行 8 卡 -->
  <section class="card" id="dashboard" style="padding:12px 14px;">
    <div class="card-head" style="margin-bottom:8px;">
      <div class="card-title"><span class="ti" style="background:var(--primary-light);"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1.5 10.5V6m3 4.5V3m3 7.5V4.5m3 6v-6" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/></svg></span>数据概览</div>
      <span class="card-more">近 6 个月经营数据</span>
    </div>
    <div class="kpi-strip" id="kpiGrid"></div>
  </section>

  <!-- 第二行：状态环 + 收支趋势 + 今天要处理 -->
  <div class="row-2">
    <section class="card">
      <div class="card-head"><div class="card-title"><span class="ti" style="background:var(--purple-bg);"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#7C3AED" stroke-width="1.5"/><path d="M6 1.5V6l3 2" fill="none" stroke="#7C3AED" stroke-width="1.5"/></svg></span>合同状态</div></div>
      <div class="donut-wrap" id="donutWrap"></div>
    </section>

    <section class="card" id="finance">
      <div class="card-head">
        <div class="card-title"><span class="ti" style="background:var(--cyan-bg);"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 9l3-3 2.5 2L11 3" stroke="#0891B2" stroke-width="1.5" fill="none"/><path d="M8 3h3v3" stroke="#0891B2" stroke-width="1.5" fill="none"/></svg></span>近 6 个月收支趋势</div>
        <span class="card-more" style="display:flex;gap:12px;">
          <span><i style="display:inline-block;width:7px;height:7px;border-radius:2px;background:#2563EB;margin-right:4px;"></i>收入</span>
          <span><i style="display:inline-block;width:7px;height:7px;border-radius:2px;background:#F09595;margin-right:4px;"></i>支出</span>
          <span><i style="display:inline-block;width:10px;height:2px;border-radius:1px;background:#7C3AED;margin-right:4px;vertical-align:3px;"></i>净利润</span>
        </span>
      </div>
      <svg class="bars" id="trendChart" preserveAspectRatio="none"></svg>
      <div class="fin-form">
        <select id="finMonth"></select>
        <input type="number" id="finIncome" placeholder="收入 (元)" min="0">
        <input type="number" id="finExpense" placeholder="支出 (元)" min="0">
        <button class="btn btn-primary btn-sm" id="finAddBtn">记一笔</button>
      </div>
    </section>

    <section class="card" id="today">
      <div class="card-head">
        <div class="card-title"><span class="ti" style="background:var(--red-bg);"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v3M6 8.5v.5" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/><circle cx="6" cy="6" r="5" fill="none" stroke="#E24B4A" stroke-width="1.3"/></svg></span>今天要处理</div>
        <span class="card-more" id="todayCount"></span>
      </div>
      <div class="today-list" id="todayList"></div>
    </section>
  </div>

  <!-- 第三行：主栏（台账 + 洞察） + 右列 -->
  <div class="row-3">
    <div class="col-main">
      <section class="card" id="contracts">
        <div class="card-head">
          <div class="card-title"><span class="ti" style="background:var(--primary-light);"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="1.5" width="8" height="9" rx="1.5" fill="none" stroke="#2563EB" stroke-width="1.3"/><path d="M4 4h4M4 6h4M4 8h2.5" stroke="#2563EB" stroke-width="1.3"/></svg></span>合同台账</div>
          <button class="btn btn-primary btn-sm" id="addContractBtn">+ 新增合同</button>
        </div>
        <div class="chips" id="contractChips"></div>
        <div class="table-toolbar">
          <input type="text" id="contractSearch" placeholder="搜索合同名称 / 客户 / 负责人">
          <select id="contractStatusFilter" style="display:none;">
            <option value="">全部状态</option>
            <option value="待审批">待审批</option>
            <option value="执行中">执行中</option>
            <option value="已完成">已完成</option>
            <option value="已逾期">已逾期</option>
          </select>
        </div>
        <div class="table-scroll">
          <table>
            <thead><tr>
              <th>合同名称</th><th>客户</th><th class="money">合同金额</th><th>状态</th><th>负责人</th><th>签订日期</th><th>到期日期</th><th>操作</th>
            </tr></thead>
            <tbody id="contractBody"></tbody>
          </table>
        </div>
      </section>

      <div class="insights">
        <section class="card">
          <div class="card-head"><div class="card-title"><span class="ti" style="background:var(--green-bg);"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="3.5" r="2" fill="none" stroke="#0F9D6E" stroke-width="1.3"/><path d="M1.8 10.5c.6-2.2 2.2-3.3 4.2-3.3s3.6 1.1 4.2 3.3" fill="none" stroke="#0F9D6E" stroke-width="1.3" stroke-linecap="round"/></svg></span>客户金额 TOP5</div><span class="card-more">按合同总额</span></div>
          <div class="top-list" id="topClients"></div>
        </section>

        <section class="card">
          <div class="card-head"><div class="card-title"><span class="ti" style="background:var(--amber-bg);"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 2v.3M6 9.7V10" stroke="#D97706" stroke-width="1.4" stroke-linecap="round"/><circle cx="6" cy="6" r="2.2" fill="none" stroke="#D97706" stroke-width="1.3"/><circle cx="6" cy="6" r="5" fill="none" stroke="#D97706" stroke-width="1.1" stroke-dasharray="1.5 2.2"/></svg></span>最近动态</div><span class="card-more">自动记录</span></div>
          <div class="tl" id="timeline"></div>
        </section>
      </div>
    </div>

    <div class="col-stack">
      <section class="card">
        <div class="card-head"><div class="card-title"><span class="ti" style="background:var(--amber-bg);"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2.5l1.5 1.5L6 1.5" stroke="#D97706" stroke-width="1.4" fill="none"/><path d="M7 3h3.5M2 6.5h8.5M2 9.5h6" stroke="#D97706" stroke-width="1.4"/></svg></span>待办提醒</div></div>
        <div class="todo-panel" id="todoPanel"></div>
        <div id="todoChecks" style="margin-top:4px;"></div>
        <div class="add-row">
          <input type="text" id="todoInput" placeholder="输入新待办事项">
          <button class="btn btn-primary btn-sm" id="todoAddBtn">添加</button>
        </div>
      </section>

      <section class="card" id="projects">
        <div class="card-head"><div class="card-title"><span class="ti" style="background:var(--green-bg);"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="3" width="9" height="7" rx="1.5" fill="none" stroke="#0F9D6E" stroke-width="1.3"/><path d="M4 3V1.8h4V3M1.5 5.8h9" stroke="#0F9D6E" stroke-width="1.3"/></svg></span>项目看板</div><span class="card-more" id="projStat"></span></div>
        <div class="proj-list" id="projList"></div>
        <div class="add-row">
          <input type="text" id="projInput" placeholder="输入新项目名称">
          <button class="btn btn-primary btn-sm" id="projAddBtn">添加</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><div class="card-title"><span class="ti" style="background:var(--cyan-bg);"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="3.5" height="3.5" rx="1" fill="#0891B2"/><rect x="7" y="1.5" width="3.5" height="3.5" rx="1" fill="#0891B2" opacity=".55"/><rect x="1.5" y="7" width="3.5" height="3.5" rx="1" fill="#0891B2" opacity=".55"/><rect x="7" y="7" width="3.5" height="3.5" rx="1" fill="#0891B2"/></svg></span>快捷入口 · 数据管理</div></div>
        <div class="quick-grid" style="margin-bottom:10px;">
          <button class="quick-item" id="qiContract">
            <span class="qi-ico" style="background:var(--primary-light);"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="2.5" y="1.5" width="9" height="11" rx="1.5" fill="none" stroke="#2563EB" stroke-width="1.2"/><path d="M5 4.5h4M5 7h4M5 9.5h2.5" stroke="#2563EB" stroke-width="1.2"/></svg></span>
            新增合同
          </button>
          <button class="quick-item" id="qiProject">
            <span class="qi-ico" style="background:var(--green-bg);"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1.5" y="3" width="11" height="8.5" rx="1.5" fill="none" stroke="#0F9D6E" stroke-width="1.2"/><path d="M4.5 3V1.8h5V3M1.5 6h11" stroke="#0F9D6E" stroke-width="1.2"/></svg></span>
            新增项目
          </button>
          <button class="quick-item" id="qiTodo">
            <span class="qi-ico" style="background:var(--amber-bg);"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2.5 3.5L4 5l2.8-2.8" stroke="#D97706" stroke-width="1.3" fill="none"/><path d="M8 4h4M2.5 8h9.5M2.5 11h6.5" stroke="#D97706" stroke-width="1.3"/></svg></span>
            新增待办
          </button>
          <button class="quick-item" id="qiFinance">
            <span class="qi-ico" style="background:var(--purple-bg);"><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="none" stroke="#7C3AED" stroke-width="1.2"/><path d="M7 4.2V7l1.8 1.5" stroke="#7C3AED" stroke-width="1.2" fill="none"/></svg></span>
            记收支
          </button>
          <button class="quick-item" id="qiExport">
            <span class="qi-ico" style="background:var(--cyan-bg);"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1.5v6.5m0 0L4.8 5.8M7 8l2.2-2.2" stroke="#0891B2" stroke-width="1.2" fill="none"/><path d="M2.5 9.5V12a.8.8 0 0 0 .8.8h7.4a.8.8 0 0 0 .8-.8V9.5" stroke="#0891B2" stroke-width="1.2" fill="none"/></svg></span>
            导出备份
          </button>
          <button class="quick-item" id="qiImport">
            <span class="qi-ico" style="background:var(--red-bg);"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 8V1.5m0 0L4.8 3.7M7 1.5l2.2 2.2" stroke="#E24B4A" stroke-width="1.2" fill="none"/><path d="M2.5 9.5V12a.8.8 0 0 0 .8.8h7.4a.8.8 0 0 0 .8-.8V9.5" stroke="#E24B4A" stroke-width="1.2" fill="none"/></svg></span>
            导入恢复
          </button>
        </div>
        <div class="backup-btns">
          <button class="btn btn-sm btn-danger" id="clearDemoBtn">清空示例数据</button>
          <button class="btn btn-sm btn-danger" id="clearAllBtn">清空全部数据</button>
        </div>
        <p class="backup-note">数据保存在本机浏览器 localStorage，换设备请先「导出 JSON 备份」再在新设备导入恢复。</p>
      </section>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="#dashboard" class="active"><svg width="17" height="17" viewBox="0 0 18 18"><rect x="2" y="2" width="6" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="2" width="6" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="10" width="6" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="10" width="6" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>概览</a>
  <a href="#contracts"><svg width="17" height="17" viewBox="0 0 18 18"><rect x="3" y="2" width="12" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 6h6M6 9h6M6 12h4" stroke="currentColor" stroke-width="1.4"/></svg>合同</a>
  <a href="#projects"><svg width="17" height="17" viewBox="0 0 18 18"><rect x="2" y="4" width="14" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 4V2.5h6V4M2 8.5h14" stroke="currentColor" stroke-width="1.4"/></svg>项目</a>
  <a href="#today"><svg width="17" height="17" viewBox="0 0 18 18"><path d="M3 4.5l2 2 3.5-3.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10 5h5M3 10h12M3 14h8" stroke="currentColor" stroke-width="1.4"/></svg>待办</a>
</nav>

<!-- 新增合同弹窗 -->
<div class="mask" id="contractModal">
  <div class="modal">
    <h3>新增合同</h3>
    <div class="form-grid">
      <div class="form-item full"><label>合同名称 *</label><input type="text" id="cName" placeholder="如：智慧园区二期开发合同"></div>
      <div class="form-item"><label>客户名称 *</label><input type="text" id="cClient" placeholder="签约对方"></div>
      <div class="form-item"><label>合同金额 (¥) *</label><input type="number" id="cAmount" placeholder="0.00" min="0"></div>
      <div class="form-item"><label>状态</label>
        <select id="cStatus">
          <option value="待审批">待审批</option>
          <option value="执行中" selected>执行中</option>
          <option value="已完成">已完成</option>
          <option value="已逾期">已逾期</option>
        </select>
      </div>
      <div class="form-item"><label>负责人</label><input type="text" id="cOwner" placeholder="项目负责人"></div>
      <div class="form-item"><label>签订日期</label><input type="date" id="cSign"></div>
      <div class="form-item"><label>到期日期</label><input type="date" id="cEnd"></div>
      <div class="form-item full"><label>备注</label><textarea id="cNote" placeholder="补充说明（选填）"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close="contractModal">取消</button>
      <button class="btn btn-primary" id="contractSaveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 通用确认弹窗 -->
<div class="mask" id="confirmModal">
  <div class="modal" style="width:360px;">
    <h3 id="confirmTitle">确认操作</h3>
    <p class="confirm-body" id="confirmText"></p>
    <div class="modal-foot">
      <button class="btn" id="confirmCancelBtn">取消</button>
      <button class="btn btn-primary" id="confirmOkBtn">确认</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  /* ================= 数据层 ================= */
  var KEY = 'wb_empmgr_';
  var KEYS = {contracts:KEY+'contracts', finance:KEY+'finance', todos:KEY+'todos', projects:KEY+'projects', acts:KEY+'activities', demo:KEY+'demo'};
  var STATUS = ['待审批','执行中','已完成','已逾期'];
  var todayStr = fmtDate(new Date());

  function fmtDate(d){
    var m = d.getMonth()+1, day = d.getDate();
    return d.getFullYear()+'-'+(m<10?'0'+m:m)+'-'+(day<10?'0'+day:day);
  }
  function daysBetween(a, b){
    return Math.ceil((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
  }
  function load(k, def){
    try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; }
  }
  function save(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
  }

  var state = {contracts:[], finance:{}, todos:[], projects:[], activities:[], demoCleared:false,
               filterStatus:'', searchText:''};

  function sampleData(){
    var contracts = [
      {id:uid(), name:'智慧园区二期开发合同', client:'云智科技有限公司', amount:2850000, status:'执行中', owner:'王强', sign:'2026-03-15', end:'2026-12-31', note:'二期交付系统开发'},
      {id:uid(), name:'华南区渠道拓展服务合同', client:'南粤商贸集团', amount:869000, status:'已逾期', owner:'李娜', sign:'2025-09-01', end:'2026-09-10', note:'回款已逾期，需跟进'},
      {id:uid(), name:'ERP 数据迁移实施合同', client:'恒信制造股份', amount:1230000, status:'待审批', owner:'张伟', sign:'2026-09-08', end:'2027-03-31', note:'待法务审核'},
      {id:uid(), name:'数据中心运维合同', client:'云际数据科技', amount:634500, status:'执行中', owner:'刘洋', sign:'2026-05-20', end:todayStr, note:'今日到期，需确认续签'},
      {id:uid(), name:'办公楼租赁合同', client:'汇金置业有限公司', amount:456000, status:'执行中', owner:'陈芳', sign:'2026-01-01', end:'2026-12-31', note:''},
      {id:uid(), name:'员工培训服务合同', client:'启航教育咨询', amount:128000, status:'已完成', owner:'王强', sign:'2026-02-01', end:'2026-06-30', note:''},
      {id:uid(), name:'智慧园区一期运维扩展合同', client:'云智科技有限公司', amount:980000, status:'执行中', owner:'王强', sign:'2026-04-10', end:'2027-04-10', note:'一期运维扩展'}
    ];
    var finance = {};
    var now = new Date();
    var seed = [
      [2180000, 1120000],[2450000, 986000],[2610000, 1053000],
      [2390000, 1187000],[2820000, 1041000],[2850265, 1039722]
    ];
    for(var i=5;i>=0;i--){
      var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      var key = d.getFullYear()+'-'+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1);
      var s = seed[5-i];
      finance[key] = {income:s[0], expense:s[1]};
    }
    var todos = [
      {id:uid(), text:'审批 ERP 数据迁移合同（法务意见已回）', done:false},
      {id:uid(), text:'跟进华南区渠道合同逾期回款', done:false},
      {id:uid(), text:'提交 Q3 部门预算执行报告', done:true}
    ];
    var projects = [
      {id:uid(), name:'智慧园区二期 · 交付系统开发', status:'进行中', progress:65},
      {id:uid(), name:'华南区渠道拓展 · 客户签约', status:'已验收', progress:100},
      {id:uid(), name:'ERP 数据迁移 · 供应商对接', status:'已逾期', progress:30},
      {id:uid(), name:'数据中心运维 · 续签谈判', status:'进行中', progress:45}
    ];
    var activities = [
      {id:uid(), text:'王强 更新了「智慧园区二期 · 交付系统开发」进度至 65%', time:'09:20', cls:''},
      {id:uid(), text:'华南区渠道拓展服务合同 已逾期，回款需跟进', time:'08:45', cls:'hot'},
      {id:uid(), text:'ERP 数据迁移实施合同 提交法务审核', time:'昨天 17:30', cls:''},
      {id:uid(), text:'数据中心运维合同 今日到期，等待续签确认', time:'昨天 16:02', cls:''},
      {id:uid(), text:'员工培训服务合同 已完成验收归档', time:'昨天 10:15', cls:'ok'}
    ];
    return {contracts:contracts, finance:finance, todos:todos, projects:projects, activities:activities};
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function persistAll(){
    save(KEYS.contracts, state.contracts);
    save(KEYS.finance, state.finance);
    save(KEYS.todos, state.todos);
    save(KEYS.projects, state.projects);
    save(KEYS.acts, state.activities);
    save(KEYS.demo, state.demoCleared);
  }
  function pushActivity(text, cls){
    var d = new Date();
    var time = (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
    state.activities.unshift({id:uid(), text:text, time:time, cls:cls||''});
    if(state.activities.length > 20) state.activities.length = 20;
  }
  function normProject(p){
    if(typeof p.progress !== 'number'){
      p.progress = (p.status==='已验收') ? 100 : 40;
    }
    return p;
  }

  function init(){
    state.demoCleared = load(KEYS.demo, false);
    if(!state.demoCleared){
      var c = load(KEYS.contracts, null);
      if(!c){ var s = sampleData(); state.contracts=s.contracts; state.finance=s.finance; state.todos=s.todos; state.projects=s.projects; state.activities=s.activities; persistAll(); }
      else {
        state.contracts=c; state.finance=load(KEYS.finance,{});
        state.todos=load(KEYS.todos,[]); state.projects=load(KEYS.projects,[]);
        state.activities=load(KEYS.acts,[]);
      }
    } else {
      state.contracts=load(KEYS.contracts,[]);
      state.finance=load(KEYS.finance,{});
      state.todos=load(KEYS.todos,[]);
      state.projects=load(KEYS.projects,[]);
      state.activities=load(KEYS.acts,[]);
    }
    state.projects = state.projects.map(normProject);
  }

  /* ================= 计算层 ================= */
  function fmtMoney(n){
    return '¥ ' + Number(n||0).toLocaleString('zh-CN', {maximumFractionDigits:2});
  }
  function fmtMoneyShort(n){
    if(n>=10000) return '¥' + (n/10000).toFixed(n>=1000000?0:1) + '万';
    return '¥ ' + Number(n||0).toLocaleString('zh-CN');
  }
  function calcContractStats(){
    var st = {total:0, amount:0, by:{}, expiring:0, overdueCnt:0, activeCnt:0, pendingCnt:0};
    STATUS.forEach(function(s){ st.by[s] = {cnt:0, amt:0}; });
    state.contracts.forEach(function(c){
      st.total++; st.amount += Number(c.amount||0);
      if(st.by[c.status]) { st.by[c.status].cnt++; st.by[c.status].amt += Number(c.amount||0); }
      if(c.status==='已逾期') st.overdueCnt++;
      if(c.status==='执行中') st.activeCnt++;
      if(c.status==='待审批') st.pendingCnt++;
      if(c.end && c.status==='执行中'){
        var diff = daysBetween(todayStr, c.end);
        if(diff>=0 && diff<=30) st.expiring++;
      }
    });
    return st;
  }
  function calcFinance(){
    var keys = Object.keys(state.finance).sort();
    keys = keys.slice(-6);
    var total = {income:0, expense:0};
    keys.forEach(function(k){
      total.income += Number(state.finance[k].income||0);
      total.expense += Number(state.finance[k].expense||0);
    });
    return {keys:keys, total:total, profit: total.income - total.expense};
  }
  function calcTodayItems(){
    var items = [];
    state.contracts.forEach(function(c){
      if(!c.end) return;
      if((c.status==='执行中'||c.status==='待审批') && c.end < todayStr){
        items.push({type:'合同逾期', cls:'overdue', color:'#E24B4A', title:c.name+' · '+c.client, date:c.end, act:'去处理', kind:'contract-overdue', id:c.id});
      }
    });
    state.contracts.forEach(function(c){
      if(c.end===todayStr && c.status==='执行中'){
        items.push({type:'今日到期', cls:'', color:'#2563EB', title:c.name+' · '+c.client, date:c.end, act:'查看', kind:'contract-today', id:c.id});
      }
    });
    state.projects.forEach(function(p){
      if(p.status==='已逾期'){
        items.push({type:'项目预警', cls:'overdue', color:'#E24B4A', title:'项目逾期：'+p.name, date:'-', act:'查看', kind:'project', id:p.id});
      }
    });
    state.todos.forEach(function(t){
      if(!t.done && t.text){
        items.push({type:'待办', cls:'', color:'#D97706', title:t.text, date:'-', act:'完成', kind:'todo', id:t.id});
      }
    });
    return items;
  }
  function calcTopClients(){
    var map = {};
    state.contracts.forEach(function(c){
      var k = (c.client||'未命名客户').trim() || '未命名客户';
      if(!map[k]) map[k] = {name:k, amt:0, cnt:0};
      map[k].amt += Number(c.amount||0);
      map[k].cnt++;
    });
    var arr = Object.keys(map).map(function(k){ return map[k]; });
    arr.sort(function(a,b){ return b.amt - a.amt; });
    return arr.slice(0,5);
  }
  function totalDataCount(){
    return state.contracts.length + state.projects.length + state.todos.length + Object.keys(state.finance).length;
  }

  /* ================= 渲染层（禁止互调，统一由 refreshAll 调度） ================= */
  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function sparkSvg(vals, color){
    var W=58, H=16, max=Math.max.apply(null, vals.concat([1])), min=Math.min.apply(null, vals);
    if(max===min) min = max - 1;
    var pts = vals.map(function(v,i){
      var x = (i/(vals.length-1))*(W-2)+1;
      var y = H-2 - (v-min)/(max-min)*(H-5);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return '<svg class="k-spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'
      + '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/></svg>';
  }
  function renderKpis(){
    var st = calcContractStats();
    var fin = calcFinance();
    var cur = fin.keys.length ? state.finance[fin.keys[fin.keys.length-1]] : {income:0, expense:0};
    var prev = fin.keys.length>1 ? state.finance[fin.keys[fin.keys.length-2]] : null;
    var incSeries = fin.keys.map(function(k){ return Number(state.finance[k].income||0); });
    var expSeries = fin.keys.map(function(k){ return Number(state.finance[k].expense||0); });
    function mom(curV, prevV){
      if(!prev || !prevV) return '环比 —';
      var p = ((curV-prevV)/prevV*100);
      var cls = p>=0 ? 'up' : 'down';
      var arrow = p>=0 ? '↑' : '↓';
      return '<span class="'+cls+'">'+arrow+' '+Math.abs(p).toFixed(1)+'%</span> 环比';
    }
    var tiles = [
      {cls:'k-green', label:'本月营收', val:fmtMoney(cur.income), sub:mom(cur.income, prev&&prev.income), ico:'M6 1v10M3.5 3.5L6 1l2.5 2.5', color:'#0F9D6E', bg:'#D3F0E4', spark:incSeries},
      {cls:'k-red', label:'本月支出', val:fmtMoney(cur.expense), sub:mom(cur.expense, prev&&prev.expense), ico:'M6 11V1M3.5 8.5L6 11l2.5-2.5', color:'#E24B4A', bg:'#F7D4D4', spark:expSeries},
      {cls:'k-amber', label:'待回款', val:fmtMoney(st.by['已逾期'].amt), sub:'逾期 '+st.overdueCnt+' 笔', ico:'M9.5 3h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6m1.5-6.5l2 2.5-2 2.5', color:'#D97706', bg:'#F7E3C3'},
      {cls:'k-purple', label:'近6月净利润', val:fmtMoney(fin.profit), sub:'收入 '+fmtMoneyShort(fin.total.income)+' · 支出 '+fmtMoneyShort(fin.total.expense), ico:'M1.5 10.5L4.5 7l2 1.5L10.5 4', color:'#7C3AED', bg:'#E6DBF8'},
      {cls:'k-blue', label:'合同总数', val:st.total+' 份', sub:'总金额 '+fmtMoneyShort(st.amount), ico:'M3 1.5h6v9H3zM4.5 4h3M4.5 6h3M4.5 8h2', color:'#2563EB', bg:'#D6E6FB'},
      {cls:'k-cyan', label:'执行中', val:st.activeCnt+' 份', sub:'待审批 '+st.pendingCnt+' 份', ico:'M6 1.5a4.5 4.5 0 1 1-4.5 4.5', color:'#0891B2', bg:'#CFEDF6'},
      {cls:'k-red', label:'已逾期合同', val:st.overdueCnt+' 份', sub:'需尽快跟进', ico:'M6 1.5v3M6 7v.5', color:'#E24B4A', bg:'#F7D4D4'},
      {cls:'k-amber', label:'30天内到期', val:st.expiring+' 份', sub:'提前安排续签', ico:'M6 1a5 5 0 1 1-5 5M6 3.5V6l1.8 1.4', color:'#D97706', bg:'#F7E3C3'}
    ];
    document.getElementById('kpiGrid').innerHTML = tiles.map(function(t){
      return '<div class="kpi '+t.cls+'">'
        + '<div class="k-label">'+t.label+'</div>'
        + '<div class="k-value">'+t.val+'</div>'
        + '<div class="k-sub">'+t.sub+'</div>'
        + '<span class="k-ico" style="background:'+t.bg+';"><svg width="12" height="12" viewBox="0 0 12 12"><path d="'+t.ico+'" fill="none" stroke="'+t.color+'" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
        + (t.spark && t.spark.length>1 ? sparkSvg(t.spark, t.color) : '')
        + '</div>';
    }).join('');
  }

  function renderDonut(){
    var st = calcContractStats();
    var colors = {'待审批':'#EF9F27','执行中':'#2563EB','已完成':'#0F9D6E','已逾期':'#E24B4A'};
    var r=52, C=2*Math.PI*r, off=0, segs='';
    var hasData = st.total>0;
    STATUS.forEach(function(s){
      var cnt = st.by[s].cnt;
      if(!cnt) return;
      var len = cnt/st.total*C;
      segs += '<circle cx="65" cy="65" r="'+r+'" fill="none" stroke="'+colors[s]+'" stroke-width="14" stroke-dasharray="'+(len-2)+' '+(C-len+2)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 65 65)"/>';
      off += len;
    });
    if(!hasData){
      segs = '<circle cx="65" cy="65" r="'+r+'" fill="none" stroke="#EEF4FF" stroke-width="14"/>';
    }
    var svg = '<svg width="130" height="130" viewBox="0 0 130 130">'+segs
      + '<text x="65" y="62" text-anchor="middle" font-size="19" font-weight="600" fill="#1F2937">'+st.total+'</text>'
      + '<text x="65" y="79" text-anchor="middle" font-size="10" fill="#9CA3AF">总合同数</text></svg>';
    var legend = '<div class="legend">';
    STATUS.forEach(function(s){
      legend += '<span><i style="background:'+colors[s]+'"></i>'+s+'<b>'+st.by[s].cnt+'</b></span>';
    });
    legend += '</div>';
    document.getElementById('donutWrap').innerHTML = svg + legend;
  }

  function renderTrend(){
    var fin = calcFinance();
    var svg = document.getElementById('trendChart');
    var W=560, H=168, pad=30, gap=7;
    var max = 1;
    fin.keys.forEach(function(k){
      max = Math.max(max, state.finance[k].income||0, state.finance[k].expense||0);
    });
    var s = '<defs>'
      + '<linearGradient id="gIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>'
      + '<linearGradient id="gEx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6A6A5"/><stop offset="1" stop-color="#EE8786"/></linearGradient>'
      + '<linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C3AED" stop-opacity=".20"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></linearGradient>'
      + '</defs>';
    for(var g=1; g<=3; g++){
      var gy = 26 + (H-56)*(1 - g/3);
      s += '<line x1="'+pad+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pad)+'" y2="'+gy.toFixed(1)+'" stroke="#EEF1F6" stroke-width="1"/>';
      s += '<text x="'+(pad-6)+'" y="'+(gy+3).toFixed(1)+'" text-anchor="end" font-size="8.5" fill="#C2C8D2">'+(max*g/3>=10000?Math.round(max*g/3/10000)+'万':Math.round(max*g/3))+'</text>';
    }
    var groupW = (W - pad*2) / Math.max(fin.keys.length,1);
    var barW = Math.min(18, (groupW - gap*3)/2);
    var linePts = [];
    fin.keys.forEach(function(k, i){
      var x0 = pad + i*groupW;
      var inc = state.finance[k].income||0, exp = state.finance[k].expense||0;
      var hIn = Math.max(2, Math.round(inc/max*(H-56))), hEx = Math.max(2, Math.round(exp/max*(H-56)));
      var cx = x0 + groupW/2;
      s += '<rect x="'+(cx-barW-gap/2)+'" y="'+(H-30-hIn)+'" width="'+barW+'" height="'+hIn+'" rx="3" fill="url(#gIn)"><title>'+k+' 收入 '+fmtMoney(inc)+'</title></rect>';
      s += '<rect x="'+(cx+gap/2)+'" y="'+(H-30-hEx)+'" width="'+barW+'" height="'+hEx+'" rx="3" fill="url(#gEx)"><title>'+k+' 支出 '+fmtMoney(exp)+'</title></rect>';
      var profit = inc - exp;
      var py = H-30 - Math.max(0,profit)/max*(H-56);
      linePts.push(cx.toFixed(1)+','+py.toFixed(1));
      s += '<circle cx="'+cx.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="2.6" fill="#7C3AED" stroke="#fff" stroke-width="1.2"><title>'+k+' 净利润 '+fmtMoney(profit)+'</title></circle>';
      var label = k.slice(5)+'月';
      s += '<text x="'+cx+'" y="'+(H-12)+'" text-anchor="middle" font-size="9.5" fill="#9CA3AF">'+label+'</text>';
    });
    if(linePts.length>1){
      var fx = linePts[0].split(',')[0], lx = linePts[linePts.length-1].split(',')[0];
      s += '<polygon points="'+linePts.join(' ')+' '+lx+','+(H-30)+' '+fx+','+(H-30)+'" fill="url(#gArea)"/>';
      s += '<polyline points="'+linePts.join(' ')+'" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>';
    }
    s += '<line x1="'+pad+'" y1="'+(H-30)+'" x2="'+(W-pad)+'" y2="'+(H-30)+'" stroke="#E8ECF3" stroke-width="1"/>';
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.innerHTML = s;

    var sel = document.getElementById('finMonth');
    var cur = sel.value;
    sel.innerHTML = fin.keys.map(function(k){ return '<option value="'+k+'">'+k+'</option>'; }).join('');
    if(cur && fin.keys.indexOf(cur)>-1) sel.value = cur;
  }

  function renderToday(){
    var items = calcTodayItems();
    var box = document.getElementById('todayList');
    document.getElementById('todayCount').textContent = items.length ? items.length+' 项' : '';
    if(!items.length){
      box.innerHTML = '<div class="empty-tip">太棒了，今天没有逾期或到期事项</div>';
      return;
    }
    var order = {overdue:0, other:1};
    items.sort(function(a,b){ return (order[a.cls]-order[b.cls]) || (a.date<b.date?-1:1); });
    box.innerHTML = items.map(function(it){
      return '<div class="today-item '+(it.cls==='overdue'?'overdue':'')+'">'
        + '<span class="ti-tag" style="background:'+it.color+'">'+esc(it.type)+'</span>'
        + '<span class="ti-title" title="'+esc(it.title)+'">'+esc(it.title)+'</span>'
        + '<span class="ti-date">'+esc(it.date)+'</span>'
        + '<button class="ti-btn" data-tkind="'+it.kind+'" data-tid="'+it.id+'">'+esc(it.act)+'</button>'
        + '</div>';
    }).join('');
  }

  function renderChips(){
    var st = calcContractStats();
    var defs = [
      {v:'', label:'全部', n:st.total},
      {v:'待审批', label:'待审批', n:st.by['待审批'].cnt},
      {v:'执行中', label:'执行中', n:st.by['执行中'].cnt},
      {v:'已完成', label:'已完成', n:st.by['已完成'].cnt},
      {v:'已逾期', label:'已逾期', n:st.by['已逾期'].cnt, red:true}
    ];
    document.getElementById('contractChips').innerHTML = defs.map(function(d){
      return '<span class="chip'+(d.red?' c-red':'')+(state.filterStatus===d.v?' active':'')+'" data-chip="'+d.v+'">'+d.label+'<b>'+d.n+'</b></span>';
    }).join('');
  }

  function renderContracts(){
    var list = state.contracts.slice();
    if(state.filterStatus) list = list.filter(function(c){ return c.status===state.filterStatus; });
    if(state.searchText){
      var q = state.searchText.toLowerCase();
      list = list.filter(function(c){
        return (c.name||'').toLowerCase().indexOf(q)>-1 || (c.client||'').toLowerCase().indexOf(q)>-1 || (c.owner||'').toLowerCase().indexOf(q)>-1;
      });
    }
    list.sort(function(a,b){ return (a.end||'9999') < (b.end||'9999') ? -1 : 1; });
    var pillCls = {'待审批':'sp-amber','执行中':'sp-blue','已完成':'sp-green','已逾期':'sp-red'};
    var body = document.getElementById('contractBody');
    if(!list.length){
      body.innerHTML = '<tr><td colspan="8"><div class="empty-tip">'+(state.searchText?'未找到匹配的合同，换个关键词试试':'暂无合同，点击右上角「+ 新增合同」添加')+'</div></td></tr>';
      return;
    }
    body.innerHTML = list.map(function(c){
      var overdueMark = (c.status==='执行中'&&c.end&&c.end<todayStr) ? ' <span class="status-pill sp-red"><i></i>到期未处理</span>' : '';
      return '<tr>'
        + '<td style="max-width:210px;overflow:hidden;text-overflow:ellipsis;" title="'+esc(c.name)+'">'+esc(c.name)+'</td>'
        + '<td>'+esc(c.client)+'</td>'
        + '<td class="money">'+fmtMoney(c.amount)+'</td>'
        + '<td><span class="status-pill '+(pillCls[c.status]||'sp-blue')+'"><i></i>'+esc(c.status)+'</span>'+overdueMark+'</td>'
        + '<td>'+esc(c.owner)+'</td>'
        + '<td>'+esc(c.sign||'—')+'</td>'
        + '<td>'+esc(c.end||'—')+'</td>'
        + '<td><select class="row-status" data-cid="'+c.id+'">'
        + STATUS.map(function(s){ return '<option value="'+s+'"'+(s===c.status?' selected':'')+'>'+s+'</option>'; }).join('')
        + '</select> <button class="link-btn" data-del="'+c.id+'">删除</button></td>'
        + '</tr>';
    }).join('');
  }

  function renderTopClients(){
    var list = calcTopClients();
    var box = document.getElementById('topClients');
    if(!list.length){
      box.innerHTML = '<div class="empty-tip">暂无客户数据</div>';
      return;
    }
    var max = list[0].amt || 1;
    box.innerHTML = list.map(function(c, i){
      var pct = Math.max(4, Math.round(c.amt/max*100));
      return '<div class="top-item">'
        + '<div class="top-line">'
        + '<span class="top-rank'+(i<3?' r'+(i+1):'')+'">'+(i+1)+'</span>'
        + '<span class="top-name" title="'+esc(c.name)+'">'+esc(c.name)+'</span>'
        + '<span class="top-amt">'+fmtMoneyShort(c.amt)+' · '+c.cnt+' 份</span>'
        + '</div>'
        + '<div class="top-bar"><i style="width:'+pct+'%;"></i></div>'
        + '</div>';
    }).join('');
  }

  function renderTimeline(){
    var box = document.getElementById('timeline');
    if(!state.activities.length){
      box.innerHTML = '<div class="empty-tip">暂无动态，操作后会自动记录在这里</div>';
      return;
    }
    box.innerHTML = state.activities.slice(0,6).map(function(a){
      return '<div class="tl-item '+(a.cls||'')+'">'
        + '<span class="tl-dot"></span>'
        + '<div class="tl-body"><div class="tl-text" title="'+esc(a.text)+'">'+esc(a.text)+'</div><div class="tl-time">'+esc(a.time||'')+'</div></div>'
        + '</div>';
    }).join('');
  }

  function renderProjects(){
    var list = state.projects.slice();
    var order = {'已逾期':0,'进行中':1,'已验收':2};
    list.sort(function(a,b){ return (order[a.status]||9)-(order[b.status]||9); });
    var pillCls = {'进行中':'sp-blue','已验收':'sp-green','已逾期':'sp-red'};
    var box = document.getElementById('projList');
    if(!list.length){ box.innerHTML = '<div class="empty-tip">暂无项目，在下方添加</div>'; }
    else{
      box.innerHTML = list.map(function(p){
        var pct = Math.max(0, Math.min(100, Math.round(p.progress||0)));
        var barCls = p.status==='已逾期' ? ' over' : (p.status==='已验收' ? ' done' : '');
        return '<div class="proj-item'+(p.status==='已验收'?' done':'')+'">'
          + '<div class="proj-top">'
          + '<span class="status-pill '+(pillCls[p.status]||'sp-blue')+'" style="flex-shrink:0;"><i></i>'+esc(p.status)+'</span>'
          + '<span class="pj-name" title="'+esc(p.name)+'">'+esc(p.name)+'</span>'
          + (p.status==='进行中'?'<button class="pj-btn" data-proj-finish="'+p.id+'">验收</button>':'')
          + '<button class="pj-btn" data-proj-del="'+p.id+'">删</button>'
          + '</div>'
          + '<div class="pj-progress">'
          + '<div class="pj-bar'+barCls+'" data-proj-bar="'+p.id+'" title="点击进度 +10%"><i style="width:'+pct+'%;"></i></div>'
          + '<span class="pj-pct">'+pct+'%</span>'
          + '</div>'
          + '</div>';
      }).join('');
    }
    document.getElementById('projStat').textContent = list.length+' 个 · 进行中 '+
      list.filter(function(p){return p.status==='进行中';}).length;
  }

  function renderTodoPanel(){
    var st = calcContractStats();
    var panel = document.getElementById('todoPanel');
    var cards = '';
    if(st.overdueCnt) cards += '<div class="todo-card" style="background:var(--red-bg);color:#A32D2D;"><span class="tc-text">'+st.overdueCnt+' 笔合同已逾期</span><span class="tc-act" data-nav-go="contracts">处理 ›</span></div>';
    if(st.pendingCnt) cards += '<div class="todo-card" style="background:var(--amber-bg);color:#B45309;"><span class="tc-text">'+st.pendingCnt+' 份合同待审批</span><span class="tc-act" data-nav-go="contracts">去审批 ›</span></div>';
    if(st.expiring) cards += '<div class="todo-card" style="background:var(--primary-light);color:var(--primary);"><span class="tc-text">'+st.expiring+' 份合同 30 天内到期</span><span class="tc-act" data-nav-go="contracts">查看 ›</span></div>';
    panel.innerHTML = cards || '<div class="empty-tip">暂无风险提醒</div>';

    var checks = state.todos.map(function(t){
      return '<div class="check-row'+(t.done?' done':'')+'">'
        + '<input type="checkbox" '+(t.done?'checked':'')+' data-todo="'+t.id+'">'
        + '<span title="'+esc(t.text)+'">'+esc(t.text)+'</span>'
        + '<button class="del" data-todo-del="'+t.id+'">×</button></div>';
    }).join('');
    document.getElementById('todoChecks').innerHTML = checks || '';
  }

  function renderBanner(){
    var st = calcContractStats();
    var fin = calcFinance();
    var cur = fin.keys.length ? state.finance[fin.keys[fin.keys.length-1]] : {income:0};
    var d = new Date();
    var h = d.getHours();
    var greet = h<6 ? '凌晨好' : (h<12 ? '上午好' : (h<14 ? '中午好' : (h<18 ? '下午好' : '晚上好')));
    document.getElementById('bannerHi').textContent = greet + '，管理者';
    document.getElementById('bannerSub').textContent = '今天是 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日 · 数据实时更新于本机';
    document.getElementById('bannerDate').textContent = fmtDate(d);
    var chips = ''
      + '<span class="b-chip">本月营收 <b>'+fmtMoneyShort(cur.income||0)+'</b></span>'
      + '<span class="b-chip">在途合同 <b>'+st.activeCnt+'</b> 份</span>'
      + '<span class="b-chip">待审批 <b>'+st.pendingCnt+'</b> 份</span>'
      + (st.overdueCnt ? '<span class="b-chip warn">逾期 <b>'+st.overdueCnt+'</b> 笔</span>' : '<span class="b-chip">逾期 <b>0</b> 笔</span>');
    document.getElementById('bannerChips').innerHTML = chips;
  }

  function renderBackupHint(){
    var n = totalDataCount();
    document.getElementById('backupHint').className = n>=30 ? 'hint-bar show' : 'hint-bar';
    var dot = document.getElementById('navDot');
    var items = calcTodayItems();
    dot.style.display = items.length ? 'block' : 'none';
  }

  /* ================= 统一刷新入口 ================= */
  function refreshAll(){
    renderBanner();
    renderKpis();
    renderDonut();
    renderTrend();
    renderToday();
    renderChips();
    renderContracts();
    renderTopClients();
    renderTimeline();
    renderProjects();
    renderTodoPanel();
    renderBackupHint();
  }

  /* ================= 交互层 ================= */
  var toastTimer = null;
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.style.display='none'; }, 2200);
  }

  var confirmCb = null;
  function askConfirm(title, text, cb){
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmText').textContent = text;
    confirmCb = cb;
    document.getElementById('confirmModal').classList.add('show');
  }
  function closeModal(id){ document.getElementById(id).classList.remove('show'); }

  function navGo(id){
    var el = document.getElementById(id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function exportJSON(){
    var data = {version:2, exportedAt:new Date().toISOString(),
      contracts:state.contracts, finance:state.finance, todos:state.todos,
      projects:state.projects, activities:state.activities, demoCleared:state.demoCleared};
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '企业管理工作台备份_'+todayStr+'.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('已导出 JSON 备份');
  }
  function importJSON(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var d = JSON.parse(reader.result);
        if(!d || typeof d !== 'object') throw new Error('格式错误');
        state.contracts = Array.isArray(d.contracts)?d.contracts:[];
        state.finance = (d.finance&&typeof d.finance==='object')?d.finance:{};
        state.todos = Array.isArray(d.todos)?d.todos:[];
        state.projects = Array.isArray(d.projects)?d.projects.map(normProject):[];
        state.activities = Array.isArray(d.activities)?d.activities:[];
        state.demoCleared = !!d.demoCleared;
        persistAll(); refreshAll();
        toast('导入成功，数据已恢复');
      }catch(e){ toast('导入失败：文件格式不正确'); }
    };
    reader.readAsText(file);
  }

  function bindEvents(){
    var navMap = {dashboard:'dashboard', contracts:'contracts', finance:'finance', projects:'projects', today:'today'};
    document.querySelectorAll('.nav-tabs span').forEach(function(sp){
      sp.addEventListener('click', function(){
        document.querySelectorAll('.nav-tabs span').forEach(function(x){x.classList.remove('active');});
        sp.classList.add('active');
        navGo(navMap[sp.getAttribute('data-nav')] || 'dashboard');
      });
    });
    document.querySelectorAll('.bottom-nav a').forEach(function(a){
      a.addEventListener('click', function(){
        document.querySelectorAll('.bottom-nav a').forEach(function(x){x.classList.remove('active');});
        a.classList.add('active');
      });
    });

    document.getElementById('globalSearch').addEventListener('keydown', function(e){
      if(e.key==='Enter'){
        state.searchText = this.value.trim();
        document.getElementById('contractSearch').value = state.searchText;
        renderContracts();
        navGo('contracts');
      }
    });

    document.getElementById('bannerAddBtn').addEventListener('click', openContractModal);

    document.getElementById('contractChips').addEventListener('click', function(e){
      var chip = e.target.closest('[data-chip]');
      if(!chip) return;
      state.filterStatus = chip.getAttribute('data-chip');
      document.getElementById('contractStatusFilter').value = state.filterStatus;
      renderChips(); renderContracts();
    });

    document.getElementById('contractSearch').addEventListener('input', function(){
      state.searchText = this.value.trim(); renderContracts();
    });
    document.getElementById('contractStatusFilter').addEventListener('change', function(){
      state.filterStatus = this.value; renderChips(); renderContracts();
    });

    document.getElementById('contractBody').addEventListener('change', function(e){
      var sel = e.target.closest('.row-status');
      if(sel){
        var c = state.contracts.find(function(x){ return x.id===sel.getAttribute('data-cid'); });
        if(c){
          var old = c.status;
          c.status = sel.value;
          pushActivity('合同「'+c.name+'」状态由「'+old+'」变更为「'+c.status+'」', c.status==='已逾期'?'hot':(c.status==='已完成'?'ok':''));
          persistAll(); refreshAll(); toast('状态已更新为「'+c.status+'」');
        }
      }
    });
    document.getElementById('contractBody').addEventListener('click', function(e){
      var del = e.target.closest('[data-del]');
      if(del){
        var id = del.getAttribute('data-del');
        var c = state.contracts.find(function(x){ return x.id===id; });
        askConfirm('删除合同', '确定删除合同「'+(c?c.name:'')+'」吗？删除后不可恢复。', function(){
          state.contracts = state.contracts.filter(function(x){ return x.id!==id; });
          pushActivity('删除了合同「'+(c?c.name:'')+'」', 'hot');
          persistAll(); refreshAll(); toast('已删除');
        });
      }
    });

    function openContractModal(){
      document.getElementById('cName').value='';
      document.getElementById('cClient').value='';
      document.getElementById('cAmount').value='';
      document.getElementById('cStatus').value='执行中';
      document.getElementById('cOwner').value='';
      document.getElementById('cSign').value=todayStr;
      document.getElementById('cEnd').value='';
      document.getElementById('cNote').value='';
      document.getElementById('contractModal').classList.add('show');
      setTimeout(function(){ document.getElementById('cName').focus(); }, 60);
    }
    document.getElementById('addContractBtn').addEventListener('click', openContractModal);
    document.getElementById('qiContract').addEventListener('click', openContractModal);
    document.getElementById('contractSaveBtn').addEventListener('click', function(){
      var name = document.getElementById('cName').value.trim();
      var client = document.getElementById('cClient').value.trim();
      var amount = parseFloat(document.getElementById('cAmount').value);
      if(!name){ toast('请填写合同名称'); return; }
      if(!client){ toast('请填写客户名称'); return; }
      if(isNaN(amount) || amount<0){ toast('请填写正确的合同金额'); return; }
      state.contracts.push({
        id:uid(), name:name, client:client, amount:amount,
        status:document.getElementById('cStatus').value,
        owner:document.getElementById('cOwner').value.trim(),
        sign:document.getElementById('cSign').value,
        end:document.getElementById('cEnd').value,
        note:document.getElementById('cNote').value.trim()
      });
      pushActivity('新增合同「'+name+'」，金额 '+fmtMoney(amount), 'ok');
      persistAll(); refreshAll();
      closeModal('contractModal');
      toast('合同已保存');
    });

    document.getElementById('finAddBtn').addEventListener('click', function(){
      var m = document.getElementById('finMonth').value;
      var inc = parseFloat(document.getElementById('finIncome').value);
      var exp = parseFloat(document.getElementById('finExpense').value);
      if(!m){ toast('暂无月份可选'); return; }
      if(isNaN(inc)&&isNaN(exp)){ toast('请至少填写收入或支出'); return; }
      var f = state.finance[m] || {income:0, expense:0};
      if(!isNaN(inc)) f.income = inc;
      if(!isNaN(exp)) f.expense = exp;
      state.finance[m] = f;
      document.getElementById('finIncome').value='';
      document.getElementById('finExpense').value='';
      pushActivity('更新了 '+m+' 的收支记录（收入 '+fmtMoney(f.income)+' / 支出 '+fmtMoney(f.expense)+'）');
      persistAll(); refreshAll(); toast(m+' 收支已更新');
    });

    document.getElementById('todayList').addEventListener('click', function(e){
      var btn = e.target.closest('[data-tkind]');
      if(!btn) return;
      var kind = btn.getAttribute('data-tkind');
      var id = btn.getAttribute('data-tid');
      if(kind==='contract-overdue'){
        var c = state.contracts.find(function(x){ return x.id===id; });
        if(c){ c.status='已完成'; pushActivity('逾期合同「'+c.name+'」已标记处理完成', 'ok'); persistAll(); refreshAll(); toast('「'+c.name+'」已标记处理完成'); }
      } else if(kind==='contract-today'){
        navGo('contracts');
      } else if(kind==='project'){
        navGo('projects');
      } else if(kind==='todo'){
        var t = state.todos.find(function(x){ return x.id===id; });
        if(t){ t.done=true; persistAll(); refreshAll(); toast('待办已完成'); }
      }
    });

    function addProject(){
      var v = document.getElementById('projInput').value.trim();
      if(!v){ toast('请输入项目名称'); return; }
      state.projects.push({id:uid(), name:v, status:'进行中', progress:10});
      pushActivity('立项新项目「'+v+'」', 'ok');
      document.getElementById('projInput').value='';
      persistAll(); refreshAll(); toast('项目已添加');
    }
    document.getElementById('projAddBtn').addEventListener('click', addProject);
    document.getElementById('qiProject').addEventListener('click', function(){
      navGo('projects');
      setTimeout(function(){ document.getElementById('projInput').focus(); }, 350);
    });
    document.getElementById('projInput').addEventListener('keydown', function(e){ if(e.key==='Enter') addProject(); });
    document.getElementById('projList').addEventListener('click', function(e){
      var fin = e.target.closest('[data-proj-finish]');
      var del = e.target.closest('[data-proj-del]');
      var bar = e.target.closest('[data-proj-bar]');
      if(fin){
        var p = state.projects.find(function(x){ return x.id===fin.getAttribute('data-proj-finish'); });
        if(p){ p.status='已验收'; p.progress=100; pushActivity('项目「'+p.name+'」已验收完成', 'ok'); persistAll(); refreshAll(); toast('项目已验收'); }
      } else if(del){
        var id = del.getAttribute('data-proj-del');
        var pp = state.projects.find(function(x){ return x.id===id; });
        askConfirm('删除项目', '确定删除该项目吗？', function(){
          state.projects = state.projects.filter(function(x){ return x.id!==id; });
          pushActivity('删除了项目「'+(pp?pp.name:'')+'」', 'hot');
          persistAll(); refreshAll(); toast('已删除');
        });
      } else if(bar){
        var bp = state.projects.find(function(x){ return x.id===bar.getAttribute('data-proj-bar'); });
        if(bp && bp.status!=='已验收'){
          bp.progress = Math.min(100, (bp.progress||0) + 10);
          if(bp.progress>=100){ bp.status='已验收'; pushActivity('项目「'+bp.name+'」进度达到 100%，已自动验收', 'ok'); toast('进度 100%，项目已验收'); }
          else { pushActivity('「'+bp.name+'」进度更新至 '+bp.progress+'%'); toast('进度更新至 '+bp.progress+'%'); }
          persistAll(); refreshAll();
        }
      }
    });

    function addTodo(){
      var v = document.getElementById('todoInput').value.trim();
      if(!v){ toast('请输入待办内容'); return; }
      state.todos.push({id:uid(), text:v, done:false});
      document.getElementById('todoInput').value='';
      persistAll(); refreshAll(); toast('待办已添加');
    }
    document.getElementById('todoAddBtn').addEventListener('click', addTodo);
    document.getElementById('qiTodo').addEventListener('click', function(){
      navGo('today');
      setTimeout(function(){ document.getElementById('todoInput').focus(); }, 350);
    });
    document.getElementById('todoInput').addEventListener('keydown', function(e){ if(e.key==='Enter') addTodo(); });
    document.getElementById('todoChecks').addEventListener('change', function(e){
      var cb = e.target.closest('[data-todo]');
      if(cb){
        var t = state.todos.find(function(x){ return x.id===cb.getAttribute('data-todo'); });
        if(t){ t.done = cb.checked; persistAll(); refreshAll(); }
      }
    });
    document.getElementById('todoChecks').addEventListener('click', function(e){
      var del = e.target.closest('[data-todo-del]');
      if(del){
        state.todos = state.todos.filter(function(x){ return x.id!==del.getAttribute('data-todo-del'); });
        persistAll(); refreshAll();
      }
    });
    document.getElementById('todoPanel').addEventListener('click', function(e){
      var go = e.target.closest('[data-nav-go]');
      if(go) navGo(go.getAttribute('data-nav-go'));
    });

    document.getElementById('qiFinance').addEventListener('click', function(){ navGo('finance'); });

    document.getElementById('qiExport').addEventListener('click', exportJSON);
    document.getElementById('qiImport').addEventListener('click', function(){
      document.getElementById('importFile').click();
    });
    document.getElementById('importFile').addEventListener('change', function(){
      if(this.files && this.files[0]) importJSON(this.files[0]);
      this.value='';
    });

    document.getElementById('clearDemoBtn').addEventListener('click', function(){
      askConfirm('清空示例数据', '将删除当前全部演示数据（合同、财务、项目、待办、动态），页面恢复空白。确定继续吗？', function(){
        state.contracts=[]; state.finance={}; state.todos=[]; state.projects=[]; state.activities=[];
        state.demoCleared=true;
        persistAll(); refreshAll(); toast('示例数据已清空');
      });
    });
    document.getElementById('clearAllBtn').addEventListener('click', function(){
      askConfirm('清空全部数据', '此操作将删除本工作台保存的全部数据，且不可恢复。确定继续吗？', function(){
        state.contracts=[]; state.finance={}; state.todos=[]; state.projects=[]; state.activities=[];
        state.demoCleared=true;
        persistAll(); refreshAll(); toast('已清空全部数据');
      });
    });

    document.querySelectorAll('[data-close]').forEach(function(btn){
      btn.addEventListener('click', function(){ closeModal(btn.getAttribute('data-close')); });
    });
    document.getElementById('confirmCancelBtn').addEventListener('click', function(){
      confirmCb=null; closeModal('confirmModal');
    });
    document.getElementById('confirmOkBtn').addEventListener('click', function(){
      var cb = confirmCb; confirmCb=null;
      closeModal('confirmModal');
      if(cb) cb();
    });
    document.querySelectorAll('.mask').forEach(function(m){
      m.addEventListener('click', function(e){ if(e.target===m) m.classList.remove('show'); });
    });
  }

  /* ================= 初始化 ================= */
  document.addEventListener('DOMContentLoaded', function(){
    init();
    bindEvents();
    refreshAll();
  });
})();
</script>
</body>
</html>
