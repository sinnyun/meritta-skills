<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>运动打卡 · 健身减脂与身体成长工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%234F5AE5'/%3E%3Cpath d='M14 32c2-8 5-13 10-15l8 3-2 8c-4 2-9 2-13 1z' fill='%23FFFFFF'/%3E%3Ccircle cx='33' cy='18' r='4.5' fill='%23F2C14E'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#262B47; --ink2:#5A5F7A; --ink3:#9398B3;
  --paper:#F3F4FB; --card:#FFFFFF; --line:#EEF0F9; --line2:#DCDFF2;
  --acc:#4F5AE5; --acc-soft:#E9EBFD; --acc-deep:#3A44BC;
  --sage:#2FA373; --sage-soft:#E2F6EC;
  --water:#4E7FE8; --water-soft:#E7EEFD;
  --food:#E8A23B; --food-soft:#FCF1DC;
  --warn:#E5484D; --warn-soft:#FDE7E9;
  --gold:#D9982B; --gold-soft:#FCF1DC;
  --r:18px; --shadow:0 1px 2px rgba(38,43,71,.03),0 10px 30px rgba(79,90,229,.09);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;color:var(--ink);font-size:15px;line-height:1.55;overflow:hidden}
#app{position:relative;max-width:430px;height:calc(100dvh - 28px);margin:14px auto;background:var(--paper);border-radius:24px;box-shadow:0 20px 60px rgba(38,43,71,.12);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:480px){#app{height:100dvh;margin:0;border-radius:0;box-shadow:none}}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.art{display:block;width:100%;height:100%}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;font-size:15px}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);border:1.5px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--card);width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
::-webkit-scrollbar{display:none}

/* ===== 主框架 ===== */
#pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(104px + env(safe-area-inset-bottom));display:none;overscroll-behavior:contain}
.page.active{display:block;animation:pgIn .2s ease}
@keyframes pgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#tabbar{flex:none;margin:0 12px calc(10px + env(safe-area-inset-bottom));height:62px;background:var(--card);border-radius:20px;box-shadow:0 10px 30px rgba(38,43,71,.14);display:flex;z-index:30;align-items:stretch}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);font-size:10.5px;min-height:44px}
#tabbar button svg.ic{width:21px;height:21px;padding:4px;border-radius:10px;transition:background .15s,color .15s}
#tabbar button.on{color:var(--acc);font-weight:600}
#tabbar button.on svg.ic{background:var(--acc-soft);stroke-width:2.1}

/* ===== 通用组件 ===== */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--paper),var(--paper));display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:19px;flex:1;letter-spacing:.5px;font-weight:800}
.iconbtn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--ink2);background:var(--card);border:1px solid var(--line);flex:none}
.iconbtn:active{transform:scale(.93)}
.wrap{padding:14px 16px 0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
.sect h2{font-size:16px}
.sect .lnk{color:var(--acc);font-size:13px;font-weight:600;display:flex;align-items:center;gap:2px}
.btn{min-height:46px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 18px;font-weight:600;font-size:15px;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn-p{background:var(--ink);color:#FFFFFF}
.btn-a{background:var(--acc);color:#fff}
.btn-g{background:var(--card);border:1.5px solid var(--line2);color:var(--ink2)}
.btn-d{background:var(--warn-soft);color:var(--warn)}
.btn-blk{display:block;width:100%;box-sizing:border-box}
.chip{padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line2);font-size:12.5px;color:var(--ink2);white-space:nowrap;min-height:30px;display:inline-flex;align-items:center}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 4px 12px rgba(79,90,229,.3)}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--acc-soft);color:var(--acc-deep);font-weight:600}
.tag.g{background:var(--sage-soft);color:#1F7A50}.tag.b{background:var(--water-soft);color:#2E5BC6}
.tag.f{background:var(--food-soft);color:#A66A14}.tag.k{background:#EEF0F8;color:var(--ink2)}
.st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.st.done{background:var(--sage-soft);color:#1F7A50}
.st.todo{background:var(--acc-soft);color:var(--acc-deep)}
.st.miss{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;padding:34px 20px;color:var(--ink3)}
.empty p{font-size:13px;margin:6px 0 16px}
.hr{height:1px;background:var(--line);margin:14px 0}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:12px;background:var(--ink);color:#FFFFFF;font-weight:700}

/* ===== 首页 ===== */
#pg-home .topbar{border-bottom:0;background:transparent;position:relative;z-index:3;padding:0 12px}
.brand{display:flex;align-items:center;gap:9px}
.brand .mkw{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.brand .mk{width:24px;height:24px;filter:none}
.brand .tt{color:#FFFFFF;text-shadow:0 1px 6px rgba(38,43,71,.45)}
.brand .tt b{font-size:19px;letter-spacing:3px;display:block;line-height:1.1}
.brand .tt i{font-style:normal;font-size:9.5px;letter-spacing:1.5px;opacity:.85}
.hero{position:relative;display:flex;flex-direction:column;padding:20px 14px 14px;margin:10px 12px 0;border-radius:20px;overflow:hidden;box-shadow:0 12px 32px rgba(79,90,229,.28)}
.hero .hb{position:absolute;inset:0;background:linear-gradient(135deg,#7B87F0,#4F5AE5 52%,#3A44BC)}
.hero .hb::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;border:30px solid rgba(255,255,255,.09);right:-56px;top:-64px}
.hero .hb::after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.07);left:-42px;bottom:58px}
.hero .deco{position:absolute;right:88px;bottom:96px;width:150px;height:150px;color:rgba(255,255,255,.14);transform:rotate(-18deg)}
.hero .deco svg{width:100%;height:100%;stroke:currentColor}
.hero .greet{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 12px 16px;color:#fff}
.hero .greet .gt{min-width:0}
.hero .greet b{font-size:22px;font-weight:800;display:block;letter-spacing:1px}
.hero .greet small{font-size:11px;opacity:.85;letter-spacing:.5px}
.hero .art-box{position:absolute;inset:0}
.hero .veil{position:absolute;inset:0;background:linear-gradient(rgba(20,24,26,.42),rgba(20,24,26,.05) 34%,rgba(20,24,26,0) 55%,rgba(20,24,26,.5));pointer-events:none}
.hero .h-cta{position:relative;z-index:3;margin:0 12px;display:flex;gap:10px;align-items:stretch}
.hero .h-cta .main{flex:1;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:0 6px 18px rgba(38,43,71,.28)}
.hero .h-cta .main small{color:var(--ink3);font-size:11px;display:block}
.hero .h-cta .main b{font-size:15px}
.hero .h-cta .go{width:74px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 18px rgba(79,90,229,.4)}
.streak{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(255,255,255,.16);color:#fff;border-radius:14px;padding:8px 13px;font-size:10px;line-height:1.3;white-space:nowrap}
.streak .srow{display:flex;align-items:center;gap:4px}
.streak b{font-size:18px;color:#FFD98A;line-height:1}
.todaybox{margin:12px 14px 0;position:relative;z-index:6;padding:13px 14px}
.todaybox .row{display:flex;align-items:center;gap:10px;padding:9px 2px}
.todaybox .row+.row{border-top:1px dashed var(--line)}
.todaybox .row .tx{flex:1;min-width:0}
.todaybox .row .tx small{display:block;color:var(--ink3);font-size:11px}
.todaybox .row .tx b{font-size:13.5px;font-weight:600}
.todaybox .row.overdue .tx b{color:var(--warn)}
.mini{min-height:32px;padding:0 13px;border-radius:9px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;flex:none}
.mini.p{background:var(--ink);color:#fff}.mini.a{background:var(--acc);color:#fff}.mini.g{background:var(--card);border:1px solid var(--line2);color:var(--ink2)}
.waterbar{height:7px;border-radius:99px;background:var(--water-soft);overflow:hidden;flex:1}
.todaybox .waterbar{max-width:64px}
.waterbar i{display:block;height:100%;background:var(--water);border-radius:99px;transition:width .5s ease}
.statgrid{display:flex;gap:12px}
.statgrid .card{flex:1;padding:14px 14px 12px;min-width:0}
.statgrid .sicb{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.statgrid .sicb svg{width:19px;height:19px}
.statgrid .lbl{font-size:11px;color:var(--ink3);margin-top:2px}
.statgrid .v{font-size:22px;font-weight:900;letter-spacing:-.5px}
.statgrid .v small{font-size:11px;color:var(--ink3);font-weight:500;margin-left:2px}
.statgrid .d{font-size:10.5px;margin-top:2px;color:#1F7A50}
.statgrid .card.heroic{background:linear-gradient(140deg,#7B87F0,#4F5AE5 58%,#3A44BC);box-shadow:0 10px 26px rgba(79,90,229,.36)}
.statgrid .card.heroic .v,.statgrid .card.heroic .lbl,.statgrid .card.heroic .d{color:#fff}
.statgrid .card.heroic .v small{color:rgba(255,255,255,.75)}
.statgrid .card.heroic .d{color:rgba(255,255,255,.85)}
.statgrid .card.heroic .sicb{background:rgba(255,255,255,.2);color:#fff}
.statgrid .d.down{color:var(--water)}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring .pc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:2px 16px 4px}
.quick button{width:100%;min-width:0;background:var(--card);border-radius:16px;padding:12px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--ink2);font-weight:600;box-shadow:var(--shadow)}
.quick button svg{width:20px;height:20px;padding:8px;border-radius:12px;background:var(--acc-soft);color:var(--acc);box-sizing:content-box}
.quick button.q2 svg{background:var(--water-soft);color:var(--water)}.quick button.q3 svg{background:var(--food-soft);color:var(--food)}.quick button.q4 svg{background:var(--sage-soft);color:var(--sage)}.quick button.q5 svg{background:var(--gold-soft);color:var(--gold)}
.rec-mini{display:flex;gap:11px;padding:10px;align-items:center}
.rec-mini .thumb{width:56px;height:56px;border-radius:11px;overflow:hidden;flex:none;background:var(--paper)}
.rec-mini .thumb svg{width:100%;height:100%}
.rec-mini .tx{flex:1;min-width:0}
.rec-mini .tx b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-mini .tx small{color:var(--ink3);font-size:11.5px}
.rec-mini .val{text-align:right;font-weight:800;font-size:15px;flex:none}
.rec-mini .val small{display:block;font-weight:500;font-size:10.5px;color:var(--ink3)}
.badges{display:flex;gap:9px;overflow-x:auto;padding:2px 16px 6px}
.badge{flex:none;width:104px;background:var(--card);border-radius:16px;padding:12px 10px 10px;text-align:center;box-shadow:var(--shadow)}
.badge .bic{width:42px;height:42px;margin:0 auto;border-radius:14px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.badge.locked .bic{background:#EEF0F8;color:var(--ink3)}
.badge b{display:block;font-size:11.5px;margin-top:6px}
.badge small{font-size:10px;color:var(--ink3)}
.badge.locked{opacity:.62;border-style:dashed}
.actdot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none;margin-top:7px}
.actline{display:flex;gap:10px;padding:7px 2px;align-items:flex-start}
.actline small{color:var(--ink3);font-size:11px;flex:none;width:74px;padding-top:1px}
.actline p{flex:1;font-size:12.5px;min-width:0}
.actline p b{cursor:pointer;color:var(--acc);font-weight:600}

/* ===== 记录库 ===== */
.libtools{display:flex;gap:8px;padding:12px 16px 8px}
.searchbox{flex:1;display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:0 11px}
.searchbox input{border:0;padding:10px 0;background:none}
.ftabs{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 10px}
.ftabs button{flex:none}
.liblist{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.rcard{display:flex;gap:11px;padding:10px;position:relative}
.rcard .thumb{width:74px;border-radius:11px;overflow:hidden;flex:none;background:var(--paper);align-self:stretch;min-height:74px;position:relative}
.rcard .thumb svg{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}
.rcard .thumb.r34 svg{height:200%;top:-50%}
.rcard .body{flex:1;min-width:0;display:flex;flex-direction:column}
.rcard .body .r1{display:flex;align-items:center;gap:6px}
.rcard .body .r1 b{font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
.rcard .kv{font-size:12.5px;color:var(--ink2);margin-top:auto;padding-top:5px}
.rcard .kv b{color:var(--ink);font-weight:700}
.fab{position:absolute;right:16px;bottom:calc(112px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:17px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(79,90,229,.42);z-index:15}
.fab:active{transform:scale(.92)}
.fab svg.ic{width:24px;height:24px;stroke-width:2.2}

/* ===== 计划页 ===== */
.calcard{margin:12px 16px 0;padding:13px 13px 9px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font-size:15px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calgrid .wd{font-size:10.5px;color:var(--ink3);padding:4px 0}
.cal-d{position:relative;height:40px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink2)}
.cal-d .dots{position:absolute;bottom:4px;display:flex;gap:2px}
.cal-d .dots i{width:4px;height:4px;border-radius:50%}
.cal-d.dim{color:#C7CCE8}
.cal-d.sel{background:var(--ink);color:#fff;font-weight:700}
.cal-d.today{outline:1.5px solid var(--acc);outline-offset:-1.5px;font-weight:700}
.cal-d .n{line-height:1}
.tl{padding:4px 16px}
.tl-item{display:flex;gap:11px}
.tl-rail{display:flex;flex-direction:column;align-items:center;flex:none;width:26px}
.tl-rail .dot{width:30px;height:30px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.tl-rail .line{flex:1;width:1.5px;background:var(--line);min-height:12px}
.tl-card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:10px;min-width:0}
.tl-card .t{display:flex;align-items:center;gap:6px}
.tl-card .t b{flex:1;font-size:13.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-card .k{font-size:12px;color:var(--ink2);margin-top:2px}
.dayhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.dayhead b{font-size:15px}

/* ===== 相册 ===== */
.albstat{padding:12px 16px 2px;font-size:12.5px;color:var(--ink3)}
.albgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px}
.alb-w{grid-column:span 2}
.albcell{position:relative;border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.albcell .artw{display:block;height:calc(100% - 34px);overflow:hidden}
.albcell .cap{position:relative;height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;background:var(--card);font-size:11px;color:var(--ink3)}
.albcell .cap b{font-size:12px;color:var(--ink);font-weight:700}
.upbox{grid-column:span 2;border:1.5px dashed var(--line2);border-radius:13px;min-height:64px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink3);font-size:13px;background:rgba(255,255,255,.5)}
.albgroup{padding:16px 16px 0 16px;font-size:13px;font-weight:700;color:var(--ink2)}

/* ===== 洞察 ===== */
.rangeline{display:flex;gap:7px;padding:12px 16px 2px;align-items:center}
.inscard{margin:12px 16px 0;padding:13px 14px}
.inscard h3{font-size:14px;display:flex;justify-content:space-between;align-items:center}
.inscard .src{font-size:10.5px;color:var(--ink3);font-weight:400;margin-top:2px}
.chartwrap{margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:11.5px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.chg .c{min-width:0;background:var(--paper);border-radius:10px;padding:8px 10px;overflow:hidden}
.chg .c small{font-size:10.5px;color:var(--ink3);display:block}
.chg .c b{font-size:14.5px;white-space:nowrap}
.chg .c span{font-size:10.5px;white-space:nowrap}
.up{color:var(--acc)}.dn{color:var(--water)}
.advice{margin-top:4px}
.advice li{font-size:12.5px;color:var(--ink2);margin:7px 0 7px 16px}
.advice li b{color:var(--ink)}

/* ===== 设置 ===== */
.profcard{display:flex;gap:13px;padding:14px;align-items:center;margin:14px 16px 0}
.profcard .ava{width:62px;height:62px;border-radius:50%;overflow:hidden;flex:none}
.profcard b{font-size:16px}
.profcard small{display:block;color:var(--ink3);font-size:11.5px}
.setlist{margin:14px 16px 0;overflow:hidden}
.setrow{display:flex;align-items:center;gap:11px;padding:13px 14px;min-height:50px}
.setrow+.setrow{border-top:1px solid var(--line)}
.setrow .sic{width:32px;height:32px;border-radius:9px;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.setrow .tx{flex:1;min-width:0}
.setrow .tx b{font-size:14px;font-weight:600;display:block}
.setrow .tx small{font-size:11.5px;color:var(--ink3)}
.setrow .chev{color:var(--ink3)}
.lblchip{display:inline-flex;align-items:center;gap:5px;background:var(--paper);border:1px solid var(--line2);border-radius:999px;padding:5px 6px 5px 11px;font-size:12.5px;margin:4px 6px 4px 0}
.lblchip button{color:var(--ink3);width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.appticon{width:74px;height:74px;border-radius:19px;overflow:hidden;flex:none;box-shadow:var(--shadow)}

/* ===== 二级页浮层 ===== */
.subview{position:absolute;inset:0;z-index:40;background:var(--paper);transform:translateX(102%);transition:transform .26s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;visibility:hidden}
.subview.open{transform:none;visibility:visible}
.subview .sv-body{flex:1;overflow-y:auto;padding-bottom:40px;overscroll-behavior:contain}
.subview .sv-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px}
.overlay{position:absolute;inset:0;z-index:60;background:rgba(20,24,26,.55);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex;animation:fdIn .18s ease}
@keyframes fdIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);width:100%;border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:upIn .24s cubic-bezier(.3,.8,.3,1)}
@keyframes upIn{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 12px}

/* 详情 */
.det-media{position:relative;height:210px;overflow:hidden;background:var(--paper)}
.det-media svg{width:100%;height:100%}
.det-media .zoomhint{position:absolute;right:10px;bottom:10px;background:rgba(38,43,71,.55);color:#fff;font-size:11px;padding:4px 9px;border-radius:8px;display:flex;gap:5px;align-items:center}
.det-head{padding:14px 16px 4px}
.det-head .r1{display:flex;align-items:center;gap:8px}
.det-head h2{font-size:19px;flex:1;line-height:1.3}
.det-fields{margin:10px 16px 0;padding:4px 14px}
.dfield{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.dfield:last-child{border-bottom:0}
.dfield span{color:var(--ink3)}
.dfield b{text-align:right}
.det-acts{display:flex;gap:9px;margin:14px 16px 0}
.det-acts .btn{flex:1;min-height:44px;font-size:13.5px;padding:0 8px}
.related{margin:0 16px}
.relrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line)}
.relrow:last-child{border:0}
.relrow .thumb{width:42px;height:42px;border-radius:9px;overflow:hidden;flex:none}
.relrow .thumb svg{width:100%;height:100%}
.relrow .tx{flex:1;min-width:0}
.relrow .tx b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.relrow .tx small{font-size:11px;color:var(--ink3)}

/* 表单步骤 */
.steps{display:flex;gap:6px;padding:12px 16px 2px;align-items:center}
.steps .st-n{flex:1;height:4px;border-radius:99px;background:var(--line2);position:relative;overflow:hidden}
.steps .st-n i{position:absolute;inset:0;background:var(--acc);border-radius:99px;transform:scaleX(0);transform-origin:left;transition:transform .3s}
.steps .st-n.done i{transform:none}
.steps span{font-size:11px;color:var(--ink3);flex:none}
.typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:8px 16px}
.typegrid button{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:13px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink2);min-height:78px}
.typegrid button svg.ic{width:24px;height:24px}
.typegrid button.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-deep)}
.tplrow{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px}
.tplrow .chip.on{background:var(--acc);border-color:var(--acc)}
.fgroup{margin:12px 16px 0;overflow:hidden}
.fgroup>.gh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:700;font-size:13.5px;background:var(--card)}
.fgroup .gb{padding:2px 14px 13px}
.fgroup .gb.hide{display:none}
.frow{display:flex;gap:9px;margin-top:10px}
.frow>div{flex:1}
.frow label,.fcol label{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:4px;font-weight:600}
.fcol{margin-top:10px}
.moverow{display:flex;gap:7px;align-items:flex-end;margin-top:8px;background:var(--paper);border-radius:11px;padding:9px}
.moverow input{padding:7px 9px;font-size:15px}
.moverow .del{color:var(--ink3);width:32px;height:36px;flex:none;display:flex;align-items:center;justify-content:center}
.foldbtn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--acc);font-weight:600}
.mediarow{display:flex;gap:9px;overflow-x:auto;padding:4px 16px 10px}
.mediarow .mcell{flex:none;width:92px;height:92px;border-radius:12px;overflow:hidden;border:2px solid transparent;position:relative;background:var(--card)}
.mediarow .mcell.on{border-color:var(--acc)}
.mediarow .mcell .nm{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;color:#fff;background:rgba(38,43,71,.55);padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mediarow .mup{flex:none;width:92px;height:92px;border-radius:12px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--ink3);background:rgba(255,255,255,.5)}
.review{margin:12px 16px 0;padding:13px 14px}
.review .rr{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.review .rr span{color:var(--ink3)}
.toast{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:#FFFFFF;padding:11px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:90;max-width:82%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast b{color:#A5B4FC}
.confirmbox{background:var(--card);border-radius:18px;width:min(82%,320px);padding:20px 18px 14px;text-align:center;margin:auto}
.confirmbox h3{font-size:16px;margin-bottom:8px}
.confirmbox p{font-size:13px;color:var(--ink2);margin-bottom:16px;text-align:left}
.confirmbox .cc{display:flex;gap:10px}
.confirmbox .cc button{flex:1;min-height:44px;border-radius:11px;font-weight:600}
.viewerbox{width:100%;height:100%;display:flex;flex-direction:column;background:rgba(20,24,26,.94)}
.viewerbox .vimg{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;animation:zoomIn .22s ease}
@keyframes zoomIn{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
.viewerbox .vimg svg{max-width:100%;max-height:100%;border-radius:10px}
.viewerbox .vinfo{background:var(--card);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.viewerbox .vinfo b{font-size:15px}
.viewerbox .vinfo p{font-size:12px;color:var(--ink3);margin:3px 0 10px}
.viewerbox .vinfo .vbtns{display:flex;gap:8px}
.viewerbox .vinfo .vbtns .btn{flex:1;min-height:42px;font-size:13px}
.timerbar{display:flex;align-items:center;gap:12px;background:var(--ink);border-radius:14px;padding:11px 14px;margin:12px 16px 0;color:#fff}
.timerbar svg.ring2{width:46px;height:46px;flex:none}
.timerbar .tt2 b{font-size:21px;font-weight:800;display:block;line-height:1.1}
.timerbar .tt2 small{font-size:11px;opacity:.75}
.timerbar .tbtn{min-height:40px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:13px}
.report-hero{margin:12px 16px 0;padding:16px;color:#FFFFFF}
.report-hero h2{font-size:18px}
.report-hero .range{font-size:11.5px;opacity:.75;margin-top:2px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.rgrid .rg{background:rgba(255,255,255,.09);border-radius:11px;padding:9px 11px}
.rgrid .rg small{font-size:10.5px;opacity:.7;display:block}
.rgrid .rg b{font-size:17px}
.rgrid .rg span{font-size:11px;opacity:.85}
.pulse{animation:pulse .5s ease}
@keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
.checkpop{animation:checkpop .55s ease}
@keyframes checkpop{0%{transform:scale(.6);opacity:0}55%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@media (max-width:360px){.statgrid .v{font-size:20px}.typegrid{gap:7px}}
</style>
</head>

const d2s=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const parseD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};

function loadDB(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);if(d&&d.v===1){DB=d;return}}}catch(e){}DB=seedDB();saveDB()}
function saveDB(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB))}catch(e){toast('本地存储写入失败，空间可能不足')}}
const getRec=id=>DB.records.find(r=>r.id===id);

/* ============ 计算层（纯函数，只读数据） ============ */
const volOf=r=>(r.f.sets||[]).reduce((a,s)=>a+(s.w||0)*(s.r||0)*(s.s||0),0);
const kvOf=r=>{ // 列表关键数值
  switch(r.type){
    case 'train':return r.status==='todo'?((r.f.mins||0)+' 分钟计划'):(volOf(r)>0?volOf(r).toLocaleString()+' kg':''+(r.f.mins||0)+' 分钟');
    case 'weight':return r.f.kg+' kg · 体脂 '+r.f.fat+'%';
    case 'girth':return '臂 '+r.f.arm+' / 腰 '+r.f.waist+' cm';
    case 'meal':return r.f.kcal+' kcal · 蛋白 '+r.f.protein+'g';
    case 'water':return (r.f.ml||0).toLocaleString()+' ml';
    case 'sleep':return r.f.hours+'h'+(r.f.min?r.f.min+'m':'')+' · '+r.f.quality;
  }return '';
};
const dateOf=r=>r.date+(r.time?' '+r.time:'');
function weekStart(s){const d=parseD(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d2s(d)}
function calcStreak(){ // 连续天数：done 的训练/恢复类记录
  const days=new Set(DB.records.filter(r=>r.type==='train'&&r.status==='done').map(r=>r.date));
  let n=0,cur=todayStr();if(!days.has(cur))cur=addDays(cur,-1);
  while(days.has(cur)){n++;cur=addDays(cur,-1)}return n;
}
function trainCountTodayDone(){return DB.records.filter(r=>r.type==='train'&&r.date===todayStr()&&r.status==='done').length}
function todayDoneRatio(){const items=libScope(todayStr());const done=items.filter(r=>r.status==='done').length;return items.length?Math.round(done/items.length*100):0}
function libScope(day){return DB.records.filter(r=>r.date===day&&r.type==='train')}
function sumTodayWater(){const g=DB.profile.waterGoal;const got=DB.records.filter(r=>r.type==='water'&&r.date===todayStr()).reduce((a,r)=>a+(r.f.ml||0),0);return{got,goal:g,pct:Math.min(100,Math.round(got/g*100))}}
function weekVolume(ws){let v=0,c=0;DB.records.forEach(r=>{if(r.type==='train'&&r.status==='done'&&r.date>=ws&&r.date<addDays(ws,7)){v+=volOf(r);c++}});return{v,c}}
function prList(){const m={};DB.records.forEach(r=>{const p=r.f&&r.f.pr;if(p&&(!m[p.move]||p.weight>m[p.move].weight||p.weight===m[p.move].weight&&r.date>m[p.move].date))m[p.move]={...p,date:r.date}});return Object.entries(m).map(([move,p])=>({move,...p})).sort((a,b)=>b.weight-a.weight)}
function upcomingItems(){ // 今天要处理
  const td=todayStr(),out=[];
  DB.todos.filter(t=>!t.done&&t.date<td).forEach(t=>out.push({...t,kind:'overdue'}));
  libScope(td).filter(r=>r.status==='todo').forEach(r=>out.push({id:r.id,title:r.title,date:td,ref:r.id,kind:'train'}));
  DB.todos.filter(t=>!t.done&&t.date===td&&t.ref!=='').forEach(t=>{if(!out.find(o=>o.ref===t.ref))out.push({...t,kind:'todo'})});
  DB.todos.filter(t=>!t.done&&t.date===td).forEach(t=>{if(!out.find(o=>o.id===t.id))out.push({...t,kind:'todo'})});
  const w=sumTodayWater();if(w.pct<100)out.push({id:'water',kind:'water',title:'补水 '+w.got+' / '+w.goal+' ml',pct:w.pct});
  const nx=DB.todos.filter(t=>!t.done&&t.date>td).sort((a,b)=>a.date<b.date?-1:1)[0];
  if(nx&&diffDays(nx.date,td)<=1)out.push({...nx,kind:'soon'});
  /* 复测提醒：设置页承诺「按此日期在首页提醒」，7 天内出现在今天要处理 */
  [['girthDate','围度复测','i-girth','girth'],['measureDate','体测拍照','i-camera','weight']].forEach(rem=>{
    const d=DB.remind&&DB.remind[rem[0]];
    if(!d||d<td)return;
    if(diffDays(d,td)<=7){
      const dup=DB.todos.some(t=>!t.done&&t.date===d&&t.title.indexOf(rem[1])>=0);
      if(!dup)out.push({id:'remind-'+rem[0],kind:'remind',title:rem[1],date:d,icon:rem[2],formType:rem[3]});
    }
  });
  return out;
}
function girthSeries(){return DB.records.filter(r=>r.type==='girth').sort((a,b)=>a.date<b.date?-1:1)}
function weightSeries(){return DB.records.filter(r=>r.type==='weight').sort((a,b)=>a.date<b.date?-1:1)}
function monthDots(y,m){ // 日历打点 {day:[types]}
  const map={};const pre=pad(m+1);
  DB.records.forEach(r=>{if(r.date.startsWith(y+'-'+pre)){const d=+r.date.slice(8);(map[d]=map[d]||[]).push(r.type)}});
  return map;
}
function filterRecords(){ // 记录库：搜索+筛选+排序
  const q=U.search.trim().toLowerCase();
  let list=DB.records.filter(r=>{
    if(U.tab!=='all'&&r.type!==U.tab)return false;
    if(U.fType!=='all'&&r.type!==U.fType)return false;
    if(U.fStatus!=='all'&&r.status!==U.fStatus)return false;
    if(U.fLabel!=='all'&&!(r.tags||[]).includes(U.fLabel))return false;
    if(U.fRange==='week'&&r.date<weekStart(todayStr()))return false;
    if(U.fRange==='month'&&r.date.slice(0,7)!==todayStr().slice(0,7))return false;
    if(U.fRange==='custom'&&(U.from&&r.date<U.from||U.to&&r.date>U.to))return false;
    if(q&&!(r.title.toLowerCase().includes(q)||(r.note||'').toLowerCase().includes(q)||(r.tags||[]).join(',').toLowerCase().includes(q)))return false;
    return true;
  });
  const cmp={ 'date-desc':(a,b)=>dateOf(b)<dateOf(a)?-1:1,'date-asc':(a,b)=>dateOf(a)<dateOf(b)?-1:1,
    'val-desc':(a,b)=>(parseFloat(kvOf(b))||0)>(parseFloat(kvOf(a))||0)?-1:1,'val-asc':(a,b)=>(parseFloat(kvOf(a))||0)>(parseFloat(kvOf(b))||0)?-1:1};
  return list.sort(cmp[U.sort]);
}
/* 洞察统计 */
function insStats(from,to){
  const rs=DB.records.filter(r=>r.date>=from&&r.date<=to);
  const trains=rs.filter(r=>r.type==='train'&&r.status==='done');
  const vol=trains.reduce((a,r)=>a+volOf(r),0);
  const parts={};trains.forEach(r=>(r.tags||[]).filter(t=>DB.labels.concat(DB.customLabels||[]).includes(t)).forEach(t=>parts[t]=(parts[t]||0)+1));
  const ws=weightSeries().filter(r=>r.date>=from&&r.date<=to);
  const meals=rs.filter(r=>r.type==='meal');
  const protein=Math.round(meals.reduce((a,r)=>a+(r.f.protein||0),0)/Math.max(1,meals.length));
  const sleeps=rs.filter(r=>r.type==='sleep');
  const sleepAvg=sleeps.length?(sleeps.reduce((a,r)=>a+r.f.hours*60+(r.f.min||0),0)/sleeps.length/60):0;
  return{rs,trains,vol,parts,ws,protein,sleepAvg,meals:meals.length};
}
function insWeeks(from,to){ // 周柱状图
  const out=[];let ws=weekStart(from);
  while(ws<=to){const{c}=weekVolume(ws);out.push({ws,c});ws=addDays(ws,7)}
  return out.slice(-6);
}

function sparkline(){const s=weightSeries().slice(-4);if(s.length<2)return'';const vs=s.map(r=>r.f.kg);const mx=Math.max(...vs),mn=Math.min(...vs);const pts=vs.map((v,i)=>`${8+i*(96/(vs.length-1))},${34-(v-mn)/(mx-mn||1)*26}`).join(' ');return `<svg width="112" height="40" style="display:block;margin-top:4px"><polyline points="${pts}" fill="none" stroke="#4E7FE8" stroke-width="2.4" stroke-linecap="round"/><circle cx="${8+96}" cy="${34-(vs[vs.length-1]-mn)/(mx-mn||1)*26}" r="3.4" fill="#4E7FE8"/></svg>`}

function rInsight(){
  const td=todayStr();
  let from,to,label;
  if(U.insRange==='week'){from=weekStart(td);to=addDays(from,6);label='本周'}
  else if(U.insRange==='month'){from=td.slice(0,7)+'-01';to=td;label='本月'}
  else{from=U.insFrom||td.slice(0,7)+'-01';to=U.insTo||td;label=from+' ~ '+to}
  const S=insStats(from,to);
  const weeks=insWeeks(addDays(weekStart(td),-35),td);
  const maxC=Math.max(1,...weeks.map(w=>w.c));
  const bars=weeks.map((w,i)=>{const h=Math.round(w.c/maxC*72);const last=i===weeks.length-1;return `<g><rect x="${i*52+14}" y="${104-h}" width="26" height="${h}" rx="5" fill="${last?'#F59E0B':'#4F5AE5'}"/><text x="${i*52+27}" y="${96-h}" font-size="10" text-anchor="middle" font-weight="700" fill="${last?'#D9982B':'#5A5F7A'}">${w.c}</text><text x="${i*52+27}" y="120" font-size="8.5" text-anchor="middle" fill="#9398B3">${w.ws.slice(5).replace('-','/')}</text></g>`}).join('');
  const partColors=['#4F5AE5','#262B47','#D9982B','#E8A23B','#2FA373','#4E7FE8','#9398B3'];
  const pEntries=Object.entries(S.parts).sort((a,b)=>b[1]-a[1]);const pTotal=pEntries.reduce((a,x)=>a+x[1],0);
  const C=2*Math.PI*34;let off=0;const segs=pEntries.map(([k,v],i)=>{const len=v/pTotal*C;const s=`<circle cx="46" cy="46" r="34" fill="none" stroke="${partColors[i%7]}" stroke-width="15" stroke-dasharray="${(len-1.5).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 46 46)"/>`;off+=len;return s}).join('');
  const legend=pEntries.map(([k,v],i)=>`<span><i style="background:${partColors[i%7]}"></i>${esc(k)} ${v} 次</span>`).join('');
  const gs=girthSeries();const gA=gs[0],gB=gs[gs.length-1];
  const wS=S.ws;const w=weightSeries();const wFirst=w[0]||null,wLast=w[w.length-1]||null;const wChg=wS.length>1?(wS[wS.length-1].f.kg-wS[0].f.kg).toFixed(1):null;
  const adv=[];
  const thisW=weekVolume(weekStart(td)),lastW=weekVolume(addDays(weekStart(td),-7));

      (f.sets&&f.sets.length?'<div style="padding:8px 0 4px;font-weight:700;font-size:13px">动作与组数（重量×次数×组数）</div>'+f.sets.map(s=>row(esc(s.mv||'动作'),`${s.w}kg × ${s.r}次 × ${s.s}组 = <b>${((s.w||0)*(s.r||0)*(s.s||0)).toLocaleString()}</b> kg`)).join(''):'')+

const TMR={left:0,total:0,iv:null,paused:false};
function startTimer(sec){clearInterval(TMR.iv);TMR.left=sec;TMR.total=sec;TMR.paused=false;renderTimer();TMR.iv=setInterval(()=>{
  if(TMR.paused)return;TMR.left--;if(TMR.left<=0){clearInterval(TMR.iv);TMR.iv=null;toast('休息结束，<b>下一组开干</b>！');const b=$('#tmrBox');if(b)b.innerHTML=''}else renderTimer()},1000)}
function renderTimer(){const b=$('#tmrBox');if(!b||!TMR.total)return;const C=2*Math.PI*20;const pct=TMR.left/TMR.total;
  b.innerHTML=`<div class="timerbar"><svg class="ring2" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="4"/><circle cx="23" cy="23" r="20" fill="none" stroke="#A5B4FC" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(pct*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 23 23)"/></svg><div class="tt2"><b class="num">${TMR.left}s</b><small>组间休息 · 保持放松</small></div><button class="tbtn" data-act="timer-pause">${TMR.paused?'继续':'暂停'}</button><button class="tbtn" data-act="timer-stop">结束</button></div>`}
function stopTimer(){clearInterval(TMR.iv);TMR.iv=null;TMR.total=0;const b=$('#tmrBox');if(b)b.innerHTML=''}

const setRow=(s,i)=>`<div class="moverow"><input data-k="mv" value="${esc(s.mv)}" placeholder="动作" style="flex:2"><input data-k="w" type="number" step="0.5" value="${s.w}" placeholder="kg" style="flex:1" inputmode="decimal"><input data-k="r" type="number" value="${s.r}" placeholder="次" style="flex:1" inputmode="numeric"><input data-k="s" type="number" value="${s.s}" placeholder="组" style="flex:1" inputmode="numeric">${i>0?`<button class="del" data-act="del-set" data-i="${i}"><svg class="ic" style="width:15px;height:15px"><use href="#i-trash"/></svg></button>`:''}</div>`;
function collectForm(){
  const d=F.data;
  if(F.step!==2)return; /* 仅在字段步骤收集，避免步骤3时误清空已填数据 */
  d.title=($('#fTitle')?.value||'').trim();d.date=$('#fDate')?.value||d.date;d.time=$('#fTime')?.value||'12:00';
  d.note=($('#fNote')?.value||'').trim();
  if(F.type==='train'){d.status=$('#fStatus').value;d.mins=+$('#fMins')?.value||0;
    d.sets=[...$$('#setsRows .moverow')].map(row=>{const g=k=>row.querySelector(`input[data-k="${k}"]`).value;return{mv:g('mv').trim(),w:+g('w')||0,r:+g('r')||0,s:+g('s')||0}});}
  if(F.type==='weight'){d.kg=+$('#fKg')?.value||0;d.fat=+$('#fFat')?.value||0}
  if(F.type==='girth'){d.arm=+$('#fArm')?.value||0;d.chest=+$('#fChest')?.value||0;d.waist=+$('#fWaist')?.value||0;d.thigh=+$('#fThigh')?.value||0}
  if(F.type==='meal'){d.slot=$('#fSlot')?.value||d.slot;d.kcal=+$('#fKcal')?.value||0;d.protein=+$('#fProtein')?.value||0}
  if(F.type==='water'){d.ml=+$('#fMl')?.value||0}
  if(F.type==='sleep'){d.hours=+$('#fHours')?.value||0;d.min=+$('#fMin')?.value||0;d.quality=$('#fQuality')?.value||'良好'}
}
function validateForm(){
  const d=F.data;
  if(F.step===1)return true;
  if(!d.title)return toast('标题还没填，例如「腿日 · 深蹲 5×5」'),false;
  if(F.type==='train'&&d.status==='done'&&!d.sets.some(s=>s.mv&&(s.w||s.r)))return toast('已完成训练至少要填一个动作的组数重量'),false;
  if(F.type==='weight'&&!d.kg)return toast('体重还没填'),false;
  if(F.type==='water'&&!d.ml)return toast('饮水量还没填'),false;
  if(F.type==='sleep'&&!d.hours)return toast('睡眠时长还没填'),false;
  return true;
}
function saveForm(){
  collectForm();if(!validateForm())return;
  const d=F.data;
  if(!d.media)d.media=blankForm(F.type).media;
  const rec={id:F.editId||uid(),type:F.type,title:d.title,date:d.date,time:d.time,status:d.status||'done',tags:d.tags||[],note:d.note,media:d.media,f:{}};
  const fkeys={train:['mins','sets','pr'],weight:['kg','fat'],girth:['arm','chest','waist','thigh'],meal:['slot','kcal','protein'],water:['ml'],sleep:['hours','min','quality']};
  fkeys[F.type].forEach(k=>{if(d[k]!==undefined)rec.f[k]=d[k]});
  if(F.type==='train'&&rec.status==='done'&&!rec.f.pr){
    let best=null;(rec.f.sets||[]).forEach(s=>{if(s.w>=(best?best.w:0)&&s.w>0)best={move:s.mv,weight:s.w,reps:s.r}});
    const known=prList().find(p=>p.move===best?.move);
    if(best&&best.w>=40&&(!known||best.w>known.weight)){rec.f.pr=best}
  }
  if(F.editId){const i=DB.records.findIndex(r=>r.id===F.editId);DB.records[i]=rec}
  else DB.records.unshift(rec);
  /* 活动流 */
  if(rec.status==='done'||rec.type!=='train'){
    let txt='';
    if(rec.type==='train')txt=`完成「${rec.title}」，训练量 ${volOf(rec).toLocaleString()} kg`;
    else if(rec.type==='weight')txt=`晨重 ${rec.f.kg} kg · 体脂 ${rec.f.fat}%`;
    else if(rec.type==='girth')txt=`围度复测：臂 ${rec.f.arm} / 腰 ${rec.f.waist} cm`;
    else if(rec.type==='meal')txt=`记录${rec.f.slot}「${rec.title}」${rec.f.kcal} kcal`;
    else if(rec.type==='water')txt=`饮水 +${rec.f.ml} ml`;
    else txt=`睡眠 ${rec.f.hours}h，质量${rec.f.quality}`;
    DB.acts.unshift({id:uid(),date:rec.date,time:rec.time||'12:00',text:txt,ref:rec.id});
    DB.acts=DB.acts.slice(0,24);
  }
  saveDB();checkBadges(rec);
  closeAllSV();go(U.page==='set'?'home':U.page);refreshAll();
  toast(F.editId?'已保存，<b>详情、列表、统计已同步</b>':'已记录，<b>总数与趋势已更新</b>');
  if(!F.editId&&U.page!=='home')go(U.page);
  F=null;
}
/* 徽章检查 */
function checkBadges(rec){
  const earned=[];
  const b=id=>DB.badges.find(x=>x.id===id);
  const st=calcStreak();
  if(b('b1')&&!b('b1').earned&&st>=14){b('b1').earned=true;b('b1').date=todayStr();earned.push(b('b1'))}
  const total=DB.records.filter(r=>r.type==='train'&&r.status==='done').length;
  if(b('b5')&&!b('b5').earned&&total>=100){b('b5').earned=true;b('b5').date=todayStr();earned.push(b('b5'))}
  const ws=weightSeries();
  const minFat=Math.min(...ws.map(w=>w.f.fat||99));
  if(b('b4')&&!b('b4').earned&&minFat<23){b('b4').earned=true;b('b4').date=todayStr();earned.push(b('b4'))}
  if(b('b6')&&!b('b6').earned&&minFat<=DB.profile.goalFat){b('b6').earned=true;b('b6').date=todayStr();earned.push(b('b6'))}
  if(rec&&rec.f&&rec.f.pr){const nb=DB.badges.find(x=>!x.earned&&x.name.includes(rec.f.pr.move));if(nb){nb.earned=true;nb.date=todayStr();nb.desc=todayStr()+' 达成';earned.push(nb)}}
  if(earned.length)setTimeout(()=>showBadge(earned[0]),450);
  return earned;
}
function showBadge(b){
  $('#ov-badge').innerHTML=`<div class="confirmbox checkpop" style="background:var(--ink);color:#FFFFFF">
    <div class="bic" style="width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;color:var(--gold)"><svg class="ic" style="width:30px;height:30px"><use href="#${b.icon}"/></svg></div>
    <h3 style="color:#A5B4FC">徽章解锁 · ${esc(b.name)}</h3>
    <p style="color:rgba(246,243,236,.8);text-align:center">${esc(b.desc)}<br>${esc(DB.profile.slogan)}</p>
    <div class="cc"><button style="background:var(--acc);color:#fff;border-radius:11px;min-height:44px;font-weight:700" data-act="close-ov" data-ov="ov-badge">收下，继续练</button></div></div>`;
  $('#ov-badge').classList.add('open');
}

    <div class="vinfo">
      <b>${esc(m.name)}</b><p class="num">${esc(m.desc)} · ${m.date}</p>
      ${refs.length?`<div style="font-size:11px;color:var(--ink3);margin-bottom:6px">关联记录 · 点击直达</div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">${refs.map(r=>`<button class="chip" data-act="viewer-open-detail" data-id="${r.id}">${esc(r.title)}</button>`).join('')}</div>`:'<p style="color:var(--ink3)">暂无关联记录</p>'}
      ${coverTarget?`<div class="vbtns"><button class="btn btn-p" data-act="set-cover" data-md="${m.id}" data-rec="${coverTarget.id}"><svg class="ic"><use href="#i-check"/></svg>设为「${esc(coverTarget.title.slice(0,9))}…」封面</button><button class="btn btn-g" data-act="close-ov" data-ov="ov-viewer">关闭</button></div>`:`<div class="vbtns"><button class="btn btn-g btn-blk" data-act="close-ov" data-ov="ov-viewer">关闭</button></div>`}
    </div></div>`;
  $('#ov-viewer').classList.add('open');
}
function openStat(key){
  let html='';
  if(key==='vol'){
    const ws=weekStart(todayStr());
    const rs=DB.records.filter(r=>r.type==='train'&&r.status==='done'&&r.date>=ws&&r.date<addDays(ws,7));
    const total=rs.reduce((a,r)=>a+volOf(r),0);
    html=`<div class="grab"></div><h3 style="font-size:16px;margin-bottom:4px">本周训练量 · ${total.toLocaleString()} kg</h3><p style="font-size:12px;color:var(--ink3);margin-bottom:10px">由下列已完成训练的「重量×次数×组数」相加得出</p>
    ${rs.map(r=>`<div class="relrow" style="cursor:pointer" data-act="open-detail" data-id="${r.id}"><div class="thumb">${artURL(mediaArtOf(r))}</div><div class="tx"><b>${esc(r.title)}</b><small class="num">${r.date} · ${(r.f.sets||[]).length} 个动作</small></div><b class="num">${volOf(r).toLocaleString()} kg</b></div>`).join('')||'<div class="empty"><p>本周还没有已完成训练</p></div>'}
    <button class="btn btn-g btn-blk" style="margin-top:12px" data-act="close-ov" data-ov="ov-stat">关闭</button>`;
  }else if(key==='rate'){
    const rs=libScope(todayStr());
    html=`<div class="grab"></div><h3 style="font-size:16px;margin-bottom:10px">今日完成明细</h3>
    ${rs.map(r=>`<div class="relrow" style="cursor:pointer" data-act="open-detail" data-id="${r.id}"><div class="thumb">${artURL(mediaArtOf(r))}</div><div class="tx"><b>${esc(r.title)}</b><small>${r.status==='done'?'已完成':'计划中'}</small></div>${statusHTML(r)}</div>`).join('')||'<div class="empty"><p>今天还没有安排训练，去计划页添加</p></div>'}
    <button class="btn btn-g btn-blk" style="margin-top:12px" data-act="close-ov" data-ov="ov-stat">关闭</button>`;
  }
  $('#ov-stat').innerHTML=`<div class="sheet">${html}</div>`;
  $('#ov-stat').classList.add('open');
}
function askConfirm(title,body,okLabel,fn){
  $('#ov-confirm').innerHTML=`<div class="confirmbox"><h3>${esc(title)}</h3><p>${body}</p><div class="cc"><button class="btn btn-g" data-act="close-ov" data-ov="ov-confirm">再想想</button><button class="btn btn-d" id="cfOk">${esc(okLabel)}</button></div></div>`;
  $('#ov-confirm').classList.add('open');
  $('#cfOk').onclick=()=>{$('#ov-confirm').classList.remove('open');fn()};
}
function editProfileSheet(){
  const p=DB.profile;
  $('#ov-stat').innerHTML=`<div class="sheet"><div class="grab"></div><h3 style="margin-bottom:10px">编辑个人资料</h3>
  <div class="fcol"><label>昵称</label><input id="pfName" value="${esc(p.name)}"></div>
  <div class="frow"><div><label>身高 cm</label><input type="number" id="pfHeight" value="${p.height}"></div><div><label>每日补水 ml</label><input type="number" id="pfWater" value="${p.waterGoal}"></div></div>
  <div class="fcol"><label>阶段目标</label><input id="pfGoal" value="${esc(p.goalText)}"></div>
  <div class="cc" style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-g" style="flex:1" data-act="close-ov" data-ov="ov-stat">取消</button><button class="btn btn-p" style="flex:2" id="pfSave">保存</button></div></div>`;
  $('#ov-stat').classList.add('open');
  $('#pfSave').onclick=()=>{p.name=$('#pfName').value.trim()||p.name;p.height=+$('#pfHeight').value||p.height;p.waterGoal=+$('#pfWater').value||p.waterGoal;p.goalText=$('#pfGoal').value.trim()||p.goalText;saveDB();$('#ov-stat').classList.remove('open');refreshAll();toast('资料已更新，<b>提醒与目标同步生效</b>')};
}
/* 上传照片 */
function handlePhoto(file,mode,date){
  if(!file||!file.type.startsWith('image/'))return toast('请选择图片文件');
  const rd=new FileReader();
  rd.onload=e=>{const img=new Image();img.onload=()=>{
    const cv=document.createElement('canvas');const sc=Math.min(1,800/img.width);
    cv.width=img.width*sc;cv.height=img.height*sc;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const data=cv.toDataURL('image/jpeg',.82);
    const rec={id:uid(),art:data,name:file.name.replace(/\.[^.]+$/,'').slice(0,14)||'我的照片',desc:'本机上传 · '+(date||todayStr()),date:date||todayStr(),refs:[],ratio:'s'};
    DB.media.unshift(rec);
    if(mode==='form'){F.data.media=data;renderForm()}
    saveDB();refreshAll();if(mode!=='form'){openViewer(rec.id);toast('照片已入相册，<b>可点「设为封面」关联到记录</b>')}
  };img.src=e.target.result};
  rd.onerror=()=>toast('图片读取失败，请重试');
  rd.readAsDataURL(file);
}
/* 导出 */
function downloadFile(name,content){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain'}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),800);
}

/* ============ 动作分发 ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  switch(act){
    case 'go':go(el.dataset.page);break;
    case 'open-detail':closeAllSV();$('#ov-viewer').classList.remove('open');$('#ov-stat').classList.remove('open');openDetail(id);break;
    case 'viewer-open-detail':$('#ov-viewer').classList.remove('open');openDetail(id);break;
    case 'open-form':closeAllSV();openForm(el.dataset.type||'train',null,el.dataset.date);break;
    case 'edit':{const r=getRec(id);closeAllSV();openForm(r.type,id,r.date);break}
    case 'close-sv':stopTimer();closeAllSV();break;
    case 'close-ov':$('#'+el.dataset.ov).classList.remove('open');break;
    case 'sort-cycle':{const order=['date-desc','date-asc','val-desc','val-asc'];U.sort=order[(order.indexOf(U.sort)+1)%4];rLibrary();toast('排序：'+({ 'date-desc':'日期 新→旧','date-asc':'日期 旧→新','val-desc':'数值 大→小','val-asc':'数值 小→大'})[U.sort]);break}
    case 'tab':U.tab=el.dataset.tab;rLibrary();break;
    case 'open-filter':openFilter();break;
    case 'fchip':{const k=el.dataset.k;U[k]=el.dataset.v;if(k==='fRange'&&el.dataset.v!=='custom'){U.from='';U.to=''}openFilter();break}
    case 'apply-filter':{const f=$('#fltFrom'),t=$('#fltTo');if(f){U.from=f.value;U.to=t.value}closeAllSV();rLibrary();toast('筛选已应用，<b>'+filterRecords().length+'</b> 条符合');break}
    case 'clear-filter':U.tab='all';U.fType='all';U.fStatus='all';U.fLabel='all';U.fRange='all';U.from='';U.to='';U.search='';closeAllSV();rLibrary();toast('已清除全部筛选');break;
    case 'cal-prev':U.calM--;if(U.calM<0){U.calM=11;U.calY--}rPlan();break;
    case 'cal-next':U.calM++;if(U.calM>11){U.calM=0;U.calY++}rPlan();break;
    case 'cal-today':{const td=todayStr();U.calY=+td.slice(0,4);U.calM=+td.slice(5,7)-1;U.calSel=td;rPlan();break}
    case 'cal-sel':U.calSel=el.dataset.date;rPlan();break;
    case 'water250':{const td=todayStr();let wr=DB.records.find(r=>r.type==='water'&&r.date===td);
      if(wr)wr.f.ml=(wr.f.ml||0)+250;else{wr={id:uid(),type:'water',title:'今日饮水',date:td,time:new Date().toTimeString().slice(0,5),status:'done',tags:[],note:'快捷+250ml 累加',media:'art-bottle',f:{ml:250}};DB.records.unshift(wr)}
      saveDB();refreshAll();const w=sumTodayWater();toast('已记录 250ml，今日 <b>'+w.got+' / '+w.goal+' ml</b>');break}
    case 'done-todo':{const t=DB.todos.find(x=>x.id===id);if(t){t.done=true;DB.acts.unshift({id:uid(),date:todayStr(),time:new Date().toTimeString().slice(0,5),text:'完成待办「'+t.title+'」',ref:t.ref||null});saveDB();refreshAll();toast('待办完成，<b>今日进度已更新</b>')}break}
    case 'complete-train':{const r=getRec(id);if(!r)break;r.status='done';
      r.time=new Date().toTimeString().slice(0,5);
      DB.acts.unshift({id:uid(),date:todayStr(),time:r.time,text:`完成「${r.title}」，训练量 ${volOf(r).toLocaleString()} kg，连续 ${calcStreak()} 天`,ref:r.id});
      const todo=DB.todos.find(t=>t.ref===r.id);if(todo)todo.done=true;
      saveDB();const earned=checkBadges(r);refreshAll();closeAllSV();
      toast(earned.length?'<b>新纪录诞生！</b>徽章与统计已更新':'腿日拿下，<b>本周训练量与连续天数已更新</b>');break}
    case 'del':{const r=getRec(id);if(!r)break;
      const rel=relatedOf(r);
      askConfirm('删除这条记录？','将删除「'+esc(r.title)+'」（'+r.date+'），并同步移除 '+rel.length+' 项关联内容与相关统计。<b style="color:var(--warn)">此操作不可撤销。</b>','确认删除',()=>{
        DB.records=DB.records.filter(x=>x.id!==id);
        DB.todos=DB.todos.filter(t=>t.ref!==id);
        DB.acts=DB.acts.filter(a=>a.ref!==id);
        DB.media.forEach(m=>m.refs=m.refs.filter(x=>x!==id));
        stopTimer();saveDB();closeAllSV();refreshAll();toast('已删除，<b>列表与统计已同步</b>')});break}
    case 'record-export':{const r=getRec(id);const txt=['【运动打卡】'+r.title,r.date+' '+r.time+' · '+typeName[r.type]+' · '+({done:'已完成',todo:'计划中'}[r.status]||r.status),'数据：'+kvOf(r),(r.tags||[]).length?'标签：'+r.tags.join('、'):'','备注：'+(r.note||'无'),'',DB.profile.slogan].filter(Boolean).join('\n');
      if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('记录文本已复制，<b>可粘贴到任何地方</b>')).catch(()=>downloadFile('运动打卡-'+r.title.slice(0,10)+'.txt',txt));
      else downloadFile('运动打卡-'+r.title.slice(0,10)+'.txt',txt);break}
    case 'report-export':{const w=weightSeries();const txt='【运动打卡·阶段报告】'+w[0].date+' → '+w[w.length-1].date+'\n体重：'+w[0].f.kg+' → '+w[w.length-1].f.kg+' kg\n体脂：'+w[0].f.fat+'% → '+w[w.length-1].f.fat+'%\n\n'+DB.profile.slogan;
      downloadFile('运动打卡-阶段报告.txt',txt);toast('报告已导出');break}
    case 'stat':openStat(el.dataset.key);break;
    case 'open-report':closeAllSV();openReport();break;
    case 'viewer':openViewer(el.dataset.md);break;
    case 'viewer-rec':{const r=getRec(el.dataset.id);if(!r)break;const m=DB.media.find(x=>x.refs.includes(r.id))||DB.media.find(x=>x.art===r.media);if(m)openViewer(m.id);else toast('该记录暂无相册素材，可在编辑中更换封面');break}
    case 'set-cover':{const m=DB.media.find(x=>x.id===el.dataset.md),r=getRec(el.dataset.rec);if(m&&r){r.media=m.art;if(!m.refs.includes(r.id))m.refs.push(r.id);saveDB();$('#ov-viewer').classList.remove('open');refreshAll();toast('封面已更新，<b>详情与列表同步</b>')}break}
    case 'media-upload':{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>handlePhoto(inp.files[0],el.dataset.mode,el.dataset.date);inp.click();break}
    case 'timer':startTimer(+el.dataset.sec);break;
    case 'timer-pause':TMR.paused=!TMR.paused;renderTimer();break;
    case 'timer-stop':stopTimer();toast('计时已结束');break;
    case 'form-type':collectForm();F.type=el.dataset.type;F.data=blankForm(F.type,F.data.date);F.data.title='';renderForm();break;
    case 'form-tpl':{collectForm();const tp=TPL[el.dataset.tpl];F.data.title=tp.title;F.data.tags=[...tp.tags];F.data.sets=tp.sets.map(s=>({...s}));if(tp.mins)F.data.mins=tp.mins;renderForm();toast('模板已带入，<b>改数字就行</b>');break}
    case 'form-tag':{collectForm();const t=el.dataset.tag;const i=F.data.tags.indexOf(t);i>=0?F.data.tags.splice(i,1):F.data.tags.push(t);renderForm();break}
    case 'form-water':{const inp=$('#fMl');if(inp)inp.value=(+inp.value||0)+ +el.dataset.v;break}
    case 'form-media':collectForm();F.data.media=el.dataset.art;renderForm();break;
    case 'add-set':collectForm();F.data.sets.push({mv:'',w:'',r:'',s:''});renderForm();break;
    case 'del-set':collectForm();F.data.sets.splice(+el.dataset.i,1);renderForm();break;
    case 'fold':collectForm();F.data._fold=!F.data._fold;renderForm();break;
    case 'form-prev':collectForm();if(F.step>1){F.step--;renderForm()}break;
    case 'form-next':collectForm();
      if(F.step===1){F.step=2;renderForm()}
      else if(F.step===2){if(validateForm()){F.step=3;renderForm()}}
      else saveForm();
      break;
    case 'add-label':{const v=($('#newLabel')?.value||'').trim();if(!v)return toast('先输入标签名');if((DB.labels.concat(DB.customLabels||[])).includes(v))return toast('这个标签已经存在');(DB.customLabels=DB.customLabels||[]).push(v);saveDB();refreshAll();toast('标签「'+esc(v)+'」已加入，<b>筛选与表单即时生效</b>');break}
    case 'del-label':{const i=+el.dataset.i;const custom=DB.customLabels||[];if(i<DB.labels.length){DB.labels.splice(i,1)}else{custom.splice(i-DB.labels.length,1)}saveDB();refreshAll();toast('标签已移除');break}
    case 'edit-profile':editProfileSheet();break;
    case 'export':downloadFile('运动打卡-备份-'+todayStr()+'.json',JSON.stringify(DB,null,1));toast('备份已导出，<b>包含全部记录与设置</b>');break;
    case 'import':{const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(!data.records||!data.profile)throw 0;const base=seedDB();DB={...base,...data,profile:{...base.profile,...(data.profile||{})},remind:{...base.remind,...(data.remind||{})},todos:data.todos||base.todos,badges:data.badges||base.badges,media:data.media||base.media,acts:data.acts||base.acts,labels:data.labels||base.labels,customLabels:data.customLabels||[]};saveDB();refreshAll();toast('导入成功，<b>数据已恢复</b>')}catch(err){toast('文件格式不对，请选择本应用导出的 JSON')}};rd.readAsText(f)};inp.click();break}
    case 'reset-demo':askConfirm('恢复示例数据？','将<b style="color:var(--warn)">清空当前全部记录、待办、徽章与上传的照片</b>，回到初始演示状态。建议先导出 JSON 备份。<b>此操作不可撤销。</b>','确认清空并恢复',()=>{DB=seedDB();saveDB();refreshAll();toast('已恢复示例数据')});break;
    case 'ins-range':U.insRange=el.dataset.v;rInsight();break;
    case 'ins-apply':{const f=$('#insFrom'),t=$('#insTo');if(f&&t){U.insFrom=f.value;U.insTo=t.value;if(U.insFrom>U.insTo)toast('起始日期晚于结束，已自动对调');rInsight()}break}
  }
});
/* 输入委托 */
document.addEventListener('input',e=>{
  if(e.target.id==='libSearch'){U.search=e.target.value;const pos=e.target.selectionStart;rLibrary();const inp=$('#libSearch');if(inp){inp.focus();inp.setSelectionRange(pos,pos)}}
});
document.addEventListener('change',e=>{
  if(e.target.id==='setGirth'){DB.remind.girthDate=e.target.value;saveDB();refreshAll();toast('围度复测日已更新，<b>首页提醒同步</b>')}
  if(e.target.id==='setMeasure'){DB.remind.measureDate=e.target.value;saveDB();refreshAll();toast('体测拍照日已更新')}
  if(e.target.id==='setWater'){DB.profile.waterGoal=+e.target.value||2600;saveDB();refreshAll();toast('补水目标已更新')}
});
$$('#tabbar button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));

/* ============ 初始化 ============ */
loadDB();
(function init(){
  const td=todayStr();U.calY=+td.slice(0,4);U.calM=+td.slice(5,7)-1;
  refreshAll();
  try{const q=new URLSearchParams(location.search).get('p');go(['home','lib','plan','alb','ins','set'].includes(q)?q:'home')}catch(e){go('home')}
})();
</script>
