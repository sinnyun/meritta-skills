          <div class="srcnote"><b>数据来源：</b>${acts.length} 条已完成行程的「总里程」之和为 ${fmtNum(sum(acts, r => r.dist))} km，其中 ${esc(acts[0] ? acts[0].title : '')} 贡献 ${fmtNum(acts[0] ? acts[0].dist : 0)} km。</div></section></div>
        <div class="c5"><section class="card">${secTitle('', '支撑这条成果的记录')}
          ${acts.map(a => `<button class="rel" data-act="go" data-href="#/r/${esc(a.id)}" style="width:100%;text-align:left">${ic('t_activity', 18)}<span class="rel__t"><b>${esc(a.title)}</b><span>${esc(fmtMD(a.date))} · ${fmtNum(a.dist)} km</span></span>${ic('next', 16)}</button>`).join('')}
          <div class="srcnote">每条行程都能点开核对里程、爬升与照片，统计数字与记录一一对应。</div></section></div>
      </div>`;
  }
  return emptyState(ART_NOSEARCH, '没找到这份报告', '成果卡片可能已被删除，回到首页查看当前阶段成果。', '回到首页', 'go-home');
}

/* ---------------- 记录详情 ---------------- */
function viewDetail(id) {
  const r = byId(id);
  if (!r) return emptyState(ART_NOSEARCH, '这条记录不在了', '它可能已被删除，或者链接已经失效。', '回到记录库', 'go-lib');
  const t = typeOf(r.type);
  const rel = relatedOf(r);
  const med = mediaOf(r);
  const logs = logsOf(r);
  const fields = (t.fields || []).map(function (f) {
    let v = r[f.k];
    if (f.t === 'ref') v = v ? titleOf(v) : '';
    if (f.t === 'refmany') v = (v || []).map(id2 => titleOf(id2)).join('、');
    if (f.t === 'range') v = fmtNum(v) + (f.u ? ' ' + f.u : '');
    if (f.t === 'select' && !v) v = '';
    if (v === '' || v == null) return '';
    return `<div class="kv__r"><div class="kv__k">${esc(f.l)}</div><div class="kv__v">${esc(v)}${f.u && f.t === 'number' ? ' ' + esc(f.u) : ''}</div></div>`;
  }).join('');

  const statusRow = t.status.map(s => `<button class="chip${r.status === s ? ' is-on' : ''}" data-act="set-status-of" data-id="${esc(r.id)}" data-status="${esc(s)}">${r.status === s ? ic('check', 14) : ''}${esc(s)}</button>`).join('');

  const photos = `<section class="card">
    ${secTitle('', '关联影像', `<button class="btn btn--gh btn--sm" data-act="add-photo" data-id="${esc(r.id)}">${ic('upload', 15)}上传照片</button>`)}
    ${med.length ? `<div class="pgrid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
      ${med.map(function (m) {
    if (m.key) return `<div class="pitem" data-act="open-photo" data-key="${esc(m.key)}" data-rec="${esc(r.id)}" data-cap="${esc(m.cap)}" style="aspect-ratio:1/1">
          <img src="${esc(imgSrc(m.key))}" alt="${esc(m.cap)}" loading="lazy" onerror="imgFail(this)"><span class="pitem__cap"><b>${esc(m.cap)}</b></span></div>`;
    return `<div class="pitem" data-act="open-photo" data-url="${esc(m.url)}" data-rec="${esc(r.id)}" data-cap="${esc(m.cap)}" style="aspect-ratio:1/1">
          <img src="${esc(m.url)}" alt="${esc(m.cap)}" loading="lazy" onerror="imgFail(this)"><span class="pitem__cap"><b>${esc(m.cap)}</b></span></div>`;
  }).join('')}</div>` : emptyState(ART_NOALBUM, '这条记录还没有照片', '上传一张现场照片，它会同时出现在相册和这条记录的封面位置上。', '上传照片', 'add-photo')}
  </section>`;

  const relBox = `<section class="card">
    ${secTitle('', '关联记录')}
    ${rel.out.length ? `<div class="faint" style="font-size:12px;margin-bottom:8px">这条记录指向</div>` + rel.out.map(x => `<button class="rel" data-act="go" data-href="#/r/${esc(x.rec.id)}" style="width:100%;text-align:left">${ic(typeOf(x.rec.type).icon, 18)}<span class="rel__t"><b>${esc(x.rec.title)}</b><span>${esc(x.label)} · ${esc(typeOf(x.rec.type).name)} · ${esc(fmtMD(x.rec.date))}</span></span>${ic('next', 16)}</button>`).join('') : ''}
    ${rel.in.length ? `<div class="faint" style="font-size:12px;margin:12px 0 8px">有 ${rel.in.length} 条记录引用它</div>` + rel.in.map(x => `<button class="rel" data-act="go" data-href="#/r/${esc(x.rec.id)}" style="width:100%;text-align:left">${ic(typeOf(x.rec.type).icon, 18)}<span class="rel__t"><b>${esc(x.rec.title)}</b><span>作为「${esc(x.label)}」被引用 · ${esc(typeOf(x.rec.type).name)}</span></span>${ic('next', 16)}</button>`).join('') : ''}
    ${!rel.out.length && !rel.in.length ? `<div class="faint" style="font-size:13px">这条记录暂时是独立的。在编辑页可以把营地、路线或装备关联进来。</div>` : ''}
  </section>`;

  const actBox = `<section class="card">
    ${secTitle('', '活动记录')}
    <div class="feed">${logs.map(f => `<div class="feed__i${f.kind ? ' is-' + f.kind : ''}"><b>${esc(f.text)}</b><span>${esc(f.t)}</span></div>`).join('')}</div>
  </section>`;

  const special = r.type === 'activity' && r.status === '已完成'
    ? `<section class="card" style="border-color:var(--tent-deep);background:var(--tent)">
        ${secTitle('', '这一趟已经收尾')}
        <p class="muted" style="font-size:13.5px">行程结束时，山野清单可以把里程、爬升、花费、天气与照片汇总成一份「户外战报」，并把里程计入阶段成果。</p>
        <div style="display:flex;gap:9px;margin-top:12px;flex-wrap:wrap">
          <button class="btn btn--p" data-act="gen-report" data-id="${esc(r.id)}">${ic('flag', 17)}生成户外战报</button>
          <button class="btn btn--gh" data-act="clone" data-id="${esc(r.id)}">${ic('copy', 16)}再走一次</button>
        </div></section>`
    : (r.type === 'activity' && r.status === '进行中'
      ? `<section class="card" style="border-color:var(--tent-deep);background:var(--tent)">
          ${secTitle('', '行程进行中')}
          <p class="muted" style="font-size:13.5px">完成度 ${num(r.progress)}% 。行前清单会在详情里保留，回来后点「完成」即可生成战报。</p>
          <div style="display:flex;gap:9px;margin-top:12px;flex-wrap:wrap">
            <button class="btn btn--p" data-act="finish-act" data-id="${esc(r.id)}">${ic('check', 17)}标记为已完成</button>
          </div></section>` : '');

  return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn btn--gh btn--sm" data-act="go" data-href="#/lib/${esc(r.type)}">${ic('back', 15)}返回${esc(t.plural)}</button>
      <span class="chip" style="min-height:26px;font-size:12px">${ic(t.icon, 13)}${esc(t.name)}</span>
      ${statusPill(r.status)}
      <span style="flex:1"></span>
      <button class="btn btn--gh btn--sm" data-act="edit-rec" data-id="${esc(r.id)}">${ic('edit', 15)}编辑</button>
      <button class="btn btn--d btn--sm" data-act="del-rec" data-id="${esc(r.id)}">${ic('trash', 15)}删除</button>
    </div>
    <div class="detail__hero">
      ${r.cover && imgSrc(r.cover)
      ? `<img src="${esc(imgSrc(r.cover))}" alt="${esc(r.title)}" data-act="lb-open" data-img="${esc(r.cover)}" data-rec="${esc(r.id)}" onerror="imgFail(this)" style="cursor:zoom-in;width:100%">`
      : `<div style="aspect-ratio:16/7;background:var(--mist);display:flex;align-items:center;justify-content:center">${ART_BROKEN}</div>`}
      <div style="position:absolute;left:14px;bottom:12px;right:14px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)">
        <span class="chip" style="background:rgba(255,255,255,.92);color:var(--ink);min-height:24px;font-size:11.5px">${ic('pin', 12)}${esc(r.place || r.shot || IMG_INFO[r.cover] && IMG_INFO[r.cover].place || '')}</span>
      </div>
    </div>
    <div style="margin-top:18px">
      <h1 class="t-h1">${esc(r.title)}</h1>
      <div class="rec__meta" style="margin-top:9px">
        <i>${ic('calendar', 15)}${esc(fmtFull(r.date))} · ${esc(relDay(r.date))}</i>
        ${t.metric ? `<i>${ic('chart', 15)}${esc(t.metric.l)} <b class="rec__kv">${fmtNum(r[t.metric.k])}</b> ${esc(t.metric.u)}</i>` : ''}
        <i>${ic('clock', 15)}创建于 ${esc(r.created || '—')}</i>
      </div>
      <div class="rec__tags" style="margin-top:11px">${(r.tags || []).map(x => `<span class="tagmini tagmini--forest">${esc(x)}</span>`).join('')}</div>
      ${r.note ? `<p class="t-body" style="margin-top:13px;color:var(--ink-2)">${esc(r.note)}</p>` : ''}
    </div>

    <section class="card" style="margin-top:18px">
      ${secTitle('', '状态切换', `<span class="faint" style="font-size:12px">修改后列表、日历与统计会同步更新</span>`)}
      <div class="seg">${statusRow}</div>
    </section>

    ${fields ? `<section class="card" style="margin-top:16px">
      ${secTitle('', '记录字段', `<button class="btn btn--gh btn--sm" data-act="edit-rec" data-id="${esc(r.id)}">${ic('edit', 15)}编辑字段</button>`)}
      <div class="kv">${fields}</div></section>` : ''}

    <div class="dash" style="margin-top:16px">
      <div class="c7 stack">${relBox}${actBox}</div>
      <div class="c5 stack">${special}${photos}</div>
    </div>`;
}

/* ---------------- 新增 / 编辑（三步） ---------------- */
function viewForm() {
  const f = state.ui.form;
  if (!f) return emptyState(ART_EMPTY, '没有正在编辑的记录', '回到记录库选择一条记录，或新建一条。', '新建记录', 'new-any');
  const editing = !!f.id;
  const t = typeOf(f.type);
  const steps = `<div class="steps">
    ${['选择类型', '填写核心字段', '上传媒体并确认'].map(function (s, i) {
    const n = i + 1;
    return (i ? '<span class="step__bar"></span>' : '') + `<span class="step ${f.step === n ? 'is-on' : (f.step > n ? 'is-done' : '')}"><i>${f.step > n ? '✓' : n}</i>${s}</span>`;
  }).join('')}
  </div>`;

  if (f.step === 1) {
    return steps + `<section class="card">
      ${secTitle('', '这一步做哪种记录？', `<span class="faint" style="font-size:12px">每种记录都有自己的场景字段，填起来更省事</span>`)}
      <div class="grid2" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
        ${TYPE_ORDER.map(function (k) {
      const T = TYPES[k];
      const on = f.type === k;
      return `<button class="qb" style="min-height:104px;${on ? 'border-color:var(--forest);background:var(--forest-wash)' : ''}" data-act="pick-type" data-type="${k}">
          <span class="qb__ic">${ic(T.icon, 20)}</span>
          <b>${esc(T.name)}</b><span>${esc(T.art)} · ${esc(T.desc)}</span>
          ${on ? `<span class="chip is-on" style="min-height:22px;font-size:11px">${ic('check', 12)}已选</span>` : ''}</button>`;
    }).join('')}
      </div>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn--gh" data-act="form-cancel">取消</button>
        <span style="flex:1"></span>
        <button class="btn btn--p" data-act="form-next">${ic('next', 17)}下一步 · 填写${esc(t.name)}字段</button>
      </div></section>`;
  }

  if (f.step === 2) {
    const core = t.fields.filter(x => x.s === 1);
    const more = t.fields.filter(x => x.s !== 1);
    const form = state.ui.form;
    const cl = form.checklist;
    return steps + `<section class="card">
      ${secTitle('', '填写' + t.name + '的核心字段', `<span class="chip" style="min-height:24px;font-size:11.5px">${ic(t.icon, 12)}${esc(t.plural)}</span>`)}
      <div class="field"><label>标题 <span class="hint">用它在一堆记录里认出这条</span></label>
        <input class="inp" id="f_title" placeholder="例如：安吉竹海 · 初秋轻露营" value="${esc(form.title || '')}" data-act="form-input" data-k="title"></div>
      <div class="row2">
        <div class="field"><label>日期</label><input class="inp" type="date" id="f_date" value="${esc(form.date || dstr(today()))}" data-act="form-input" data-k="date"></div>
        <div class="field"><label>状态</label><select class="sel" id="f_status" data-act="form-input" data-k="status">
          ${t.status.map(s => `<option value="${esc(s)}"${form.status === s ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
      </div>
      ${core.map(x => fieldHTML(x, form[x.k], f.type)).join('')}
      <div class="field"><label>标签 <span class="hint">用空格分隔，会立即出现在筛选里</span></label>
        <input class="inp" id="f_tags" placeholder="例如：轻装 竹林 营地宿营" value="${esc((form.tags || []).join(' '))}" data-act="form-input" data-k="tags"></div>
      ${f.type === 'activity' ? `<div class="card card--tent" style="padding:14px;margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px"><i class="tip tip--ember"></i><b class="t-h3">行前清单生成器</b>
          <span class="faint" style="font-size:11.5px">按出行形式 + 天气现象一键生成</span></div>
        <div class="row2">
          <label class="field" style="margin:0"><span class="hint">出行形式</span>
            <select class="sel" data-act="form-input" data-k="form">${(TYPES.activity.fields.filter(x => x.k === 'form')[0].opts).map(o => `<option${form.form === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></label>
          <label class="field" style="margin:0"><span class="hint">天气现象</span>
            <select class="sel" data-act="form-input" data-k="wx"><option value="">未选</option>${['晴', '多云', '阴', '阵雨', '大雨', '雪', '雾'].map(o => `<option${form.wx === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></label>
        </div>
        <div style="display:flex;gap:9px;margin-top:12px;align-items:center;flex-wrap:wrap">
          <button class="btn btn--k btn--sm" data-act="gen-clist">${ic('sparkle', 15)}生成清单</button>
          ${cl && cl.length ? `<span class="faint" style="font-size:12px">已生成 ${cl.length} 项，勾选后会写进备注</span>` : ''}
        </div>
        ${cl && cl.length ? `<div class="seg" style="margin-top:11px">${cl.map(c => `<button class="chip${(form.clPicked || []).indexOf(c) >= 0 ? ' is-on' : ''}" data-act="pick-clist" data-item="${esc(c)}">${(form.clPicked || []).indexOf(c) >= 0 ? ic('check', 13) : ic('plus', 13)}${esc(c)}</button>`).join('')}</div>` : ''}
        ${form.wx ? `<div class="srcnote" style="border-top-color:rgba(0,0,0,.08)"><b>天气提示：</b>${esc(suggestForWeather(form.wx))}</div>` : ''}
      </div>` : ''}
      <details class="card card--flat" style="margin-bottom:16px"${form.openMore ? ' open' : ''}>
        <summary style="cursor:pointer;font-weight:650;font-size:14px;display:flex;align-items:center;gap:8px">${ic('down', 16)}更多字段（可选，${more.length} 项）</summary>
        <div style="margin-top:14px">${more.map(x => fieldHTML(x, form[x.k], f.type)).join('')}</div>
      </details>
      <div class="field"><label>备注</label>
        <textarea class="txa" id="f_note" placeholder="写点路上才会知道的事：水源位置、营位背风情况、地钉好不好打…" data-act="form-input" data-k="note">${esc(form.note || '')}</textarea></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn--gh" data-act="form-prev">${ic('back', 16)}上一步</button>
        <span style="flex:1"></span>
        <button class="btn btn--gh" data-act="form-cancel">取消</button>
        <button class="btn btn--p" data-act="form-next">${ic('next', 17)}下一步 · 上传媒体</button>
      </div></section>`;
  }

  /* step 3 */
  const form = state.ui.form;
  const media = form.media || [];
  const summary = [['记录类型', t.name], ['标题', form.title || '（未填写）'], ['日期', form.date || ''],
  ['状态', form.status || ''],
  ...t.fields.filter(x => form[x.k] !== '' && form[x.k] != null && (!Array.isArray(form[x.k]) || form[x.k].length)).map(x => [x.l, Array.isArray(form[x.k]) ? form[x.k].map(i => titleOf(i)).join('、') : x.t === 'ref' ? titleOf(form[x.k]) : form[x.k] + (x.u && x.t === 'number' ? ' ' + x.u : '')]),
  ['标签', (form.tags || []).join(' ') || '（无）']];

  return steps + `<section class="card">
    ${secTitle('', '上传媒体并确认', `<span class="chip" style="min-height:24px;font-size:11.5px">${editing ? '编辑模式' : '新增模式'}</span>`)}
    <div class="drop" data-act="pick-file">
      ${ic('upload', 26)}
      <b style="font-size:14px;color:var(--ink)">点这里选择照片，或把文件拖进来</b>
      <span>支持 JPG / PNG，自动压缩到 800 像素宽，最多 9 张</span>
      <input type="file" accept="image/*" multiple id="f_file" style="display:none" data-act="file-input">
    </div>
    ${media.length ? `<div class="thumbs">${media.map(function (m, i) {
    return `<div class="thumb${m.bad ? ' is-bad' : ''}" data-act="retry-thumb" data-i="${i}">
        <img src="${esc(m.url)}" alt="待上传图 ${i + 1}">
        <button class="thumb__x" data-act="del-thumb" data-i="${i}">${ic('close', 13)}</button>
        <span class="thumb__pg"><i style="width:${m.bad ? 0 : 100}%"></i></span></div>`;
  }).join('')}</div>` : ''}
    <div class="field" style="margin-top:16px"><label>录音 / 资料 / 凭证 <span class="hint">可选，记录现场声音或票据</span></label>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn btn--gh btn--sm" data-act="attach" data-kind="录音">${ic('mic', 15)}添加录音</button>
        <button class="btn btn--gh btn--sm" data-act="attach" data-kind="资料">${ic('file', 15)}添加资料</button>
        <button class="btn btn--gh btn--sm" data-act="attach" data-kind="凭证">${ic('wallet', 15)}添加凭证</button>
      </div>
      ${(form.attaches || []).length ? `<div class="seg" style="margin-top:10px">${form.attaches.map((a, i) => `<span class="chip" style="min-height:30px;font-size:12.5px">${ic('file', 13)}${esc(a)}<button class="ibtn" style="width:20px;height:20px" data-act="del-attach" data-i="${i}">${ic('close', 12)}</button></span>`).join('')}</div>` : ''}
    </div>
    <div style="border-top:1px dashed var(--line);margin:6px 0 14px"></div>
    ${secTitle('', '确认内容')}
    <div class="kv" style="margin-bottom:16px">${summary.map(x => `<div class="kv__r"><div class="kv__k">${esc(x[0])}</div><div class="kv__v">${esc(x[1] == null ? '' : x[1])}</div></div>`).join('')}</div>
    ${!editing ? `<div class="card card--wash" style="margin-bottom:16px"><div class="srcnote" style="border:none;padding:0;margin:0">
      <b>保存后会自动发生：</b>记录总数 +1、首页与洞察的统计更新、日历上这一天出现标记、照片进入相册、并生成一条「最近动态」。</div></div>` : ''}
    <div style="display:flex;gap:10px">
      <button class="btn btn--gh" data-act="form-prev">${ic('back', 16)}上一步</button>
      <span style="flex:1"></span>
      <button class="btn btn--gh" data-act="form-cancel">取消</button>
      <button class="btn btn--p" data-act="form-save">${editing ? ic('check', 17) + '保存修改' : ic('plus', 17) + '保存并入库'}</button>
    </div></section>`;
}
function fieldHTML(f, v, type) {
  v = v == null ? (f.def != null ? f.def : '') : v;
  let inner = '';
  if (f.t === 'select') {
    inner = `<select class="sel" data-act="form-input" data-k="${f.k}"><option value="">未选择</option>${(f.opts || []).map(o => `<option value="${esc(o)}"${v === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  } else if (f.t === 'date') {
    inner = `<input class="inp" type="date" value="${esc(v)}" data-act="form-input" data-k="${f.k}">`;
  } else if (f.t === 'number') {
    inner = `<input class="inp" type="number"${f.step ? ` step="${f.step}"` : ''} inputmode="decimal" value="${esc(v)}" placeholder="0" data-act="form-input" data-k="${f.k}">`;
  } else if (f.t === 'range') {
    const max = f.max || 100;
    inner = `<div style="display:flex;align-items:center;gap:12px">
      <input type="range" min="0" max="${max}"${f.step ? ` step="${f.step}"` : ''} value="${esc(v === '' ? 0 : v)}" style="flex:1;accent-color:#5C8A6B" data-act="form-input" data-k="${f.k}" data-range="1" data-u="${esc(f.u || '')}">
      <b class="t-num-sm" style="min-width:64px;text-align:right" id="rv_${f.k}">${esc(v === '' ? 0 : v)}${f.u ? ' ' + esc(f.u) : ''}</b></div>`;
  } else if (f.t === 'ref') {
    const opts = refOptions(f.ref);
    inner = `<select class="sel" data-act="form-input" data-k="${f.k}"><option value="">未关联</option>${opts.map(o => `<option value="${esc(o.id)}"${v === o.id ? ' selected' : ''}>${esc(o.title)} · ${esc(fmtMD(o.date))}</option>`).join('')}</select>`;
  } else if (f.t === 'refmany') {
    const opts = refOptions(f.ref).slice(0, 12);
    const picked = Array.isArray(v) ? v : [];
    inner = `<div class="seg">${opts.map(o => `<button class="chip${picked.indexOf(o.id) >= 0 ? ' is-on' : ''}" data-act="pick-ref" data-k="${f.k}" data-id="${esc(o.id)}">${picked.indexOf(o.id) >= 0 ? ic('check', 13) : ''}${esc(o.title)}</button>`).join('')}</div>`;
  } else {
    inner = `<input class="inp" placeholder="${esc(f.ph || '')}" value="${esc(v)}" data-act="form-input" data-k="${f.k}">`;
  }
  return `<div class="field"><label>${esc(f.l)}${f.req ? ' <span class="hint" style="color:#A8422E">必填</span>' : ''}${f.u && f.t === 'number' ? ` <span class="hint">单位 ${esc(f.u)}</span>` : ''}${f.hint ? ` <span class="hint">${esc(f.hint)}</span>` : ''}</label>${inner}</div>`;
}

/* ---------------- 户外战报（活动结束） ---------------- */
function buildReport(act) {
  const wx = recs().filter(r => r.type === 'weather' && r.date === act.date)[0] || recs().filter(r => r.type === 'weather')[0];
  const route = act.routeRef ? byId(act.routeRef) : null;
  const camp = act.campRef ? byId(act.campRef) : null;
  const photos = recs().filter(r => r.type === 'media' && (r.relRef || []).indexOf(act.id) >= 0);
  const cost = sum(recs().filter(r => r.type === 'budget' && r.actRef === act.id), r => r.amount);
  const gears = (act.gearRef || []).map(byId).filter(Boolean);
  const lines = [
    '【户外战报】' + act.title,
    '时间：' + fmtYMD(act.date) + ' · ' + act.days + ' 天 · ' + act.people + ' 人',
    '地点：' + (act.place || '—') + '　形式：' + (act.form || '—'),
    '里程：' + fmtNum(act.dist) + ' km' + (route ? '（路线：' + route.title + '，爬升 ' + fmtNum(route.ascent) + ' m，难度 ' + route.difficulty + '）' : ''),
    '营地：' + (camp ? camp.title + '（海拔 ' + camp.alt + ' m，' + camp.water + '）' : '未记录'),
    '天气：' + (wx ? wx.wtype + ' ' + wx.temp + '°C · 风力 ' + wx.wind + ' 级' : '未记录'),
    '花费：' + money(cost || act.cost) + '　携带装备：' + (gears.length ? gears.map(g => g.title).join('、') : '未记录'),
    '影像：' + (photos.length ? photos.map(p => p.title).join('、') : '暂无'),
    '一件记得的事：' + (act.note || '—')
  ];
  return lines.join('\n');
}

/* ---------------- 路由 ---------------- */
function parseHash() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  const p = h.split('/').filter(Boolean);
  if (!p.length) return { name: 'home', arg: '', sub: '' };
  const head = p[0];
  if (head === 'r') return { name: 'detail', arg: p[1] || '', sub: '' };
  if (head === 'new') return { name: 'form', arg: 'new', sub: p[1] || '' };
  if (head === 'edit') return { name: 'form', arg: 'edit', sub: p[1] || '' };
  if (head === 'report') return { name: 'report', arg: p[1] || '', sub: '' };
  if (head === 'lib') return { name: 'lib', arg: p[1] || '', sub: '' };
  if (NAV.some(n => n.key === head)) return { name: head, arg: '', sub: '' };
  return { name: 'home', arg: '', sub: '' };
}
function goto(href) {
  if (location.hash === href) { refreshAll(); return; }
  location.hash = href;
}
function pageMeta() {
  const r = state.route;
  if (r.name === 'home') return { title: '山野首页', sub: '轻装出发，也把每一次野外记住' };
  if (r.name === 'lib') {
    const t = typeOf(state.ui.type);
    return { title: state.ui.type === 'all' ? '核心记录库' : t.plural, sub: state.ui.type === 'all' ? '活动 · 营地 · 路线 · 天气 · 装备 · 食物 · 预算 · 维护 · 采购 · 照片' : t.desc };
  }
  if (r.name === 'plan') return { title: '行前计划', sub: '日历与时间轴：什么时候出发、什么时候保养' };
  if (r.name === 'insight') return { title: '数据洞察', sub: '每个数字都能追溯到具体记录' };
  if (r.name === 'album') return { title: '野外相册', sub: '营地 · 路线 · 炊事 · 天色' };

  return { title: '山野清单', sub: '' };
}
function renderPage() {

/* 表单状态的唯一构造入口：新建用 newForm，编辑用 formFromRecord */

function formFromRecord(r) {

  Object.keys(r).forEach(function (k) { f[k] = Array.isArray(r[k]) ? r[k].slice() : r[k]; });

/* 路由归一化：保证 form 路由一定有可用的表单状态（首屏直开 #/new/xxx 或 #/edit/xxx 也成立） */
function normalizeRoute() {
  const r = state.route;
  if (r.name !== 'form') return;
  if (r.arg === 'edit') {
    const src = byId(r.sub);
    if (!src) { state.ui.form = null; return; }
    if (!state.ui.form || state.ui.form.id !== src.id) state.ui.form = formFromRecord(src);
    return;
  }
  const t = r.sub || '';
  const cur = state.ui.form;
  if (!cur || cur.id || (t && cur.type !== t)) state.ui.form = newForm(t || (cur ? cur.type : 'activity'));
}

/* ---------------- 文件与图片处理 ---------------- */
function handleFiles(files) {
  const f = state.ui.form; if (!f) return;
  f.media = f.media || [];
  Array.prototype.slice.call(files).slice(0, 9 - f.media.length).forEach(function (file) {
    if (!/^image\//.test(file.type)) { toast('「' + file.name + '」不是图片，已跳过', 'warn'); return; }
    const item = { url: '', bad: false };
    f.media.push(item);
    const fr = new FileReader();
    fr.onload = function () {
      const img = new Image();
      img.onload = function () {
        try {
          const maxW = 800;
          const sc = Math.min(1, maxW / img.width);
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          item.url = cv.toDataURL('image/jpeg', 0.82);
          item.bad = false;
          toast('已添加「' + file.name + '」，压缩到 ' + cv.width + '×' + cv.height);
        } catch (e) { item.bad = true; toast('「' + file.name + '」处理失败，点缩略图可重试', 'warn'); }
        refreshAll();
      };
      img.onerror = function () { item.bad = true; toast('「' + file.name + '」读取失败，点缩略图可重试', 'warn'); refreshAll(); };
      img.src = fr.result;
    };
    fr.onerror = function () { item.bad = true; refreshAll(); };
    fr.readAsDataURL(file);
  });
  refreshAll();
}

  if (e.key === 'Escape') { closeModal(); closeSheet(); closeLightbox(); return; }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); if (state.route.name !== 'lib') { goto('#/lib'); setTimeout(function () { const q = $('#libQ'); if (q) q.focus(); }, 60); } else { const q = $('#libQ'); if (q) q.focus(); } return; }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); startForm(null, state.ui.type === 'all' ? 'activity' : state.ui.type); return; }
  if (/^[1-6]$/.test(e.key)) { const n = NAV[+e.key - 1]; if (n) goto(n.href); return; }
  if (e.key === '?' ) HANDLERS['help']();
}
function onScroll() {
  const b = $('#totop');
  if (b) b.style.display = window.scrollY > 480 ? 'flex' : 'none';
  const rail = $('#rail');
  if (rail) rail.style.display = (state.route.name === 'home' && window.innerWidth > 1279) ? '' : 'none';
}

/* ---------------- 启动 ---------------- */
function boot() {
  document.getElementById('root').innerHTML = shellHTML();
  loadData();
  syncCrests();
  state.route = parseHash();
  if (state.route.name === 'lib' && state.route.arg) state.ui.type = state.route.arg;
  refreshAll();

  document.addEventListener('click', function (e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.getAttribute('data-act');
    if (act === 'mask-close') { if (e.target === el) { closeModal(); closeSheet(); } return; }
    if (PASS_CLICK[act] && /^(input|select|textarea)$/i.test(el.tagName)) return;
    if (el.tagName === 'BUTTON' || el.tagName === 'A' || el.tagName === 'DIV' || el.tagName === 'SPAN' || el.tagName === 'LABEL') e.preventDefault();
    const h = HANDLERS[act];
    if (h) h(el, e);
  }, false);

  document.addEventListener('input', function (e) {
    const el = e.target.closest('[data-act="form-input"]');
    if (el) {
      const k = el.getAttribute('data-k');
      let v = el.value;
      if (k === 'tags') v = v.split(/[\s,，、]+/).filter(Boolean);
      state.ui.form[k] = v;
      if (el.getAttribute('data-range')) {
        const b = $('#rv_' + k), u = el.getAttribute('data-u') || '';
        if (b) b.textContent = v + (u ? ' ' + u : '');
      }
      return;
    }
    const q = e.target.closest('[data-act="search-input"]');
    if (q) {
      state.ui.q = q.value; state.ui._focusQ = true;
      if (state._qt) clearTimeout(state._qt);
      state._qt = setTimeout(function () { refreshAll(); }, 260);
    }
  }, false);

  document.addEventListener('change', function (e) {
    const s = e.target.closest('[data-act="form-input"]');
    if (s && /^(SELECT|INPUT)$/i.test(s.tagName)) {
      const k = s.getAttribute('data-k');
      state.ui.form[k] = s.value;
      if (k === 'form' || k === 'wx') { state.ui.form.checklist = null; state.ui.form.clPicked = []; refreshAll(); }
      return;
    }
    const so = e.target.closest('[data-act="sort-change"]');
    if (so) { state.ui.sort = so.value; refreshAll(); return; }
    const rf = e.target.closest('[data-act="set-from"]');
    if (rf) { state.ui.customFrom = rf.value; refreshAll(); return; }
    const rt = e.target.closest('[data-act="set-to"]');
    if (rt) { state.ui.customTo = rt.value; refreshAll(); return; }
    const fi = e.target.closest('[data-act="file-input"]');
    if (fi && fi.files && fi.files.length) { handleFiles(fi.files); fi.value = ''; }
  }, false);

  document.addEventListener('keydown', onKey, false);
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', function () {
    const rail = $('#rail');
    if (rail) rail.style.display = (state.route.name === 'home' && window.innerWidth > 1279) ? '' : 'none';
  });
  window.addEventListener('hashchange', function () {
    const r = parseHash();
    if (r.name === 'lib' && r.arg) state.ui.type = r.arg;
    state.route = r;
    refreshAll();
  });
  /* 拖拽上传 */
  document.addEventListener('dragover', function (e) { if (state.route.name === 'form') { e.preventDefault(); } });
  document.addEventListener('drop', function (e) {
    if (state.route.name === 'form' && e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); handleFiles(e.dataTransfer.files); }
  });
  window.addEventListener('beforeunload', function () { if (state.sync === 'syncing') LS.set(STORE_KEY, JSON.stringify(state.data)); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body>
</html>
