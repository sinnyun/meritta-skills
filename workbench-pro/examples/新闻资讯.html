<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>个人咨询工作台</title>
<style>
  :root{
    --accent:#6c5ce7;
    --blue:#3b82f6;
    --teal:#0ea5a4;
    --orange:#f59e0b;
    --pink:#ec4899;
    --text:#2b2f3a;
    --text-2:#8a90a0;
    --card:rgba(255,255,255,.74);
    --card-solid:#ffffff;
    --border:rgba(255,255,255,.65);
    --line:rgba(43,47,58,.08);
    --shadow:0 8px 28px rgba(52,63,96,.10);
    --shadow-lift:0 14px 36px rgba(52,63,96,.16);
    --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    color:var(--text);
    font-size:15px;line-height:1.5;
    min-height:100vh;
    background:linear-gradient(135deg,#d9f4e7 0%,#dcebfc 34%,#e9e3fb 66%,#fce4f0 100%) fixed;
    -webkit-font-smoothing:antialiased;
  }
  /* 自定义背景图层（设置中上传/填写） */
  #bgLayer{
    position:fixed;inset:0;z-index:-1;
    background-size:cover;background-position:center;
    opacity:0;transition:opacity .6s ease;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}
  ::selection{background:rgba(108,92,231,.22);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(43,47,58,.14);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ===== 顶部导航栏 ===== */
  .topbar{
    position:sticky;top:0;z-index:100;
    padding:14px 20px 6px;
    max-width:1240px;margin:0 auto;
  }
  .topbar-card{
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.8);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border:1px solid var(--border);border-radius:980px;
    padding:9px 14px 9px 10px;box-shadow:var(--shadow);
  }
  .avatar{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,#6c5ce7,#3b82f6);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(108,92,231,.35);
  }
  .topbar-title{font-size:17px;font-weight:600;letter-spacing:-.01em;}
  .topbar-sub{font-size:12px;color:var(--text-2);margin-top:1px;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .sync-pill{
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--text-2);
    background:rgba(43,47,58,.05);border-radius:980px;padding:6px 12px;
    transition:all .3s ease;
  }
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.7);}
  .sync-pill.saving .sync-dot{background:#f59e0b;box-shadow:0 0 6px rgba(245,158,11,.7);}
  .icon-btn{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-2);transition:all .25s ease;
  }
  .icon-btn:hover{background:rgba(43,47,58,.07);color:var(--text);transform:rotate(30deg);}

  /* ===== 主体卡片 · 瀑布流 ===== */
  .board{
    max-width:1240px;margin:0 auto;padding:12px 20px 40px;
    columns:3;column-gap:18px;
  }
  .card{
    background:var(--card);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    animation:fadeUp .5s ease both;
    transition:box-shadow .35s ease,transform .35s ease;
    min-width:0;
    break-inside:avoid;-webkit-column-break-inside:avoid;
    margin-bottom:18px;
  }
  .card:nth-child(2){animation-delay:.06s;}
  .card:nth-child(3){animation-delay:.12s;}
  .card:nth-child(4){animation-delay:.18s;}
  .card:nth-child(5){animation-delay:.24s;}
  .card:nth-child(6){animation-delay:.3s;}
  .card:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .card-ico{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .card-title{font-size:16px;font-weight:600;letter-spacing:-.01em;}
  .card-head-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
  .count-badge{font-size:13px;font-weight:600;color:var(--text-2);}
  .mini-btn{
    width:28px;height:28px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(108,92,231,.1);color:var(--accent);
    transition:all .25s ease;
  }
  .mini-btn:hover{background:var(--accent);color:#fff;transform:scale(1.08);}
  .ghost{
    font-size:12px;color:var(--text-2);padding:5px 11px;border-radius:980px;
    border:1px solid var(--line);background:rgba(255,255,255,.6);transition:all .25s ease;
  }
  .ghost:hover{color:var(--accent);border-color:rgba(108,92,231,.4);}

  /* ===== 卡片1 · AI 热门 ===== */
  .news-list{max-height:560px;overflow-y:auto;margin:0 -6px;padding:0 6px;}
  .news-item{padding:12px 4px;border-bottom:1px solid var(--line);animation:fadeUp .4s ease both;}
  .news-item:last-child{border-bottom:none;}
  .news-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .src-chip{
    font-size:11px;font-weight:600;color:#fff;
    padding:2px 8px;border-radius:6px;flex-shrink:0;
  }
  .news-date{font-size:11px;color:var(--text-2);margin-left:auto;flex-shrink:0;}
  .news-title{font-size:14px;font-weight:600;line-height:1.4;margin-bottom:4px;}
  .news-item a.news-title{color:var(--text);text-decoration:none;transition:color .2s;}
  .news-item a.news-title:hover{color:var(--accent);}
  .news-summary{
    font-size:12px;color:var(--text-2);line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .news-foot{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
    font-size:12px;color:var(--text-2);
  }
  .empty-tip{text-align:center;color:var(--text-2);font-size:13px;padding:36px 10px;}

  /* ===== 卡片2 · 待办 ===== */
  .todo-add{
    display:flex;gap:8px;margin-bottom:12px;
  }
  .todo-add input{
    flex:1;min-width:0;border:1px solid var(--line);outline:none;
    background:rgba(255,255,255,.7);border-radius:12px;
    padding:9px 13px;font-size:14px;color:var(--text);
    transition:border-color .25s ease,box-shadow .25s ease;
  }
  .todo-add input::placeholder{color:var(--text-2);}
  .todo-add input:focus{border-color:rgba(108,92,231,.5);box-shadow:0 0 0 3px rgba(108,92,231,.12);}
  .todo-add button{
    flex-shrink:0;padding:0 16px;border-radius:12px;font-size:13px;font-weight:600;
    background:linear-gradient(135deg,#6c5ce7,#5a8df0);color:#fff;
    box-shadow:0 4px 12px rgba(108,92,231,.3);
    transition:all .25s ease;
  }
  .todo-add button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(108,92,231,.4);}
  .todo-list{display:flex;flex-direction:column;gap:8px;max-height:480px;overflow-y:auto;}
  .todo-row{
    display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.9);
    border-radius:14px;padding:10px 12px;
    transition:transform .25s ease,box-shadow .25s ease,opacity .3s ease;
    animation:fadeUp .4s ease both;
  }
  .todo-row:hover{transform:translateX(3px);box-shadow:0 4px 14px rgba(52,63,96,.10);}
  .todo-check{
    width:20px;height:20px;border-radius:7px;flex-shrink:0;
    border:2px solid #cfd4e0;display:flex;align-items:center;justify-content:center;
    color:#fff;transition:all .25s ease;
  }
  .todo-row.done .todo-check{background:#22c55e;border-color:#22c55e;}
  .todo-text{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .todo-row.done .todo-text{color:var(--text-2);text-decoration:line-through;}
  .todo-del{
    flex-shrink:0;width:26px;height:26px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    color:transparent;transition:all .2s ease;
  }
  .todo-row:hover .todo-del{color:#ef4444;background:rgba(239,68,68,.08);}
  .todo-del:hover{background:rgba(239,68,68,.16)!important;}

  /* ===== 卡片3 · 工具铭 ===== */
  .entry-row{display:flex;flex-direction:column;gap:8px;}
  .entry{
    border-radius:14px;transition:background .25s ease;
  }
  .entry-btn{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:11px 12px;border-radius:14px;text-align:left;
    transition:background .25s ease;
  }
  .entry-btn:hover,.entry.open .entry-btn{background:rgba(43,47,58,.05);}
  .entry-ico{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;color:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .entry-name{font-size:14px;font-weight:600;flex:1;}
  .entry-arrow{color:var(--text-2);transition:transform .3s ease;flex-shrink:0;}
  .entry.open .entry-arrow{transform:rotate(180deg);}
  .entry-panel{
    max-height:0;overflow:hidden;
    transition:max-height .4s cubic-bezier(.25,.8,.25,1),opacity .35s ease;
    opacity:0;
  }
  .entry.open .entry-panel{max-height:420px;opacity:1;}
  .panel-inner{padding:4px 12px 12px 52px;}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;color:var(--text);text-decoration:none;
    background:rgba(255,255,255,.9);border:1px solid var(--line);
    border-radius:12px;padding:7px 13px;
    transition:all .25s ease;position:relative;
  }
  .chip:hover{
    border-color:rgba(108,92,231,.5);color:var(--accent);
    transform:translateY(-1px);box-shadow:0 4px 10px rgba(108,92,231,.14);
  }
  .chip.plain{cursor:default;}
  .chip.plain:hover{color:var(--text);border-color:var(--line);transform:none;box-shadow:none;}
  .chip-del{
    display:none;align-items:center;justify-content:center;
    width:15px;height:15px;border-radius:50%;
    background:rgba(239,68,68,.12);color:#ef4444;font-size:10px;flex-shrink:0;
  }
  .chip:hover .chip-del{display:flex;}
  .chip-form{display:flex;flex-direction:column;gap:7px;}
  .chip-form input{
    border:1px solid var(--line);outline:none;background:rgba(255,255,255,.7);
    border-radius:10px;padding:7px 11px;font-size:13px;color:var(--text);
    transition:border-color .25s ease,box-shadow .25s ease;width:100%;
  }
  .chip-form input:focus{border-color:rgba(108,92,231,.5);box-shadow:0 0 0 3px rgba(108,92,231,.1);}
  .chip-form button{
    align-self:flex-start;font-size:12px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,#0ea5a4,#3b82f6);
    padding:7px 16px;border-radius:980px;
    box-shadow:0 3px 10px rgba(14,165,164,.3);
    transition:all .25s ease;
  }
  .chip-form button:hover{transform:translateY(-1px);}

  /* ===== 新闻已读/收藏交互 ===== */
  .news-item a.news-title{display:block;cursor:pointer;}
  .news-item.read a.news-title{color:var(--text-2);font-weight:500;}
  .read-toggle{
    width:20px;height:20px;border-radius:50%;flex-shrink:0;padding:0;
    display:flex;align-items:center;justify-content:center;
    border:2px solid #cfd4e0;color:#22c55e;background:transparent;
    transition:all .25s ease;
  }
  .read-toggle:hover{border-color:var(--accent);transform:scale(1.12);}
  .read-toggle.done{border-color:#86efac;}
  .read-toggle.done:hover{border-color:#22c55e;}
  .read-dot{
    width:8px;height:8px;border-radius:50%;display:block;
    background:var(--accent);box-shadow:0 0 6px rgba(108,92,231,.65);
    animation:dotPulse 2.2s ease-in-out infinite;
  }
  @keyframes dotPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .fav-btn{
    width:26px;height:26px;border-radius:8px;flex-shrink:0;margin-left:2px;
    display:flex;align-items:center;justify-content:center;
    color:#c9cede;transition:all .25s ease;
  }
  .fav-btn:hover{color:var(--orange);transform:scale(1.15);}
  .fav-btn.on{color:var(--orange);}
  .fav-btn.on svg{filter:drop-shadow(0 1px 4px rgba(245,158,11,.5));}
  .ghost.on{color:#fff;background:var(--accent);border-color:var(--accent);}
  .fav-list{max-height:420px;overflow-y:auto;margin:0 -6px;padding:0 6px;}
  .fav-row{display:flex;align-items:flex-start;gap:8px;padding:11px 4px;border-bottom:1px solid var(--line);animation:fadeUp .4s ease both;}
  .fav-row:last-child{border-bottom:none;}
  .fav-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-2);margin-top:4px;}
  .fav-del{
    flex-shrink:0;width:26px;height:26px;border-radius:8px;margin-top:2px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-2);transition:all .2s ease;
  }
  .fav-del:hover{color:#ef4444;background:rgba(239,68,68,.1);}

  /* ===== 热点趋势 ===== */
  .trend-row{display:flex;align-items:center;gap:10px;padding:9px 2px;}
  .trend-rank{width:20px;font-size:13px;font-weight:700;color:var(--text-2);flex-shrink:0;}
  .trend-row:nth-child(-n+3) .trend-rank{color:var(--accent);}
  .trend-name{font-size:13px;font-weight:600;flex-shrink:0;}
  .trend-bar{flex:1;height:6px;border-radius:6px;background:rgba(43,47,58,.07);overflow:hidden;}
  .trend-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#8b5cf6,#3b82f6);transition:width .8s cubic-bezier(.25,.8,.25,1);}
  .trend-count{font-size:11px;color:var(--text-2);flex-shrink:0;}

  /* ===== 阅读统计 ===== */
  .stat-strip{display:flex;gap:8px;margin-bottom:6px;}
  .stat-cell{
    flex:1;background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.9);
    border-radius:14px;padding:11px 6px;text-align:center;
    transition:transform .25s ease,box-shadow .25s ease;
  }
  .stat-cell:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(52,63,96,.1);}
  .stat-num{font-size:20px;font-weight:700;letter-spacing:-.02em;}
  .stat-num.purple{color:var(--accent);}
  .stat-num.blue{color:var(--blue);}
  .stat-num.orange{color:var(--orange);}
  .stat-lab{font-size:11px;color:var(--text-2);margin-top:2px;}
  .stat-sec{font-size:12px;font-weight:600;color:var(--text-2);margin:14px 0 6px;}
  .pref-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;}
  .pref-name{width:64px;flex-shrink:0;font-weight:500;}
  .pref-bar{flex:1;height:7px;border-radius:7px;background:rgba(43,47,58,.07);overflow:hidden;}
  .pref-bar i{display:block;height:100%;border-radius:7px;transition:width .8s cubic-bezier(.25,.8,.25,1);}
  .pref-val{width:24px;text-align:right;color:var(--text-2);font-size:11px;flex-shrink:0;}

  /* ===== 交互增强 ===== */
  .trend-row{cursor:pointer;border-radius:10px;transition:background .2s ease,transform .2s ease;}
  .trend-row:hover{background:rgba(108,92,231,.07);transform:translateX(3px);}
  .trend-row.active .trend-name{color:var(--accent);}
  .trend-row.active .trend-bar i{background:linear-gradient(90deg,#f59e0b,#f472b6);}
  .stat-cell{cursor:pointer;}
  .todo-text{cursor:pointer;}
  .fav-row a.news-title{color:var(--text);text-decoration:none;transition:color .2s ease;}
  .fav-row a.news-title:hover{color:var(--accent);}
  .card.flash{box-shadow:0 0 0 3px rgba(108,92,231,.45), var(--shadow-lift);}

  /* ===== 页内阅读弹层 ===== */
  .reader-mask{
    position:fixed;inset:0;z-index:300;
    background:rgba(30,34,48,.45);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    display:none;justify-content:center;
    padding:28px 20px;overflow-y:auto;
  }
  .reader-mask.show{display:flex;animation:fadeIn .25s ease both;}
  .reader{
    width:100%;max-width:680px;margin:auto;
    background:rgba(255,255,255,.97);
    border:1px solid var(--border);border-radius:22px;
    box-shadow:0 24px 60px rgba(40,50,80,.28);
    padding:26px 28px;animation:fadeUp .3s ease both;
  }
  .reader-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .reader-date{font-size:12px;color:var(--text-2);}
  .reader-close{
    margin-left:auto;width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-2);transition:all .25s ease;flex-shrink:0;
  }
  .reader-close:hover{background:rgba(43,47,58,.07);color:var(--text);transform:rotate(90deg);}
  .reader-title{font-size:21px;font-weight:600;line-height:1.4;letter-spacing:-.01em;margin-bottom:12px;}
  .reader-body{font-size:15px;line-height:1.85;color:var(--text);}
  .reader-body p{margin-bottom:12px;}
  .reader-note{font-size:13px;color:var(--text-2);background:rgba(43,47,58,.04);border-radius:12px;padding:10px 14px;}
  .reader-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
  #readerFavBtn.on{color:#fff;background:var(--orange);border-color:var(--orange);}

  /* ===== 底部提醒浮标 ===== */
  .float-tip{
    position:fixed;right:20px;bottom:20px;z-index:90;
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.85);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid var(--border);border-radius:980px;
    padding:10px 18px;font-size:13px;font-weight:500;color:var(--text);
    box-shadow:var(--shadow);
    animation:fadeUp .5s ease both;
    transition:transform .3s ease,box-shadow .3s ease;
  }
  .float-tip:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);}
  .float-cat{font-size:16px;line-height:1;}

  /* ===== 设置弹窗 ===== */
  .mask{
    position:fixed;inset:0;z-index:200;background:rgba(30,34,48,.35);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .mask.show{display:flex;animation:fadeIn .25s ease both;}
  .modal{
    width:100%;max-width:400px;
    background:rgba(255,255,255,.94);border-radius:22px;
    border:1px solid var(--border);box-shadow:0 24px 60px rgba(40,50,80,.25);
    padding:24px;animation:fadeUp .3s ease both;
  }
  .modal h3{font-size:17px;font-weight:600;margin-bottom:18px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:500;color:var(--text-2);margin-bottom:7px;}
  .field input[type="text"]{
    width:100%;border:1px solid var(--line);outline:none;background:#fff;
    border-radius:12px;padding:9px 13px;font-size:14px;color:var(--text);
    transition:border-color .25s ease,box-shadow .25s ease;
  }
  .field input[type="text"]:focus{border-color:rgba(108,92,231,.5);box-shadow:0 0 0 3px rgba(108,92,231,.12);}
  .field input[type="file"]{font-size:13px;color:var(--text-2);width:100%;}
  .field input[type="range"]{width:100%;accent-color:var(--accent);}
  .range-val{font-size:12px;color:var(--text-2);text-align:right;margin-top:3px;}
  .modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}
  .btn-plain{
    font-size:13px;padding:9px 18px;border-radius:980px;
    color:var(--text-2);border:1px solid var(--line);transition:all .25s ease;
  }
  .btn-plain:hover{color:var(--text);background:rgba(43,47,58,.05);}
  .btn-main{
    font-size:13px;font-weight:600;padding:9px 22px;border-radius:980px;color:#fff;

/* 阅读记录迁移：给没有 newsMeta 的老数据补一份默认阅读/收藏记录 */
function seedNewsMeta(){
  var now = Date.now(), H = 3600000;
  var idx = [0, 1, 2, 5, 6], spans = [2, 26, 50, 74, 98];
  state.newsMeta = {};
  idx.forEach(function(i, j){
    state.newsMeta[DEFAULT_POOL[i].t] = {read: now - spans[j]*H, fav: j===0 ? now - H : 0};
  });
}

/* 8:00 自动刷新：以「当前生效周期」为 key，跨周期自动轮换下一批 5 条 */
function refreshKey(){
  var now = new Date();
  var k = new Date(now);
  if(now.getHours() < REFRESH_HOUR) k.setDate(k.getDate()-1);
  return k.getFullYear()+'-'+(k.getMonth()+1)+'-'+k.getDate();
}
function nowHM(){
  var d = new Date(), p = function(n){return n<10?'0'+n:''+n;};
  return p(d.getHours())+':'+p(d.getMinutes());
}
function autoRotate(){
  var key = refreshKey();
  if(state.newsKey !== key){
    state.newsKey = key;
    state.newsIndex = (state.newsIndex + 5) % Math.max(state.newsPool.length, 5);
    state.newsUpdatedAt = nowHM();
    save();
  }
}
function manualRotate(){
  state.newsIndex = (state.newsIndex + 5) % Math.max(state.newsPool.length, 5);
  state.newsUpdatedAt = nowHM();
  save();
}
function visibleNews(){
  var pool = state.newsPool.slice().sort(function(a,b){ return a.d < b.d ? 1 : -1; });
  var n = Math.min(5, pool.length);
  var start = state.newsIndex % Math.max(pool.length - n + 1, 1);
  return pool.slice(start, start + n);
}

    d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · 星期'+wd;

function isRead(n){ var m = state.newsMeta[n.t]; return !!(m && m.read); }
function isFav(n){ var m = state.newsMeta[n.t]; return !!(m && m.fav); }
function newsHref(n){
  if(n.u) return n.u;  // 新闻自带原文链接时直接使用
  return 'https://www.baidu.com/s?wd=' + encodeURIComponent(n.t + ' ' + n.src);
}
function renderNews(){
  var el = document.getElementById('newsList');
  var list;
  if(state.kwFilter){
    /* 关键词筛选模式：检索整个素材池，按日期倒序 */
    var def = null;
    TREND_KWS.forEach(function(d){ if(d.k === state.kwFilter) def = d; });
    list = state.newsPool.filter(function(n){ return def && (def.re.test(n.t) || def.re.test(n.s)); })
      .sort(function(a,b){ return a.d < b.d ? 1 : -1; });
  }else{
    list = visibleNews();
    if(state.filterUnread) list = list.filter(function(n){ return !isRead(n); });
  }
  el.innerHTML = list.map(function(n, i){
    var read = isRead(n), fav = isFav(n);
    var inner =
      '<div class="news-top">'+
        '<button class="read-toggle'+(read?' done':'')+'" data-act="toggleRead" data-key="'+esc(n.t)+'" title="'+(read?'标记为未读':'标记为已读')+'" aria-label="切换已读">'+
          (read
            ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
            : '<span class="read-dot"></span>')+
        '</button>'+
        '<span class="src-chip" style="background:'+srcColor(n.src)+'">'+esc(n.src)+'</span>'+
        '<span class="news-date">'+esc(n.d)+'</span>'+
        '<button class="fav-btn'+(fav?' on':'')+'" data-act="toggleFav" data-key="'+esc(n.t)+'" title="稍后读" aria-label="稍后读">'+
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12 2.8l2.85 5.78 6.38.93-4.62 4.5 1.09 6.35L12 17.37l-5.7 3 1.09-6.36-4.62-4.5 6.38-.92z"/></svg>'+
        '</button>'+
      '</div>'+
      '<a class="news-title" href="'+newsHref(n)+'" target="_blank" rel="noopener" data-news-link data-key="'+esc(n.t)+'" title="点击查看详情">'+esc(n.t)+'</a>'+
      '<div class="news-summary">'+esc(n.s)+'</div>';
    return '<div class="news-item'+(read?' read':'')+'" style="animation-delay:'+Math.min(i*0.06,0.3)+'s">'+inner+'</div>';
  }).join('') || '<div class="empty-tip">'+(state.kwFilter ? '该关键词暂无命中新闻' : '没有未读新闻了，点「换一批」看看')+'</div>';
  if(state.kwFilter){
    document.getElementById('newsCount').textContent = '关键词「'+state.kwFilter+'」命中 '+list.length+' 条';
  }else{
    var unreadTotal = state.newsPool.filter(function(n){ return !isRead(n); }).length;
    document.getElementById('newsCount').textContent = '素材池 '+state.newsPool.length+' 条 · 未读 '+unreadTotal;
  }
  document.getElementById('newsUpdated').textContent = state.newsUpdatedAt ? ' · 更新于 '+state.newsUpdatedAt : '';
  var ub = document.getElementById('unreadBtn');
  if(ub) ub.classList.toggle('on', state.filterUnread);
  var kc = document.getElementById('kwChip');
  if(kc){
    kc.style.display = state.kwFilter ? '' : 'none';
    kc.textContent = '筛选：'+state.kwFilter+' ✕';
  }
}
function renderTodos(){
  var el = document.getElementById('todoList');

    return (a.done === b.done) ? (b.ts - a.ts) : (a.done ? 1 : -1);
  });
  el.innerHTML = list.map(function(t, i){
    return '<div class="todo-row'+(t.done?' done':'')+'" style="animation-delay:'+Math.min(i*0.04,0.3)+'s" data-todo="'+t.id+'">'+
      '<button class="todo-check" data-act="toggleTodo" data-id="'+t.id+'" title="切换完成">'+
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:'+(t.done?1:0)+';transition:opacity .2s"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'+
      '</button>'+
      '<span class="todo-text" data-act="toggleTodo" data-id="'+t.id+'" title="点击切换完成">'+esc(t.text)+'</span>'+
      '<button class="todo-del" data-act="delTodo" data-id="'+t.id+'" title="删除">'+
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>'+
      '</button>'+
    '</div>';
  }).join('') || '<div class="empty-tip">暂无待办，添加一条开始今天吧</div>';

  document.getElementById('todoCount').textContent = state.todos.length ? (pending+'/'+state.todos.length) : '';
  var tip = document.getElementById('floatTip');

    tip.style.display = '';
    document.getElementById('floatText').textContent = '还有 '+pending+' 个待办事项待处理';
  }else{
    tip.style.display = 'none';
  }
}

  {k:'AI Agent', re:/Agent|智能体/i},
  {k:'开源生态',  re:/开源|开放/i},
  {k:'端侧 AI',  re:/端侧|手机端|端到端/i}
];
function kwHits(filterRead){
  return TREND_KWS.map(function(kw){
    var c = state.newsPool.filter(function(n){
      if(filterRead && !isRead(n)) return false;
      return kw.re.test(n.t) || kw.re.test(n.s);
    }).length;
    return {k:kw.k, c:c};
  }).filter(function(x){ return x.c > 0; })
    .sort(function(a,b){ return b.c - a.c; });
}
function renderTrends(){
  var el = document.getElementById('trendList');
  var rows = kwHits(false).slice(0, 6);
  var max = Math.max.apply(null, rows.map(function(r){return r.c;}).concat([1]));
  el.innerHTML = rows.map(function(r, i){
    return '<div class="trend-row'+(state.kwFilter===r.k?' active':'')+'" data-act="filterKw" data-id="'+esc(r.k)+'" title="点击筛选相关新闻">'+
      '<span class="trend-rank">'+(i+1)+'</span>'+
      '<span class="trend-name">'+esc(r.k)+'</span>'+
      '<span class="trend-bar"><i style="width:'+(r.c/max*100)+'%;transition-delay:'+(i*0.08)+'s"></i></span>'+
      '<span class="trend-count">'+r.c+' 条</span>'+
    '</div>';
  }).join('') || '<div class="empty-tip">暂无热点数据</div>';
}
function renderStats(){
  var total = state.newsPool.length;
  var readCnt = state.newsPool.filter(isRead).length;
  var favCnt = state.newsPool.filter(isFav).length;
  document.getElementById('statRead').textContent = readCnt;
  document.getElementById('statUnread').textContent = Math.max(total - readCnt, 0);
  document.getElementById('statFav').textContent = favCnt;

  /* 近 7 天每日阅读量：手写 SVG 柱状图 */
  var days = [];
  for(var i=6; i>=0; i--){
    var d = new Date(Date.now() - i*86400000);
    days.push({
      label:(d.getMonth()+1)+'/'+d.getDate(),
      start:new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(),
      cnt:0
    });
  }
  Object.keys(state.newsMeta).forEach(function(k){
    var r = state.newsMeta[k].read;
    if(!r) return;
    for(var j=0; j<7; j++){
      if(r >= days[j].start && r < days[j].start + 86400000){ days[j].cnt++; break; }
    }
  });
  var maxC = Math.max.apply(null, days.map(function(d){return d.cnt;}).concat([1]));
  var W=280, H=112, bw=22, gap=(W-7*bw)/6, base=H-26;
  var s = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
          '<defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b82f6"/>'+
          '</linearGradient></defs>';
  days.forEach(function(d, i){
    var h = d.cnt ? Math.max(Math.round(d.cnt/maxC*(base-16)), 6) : 4;
    var x = i*(bw+gap), y = base-h;
    s += '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="5" fill="'+(d.cnt?'url(#barGrad)':'rgba(43,47,58,.08)')+'"/>';
    if(d.cnt) s += '<text x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="10" font-weight="600" fill="#8a90a0">'+d.cnt+'</text>';
    s += '<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#8a90a0">'+d.label+'</text>';
  });
  s += '</svg>';
  document.getElementById('weekChart').innerHTML = s;

  /* 关注领域偏好：按已读新闻归类 */
  var prefs = kwHits(true).slice(0, 5);
  var maxP = Math.max.apply(null, prefs.map(function(p){return p.c;}).concat([1]));
  var palette = ['#8b5cf6','#3b82f6','#0ea5a4','#f59e0b','#ec4899'];
  document.getElementById('prefChart').innerHTML = prefs.map(function(p, i){
    return '<div class="pref-row">'+
      '<span class="pref-name">'+esc(p.k)+'</span>'+
      '<span class="pref-bar"><i style="width:'+(p.c/maxP*100)+'%;background:'+palette[i%palette.length]+';transition-delay:'+(i*0.08)+'s"></i></span>'+
      '<span class="pref-val">'+p.c+'</span>'+
    '</div>';
  }).join('') || '<div style="font-size:12px;color:var(--text-2)">先去读几条新闻，这里会出现你的偏好画像</div>';
}

function applyBg(){
  var layer = document.getElementById('bgLayer');
  if(state.settings.bgImage){
    layer.style.backgroundImage = 'url("'+state.settings.bgImage+'")';
    layer.style.opacity = (state.settings.bgOpacity/100).toFixed(2);
  }else{
    layer.style.opacity = 0;
  }
}
function renderSync(saving){
  var pill = document.getElementById('syncPill');
  pill.className = 'sync-pill' + (saving ? ' saving' : '');
  document.getElementById('syncText').textContent = saving ? '保存中…' : '已同步';
}
var syncTimer = null;
function flashSync(){
  renderSync(true);
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ renderSync(false); }, 700);
}

/* 统一刷新入口：渲染函数之间绝不互调 */
function refreshAll(){
  renderToday();
  renderNews();
  renderTodos();
  renderLinks();
  renderFavs();
  renderTrends();
  renderStats();
  applyBg();
  renderSync(false);
}

/* ================= 表单本地缓存（DSDK 风格规范，防误刷新丢失） ================= */
function cacheKey(field){ return 'wb_ws_cache_' + field; }
function bindCache(input, field){
  if(!input) return;
  try{
    var saved = localStorage.getItem(cacheKey(field));
    if(saved && !input.value) input.value = saved;
  }catch(e){}
  var timer = null;
  input.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      try{ localStorage.setItem(cacheKey(field), input.value); }catch(e){}
    }, 300);
  });
}
function clearCache(field){
  try{ localStorage.removeItem(cacheKey(field)); }catch(e){}
}

/* ================= 事件（统一委托，改数据后 refreshAll） ================= */
document.addEventListener('click', function(e){
  // 点击新闻标题：页内打开阅读弹层并自动标记已读；Ctrl/⌘/Shift+点击保留新标签外开
  var nl = e.target.closest('a[data-news-link]');
  if(nl){
    if(e.ctrlKey || e.metaKey || e.shiftKey) return;  // 不拦截，走默认新标签
    e.preventDefault();
    openReader(nl.getAttribute('data-key'));
    return;
  }
  var el = e.target.closest('[data-act]');
  if(el){
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id') || el.getAttribute('data-key');
    if(act === 'toggleTodo'){
      state.todos.forEach(function(t){ if(t.id===id) t.done = !t.done; });
      save(); refreshAll(); return;
    }
    if(act === 'delTodo'){
      state.todos = state.todos.filter(function(t){return t.id!==id;});
      save(); refreshAll(); return;
    }
    if(act === 'delLink'){
      e.preventDefault(); e.stopPropagation();
      state.links = state.links.filter(function(l){return l.id!==id;});
      save(); refreshAll(); return;
    }
    if(act === 'toggleRead'){
      var m1 = state.newsMeta[id] || (state.newsMeta[id] = {});
      m1.read = m1.read ? 0 : Date.now();
      save(); refreshAll(); renderReaderIfOpen(); return;
    }
    if(act === 'toggleFav'){
      e.preventDefault(); e.stopPropagation();
      var m2 = state.newsMeta[id] || (state.newsMeta[id] = {});
      m2.fav = m2.fav ? 0 : Date.now();
      save(); refreshAll(); renderReaderIfOpen(); return;
    }
    if(act === 'toggleUnreadFilter'){
      state.filterUnread = !state.filterUnread;
      refreshAll(); return;
    }
    if(act === 'filterKw'){
      state.kwFilter = (state.kwFilter === id) ? '' : id;
      refreshAll(); return;
    }
    if(act === 'clearKwFilter'){
      state.kwFilter = '';
      refreshAll(); return;
    }
    if(act === 'statUnread'){
      state.filterUnread = !state.filterUnread;
      refreshAll(); return;
    }
    if(act === 'statRead'){
      state.kwFilter = '';
      state.filterUnread = false;
      refreshAll(); return;
    }
    if(act === 'statFav'){
      var favCard = document.getElementById('favList').closest('.card');
      favCard.scrollIntoView({behavior:'smooth', block:'center'});
      favCard.classList.add('flash');
      setTimeout(function(){ favCard.classList.remove('flash'); }, 1200);
      return;
    }
  }
  // 入口面板：点击标题展开/收起（桌面端另支持悬停展开）
  var btn = e.target.closest('.entry-btn');
  if(btn){
    var entry = btn.closest('.entry');
    var wasOpen = entry.classList.contains('open');
    document.querySelectorAll('.entry.open').forEach(function(x){ x.classList.remove('open'); });
    if(!wasOpen) entry.classList.add('open');
    return;
  }
  if(e.target.closest('#shuffleBtn')){ manualRotate(); refreshAll(); }
});

/* 悬停展开（仅精确指针设备） */
if(window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches){
  document.querySelectorAll('.entry').forEach(function(entry){
    entry.addEventListener('mouseenter', function(){
      document.querySelectorAll('.entry.open').forEach(function(x){ if(x!==entry) x.classList.remove('open'); });
      entry.classList.add('open');
    });
  });
}

/* 待办表单 */
document.getElementById('todoForm').addEventListener('submit', function(e){
  e.preventDefault();
  var inp = document.getElementById('todoInput');
  var v = inp.value.trim();
  if(!v) return;
  state.todos.unshift({id:uid(), text:v, done:false, ts:Date.now()});
  inp.value = '';
  clearCache('todoInput');
  save(); refreshAll();
});
bindCache(document.getElementById('todoInput'), 'todoInput');

/* 收藏表单（三个面板共用逻辑） */
document.querySelectorAll('.entry').forEach(function(entry){
  var cat = entry.getAttribute('data-cat');
  var form = entry.querySelector('.chip-form');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var name = form.querySelector('[name="title"]').value.trim();
    var url = form.querySelector('[name="link"]').value.trim();
    if(!name) return;
    if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
    state.links.unshift({id:uid(), cat:cat, name:name, url:url});
    form.querySelector('[name="title"]').value = '';
    form.querySelector('[name="link"]').value = '';
    clearCache('title'); clearCache('link');
    save(); refreshAll();
    entry.classList.add('open');
  });
  bindCache(form.querySelector('[name="title"]'), 'title');
  bindCache(form.querySelector('[name="link"]'), 'link');
});

/* ================= 背景设置 ================= */
var mask = document.getElementById('settingsMask');
document.getElementById('settingsBtn').addEventListener('click', function(){
  document.getElementById('bgUrlInput').value = state.settings.bgImage.indexOf('data:')===0 ? '' : state.settings.bgImage;
  document.getElementById('bgOpacityInput').value = state.settings.bgOpacity;
  document.getElementById('bgOpacityVal').textContent = state.settings.bgOpacity + '%';
  mask.classList.add('show');
});
document.getElementById('settingsCancel').addEventListener('click', function(){ mask.classList.remove('show'); });
mask.addEventListener('click', function(e){ if(e.target === mask) mask.classList.remove('show'); });
document.getElementById('bgOpacityInput').addEventListener('input', function(){
  document.getElementById('bgOpacityVal').textContent = this.value + '%';
});
document.getElementById('bgFileInput').addEventListener('change', function(){
  var file = this.files && this.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var w = Math.min(img.naturalWidth, 800);
      var h = Math.round(img.naturalHeight * w / img.naturalWidth);
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      document.getElementById('bgUrlInput').value = '(本地图片已就绪，点保存生效)';
      document.getElementById('bgUrlInput').dataset.pending = cv.toDataURL('image/jpeg', 0.82);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});
document.getElementById('bgClearBtn').addEventListener('click', function(){
  state.settings = {bgImage:'', bgOpacity:85};
  save(); refreshAll();
  mask.classList.remove('show');
});
document.getElementById('settingsSave').addEventListener('click', function(){
  var urlInput = document.getElementById('bgUrlInput');
  var bg = urlInput.dataset.pending || urlInput.value.trim();
  if(bg && urlInput.dataset.pending) delete urlInput.dataset.pending;
  state.settings.bgImage = bg;
  state.settings.bgOpacity = parseInt(document.getElementById('bgOpacityInput').value, 10) || 85;
  save(); refreshAll();
  mask.classList.remove('show');
});

/* ================= 页内阅读弹层 ================= */
function renderReaderIfOpen(){
  var mask = document.getElementById('readerMask');
  if(mask && mask.classList.contains('show')) renderReader(state.readerKey);
}
function renderReader(key){
  var n = null;
  state.newsPool.forEach(function(x){ if(x.t === key) n = x; });
  if(!n) return;
  var m = state.newsMeta[key] || {};
  var srcEl = document.getElementById('readerSrc');
  srcEl.textContent = n.src;
  srcEl.style.background = srcColor(n.src);
  document.getElementById('readerDate').textContent = n.d + (m.read ? ' · 已读' : ' · 未读');
  document.getElementById('readerTitle').textContent = n.t;
  document.getElementById('readerBody').innerHTML = n.b
    ? '<p>'+esc(n.b)+'</p>'
    : '<p>'+esc(n.s)+'</p><p class="reader-note">完整内容未收录，点击右下角按钮查看原文报道。</p>';
  var favBtn = document.getElementById('readerFavBtn');
  favBtn.setAttribute('data-key', key);
  favBtn.classList.toggle('on', !!m.fav);
  favBtn.textContent = m.fav ? '已收藏 · 点击移出' : '星标稍后读';
  document.getElementById('readerLinkBtn').href = newsHref(n);
  state.readerKey = key;
}
function openReader(key){
  var m = state.newsMeta[key] || (state.newsMeta[key] = {});
  if(!m.read){ m.read = Date.now(); save(); refreshAll(); }
  renderReader(key);
  document.getElementById('readerMask').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeReader(){
  document.getElementById('readerMask').classList.remove('show');
  document.body.style.overflow = '';
}
document.getElementById('readerClose').addEventListener('click', closeReader);
var readerMaskEl = document.getElementById('readerMask');
readerMaskEl.addEventListener('click', function(e){ if(e.target === readerMaskEl) closeReader(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeReader(); });

/* 老数据正文迁移：为存量新闻按标题补上内置正文 */
function mergeBodies(){
  var map = {};
  DEFAULT_POOL.forEach(function(n){ if(n.b) map[n.t] = n.b; });
  state.newsPool.forEach(function(n){ if(!n.b && map[n.t]) n.b = map[n.t]; });
}

/* ================= 初始化 ================= */
if(!load()) seed();
autoRotate();
mergeBodies();
refreshAll();

})();
</script>
