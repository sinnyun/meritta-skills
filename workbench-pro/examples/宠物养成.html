    '<button class="chip'+((!f.type||f.type==='all')?' on':'')+'" data-f="type:all">全部 <span class="num" style="opacity:.7">'+db.records.length+'</span></button>'+
    TYPE_KEYS.map(function(k){
      return '<button class="chip'+(f.type===k?' on':'')+'" data-f="type:'+k+'" style="'+(f.type===k?'':'color:'+T(k).tone)+'">'+ic(T(k).icon)+T(k).name+' <span class="num" style="opacity:.7">'+counts[k]+'</span></button>';
    }).join('')+'</div></div>';
  // 状态 + 日期
  const sts = [['all','全部状态'],['done','已完成'],['plan','计划中'],['watching','观察中']];
  const ranges = [['all','全部时间'],['week','本周'],['month','本月'],['7','近 7 天'],['30','近 30 天'],['90','近 90 天'],['custom','自定义']];
  s += '<div class="filter-row"><span class="lbl">状态</span><div class="filter-scroll">'+
    sts.map(function(x){ return '<button class="chip'+(f.status===x[0]?' on':'')+'" data-f="status:'+x[0]+'">'+x[1]+'</button>'; }).join('')+
    '</div><span class="lbl" style="margin-left:8px">时间</span><div class="filter-scroll">'+
    ranges.map(function(x){ return '<button class="chip'+(ui.rangeKey===x[0]?' on':'')+'" data-f="range:'+x[0]+'">'+x[1]+'</button>'; }).join('')+
    '</div></div>';
  if(ui.rangeKey==='custom'){
    s += '<div class="filter-row"><span class="lbl">起止</span>'+
      '<input class="input" type="date" id="fFrom" value="'+esc(f.from||shift(-29))+'" style="height:38px;width:auto;font-size:14px">'+
      '<span class="tiny">至</span>'+
      '<input class="input" type="date" id="fTo" value="'+esc(f.to||todayISO())+'" style="height:38px;width:auto;font-size:14px">'+
      '<button class="btn btn-sm btn-p" data-f="range:apply">应用</button></div>';
  }
  // 标签
  const tags = allTags();
  if(tags.length){
    s += '<div class="filter-row"><span class="lbl">标签</span><div class="filter-scroll">'+
      '<button class="chip'+((!f.tag||f.tag==='all')?' on':'')+'" data-f="tag:all">全部标签</button>'+
      tags.map(function(t){ return '<button class="chip'+(f.tag===t?' on':'')+'" data-f="tag:'+esc(t)+'">'+esc(t)+'</button>'; }).join('')+
      '</div></div>';
  }
  s += '</div>';
  return s;
}
function recordListBox(){
  const list = filterRecs(ui.filter);
  const shown = list.slice(0, ui.limit);
  const done = list.filter(function(r){ return r.status==='done'; }).length;
  let bar = '<div class="result-bar"><span class="cnt">共 <b>'+list.length+'</b> 条记录 · 已完成 '+done+' 条 · 待处理 '+(list.length-done)+' 条'+
    (ui.filter.q? ' · 关键字「'+esc(ui.filter.q)+'」':'')+'</span>'+
    '<div class="row" style="gap:8px">'+
      '<button class="btn btn-sm" data-f="reset">'+ic('refresh')+'清除筛选</button>'+
      '<span class="tiny">已显示 '+shown.length+'/'+list.length+'</span>'+
    '</div></div>';
  let body;
  if(!db.records.length){
    body = '<div class="card">'+emptyState('记录库还是空的','先从一次喂食或一次散步开始记录，豆丁的完整养护档案会在这里一点点长出来。',
      '<button class="btn btn-p" data-new="feeding">'+ic('plus')+'记录第一次喂食</button>'+
      '<button class="btn" data-new="walk">'+ic('walk')+'记录一次散步</button>')+'</div>';
  }else if(!list.length){
    body = '<div class="card">'+emptyState('没有符合条件的记录','当前筛选条件下一条都没找到，可以换个关键字，或直接把筛选清掉看看全部 '+db.records.length+' 条记录。',
      '<button class="btn btn-p" data-f="reset">'+ic('refresh')+'一键清除筛选</button>')+'</div>';
  }else if(ui.view==='card'){
    body = '<div class="card-list c3">'+shown.map(function(r,i){ return recCard(r, i%5===0?'sq':(i%7===3?'tall':'')); }).join('')+'</div>';
  }else if(ui.view==='board'){
    const cols = [['plan','计划中',C.info],['watching','观察中',C.warn],['done','已完成',C.ok]];
    body = '<div class="board">'+cols.map(function(c){
      const all = list.filter(function(r){ return r.status===c[0]; });
      const items = all.slice(0,20);
      return '<div class="board-col"><div class="board-head"><i class="dot" style="background:'+c[2]+'"></i>'+c[1]+
        '<span class="cnt">'+all.length+' 条</span></div>'+
        (items.length? items.map(function(r){
          const t = T(r.type);
          return '<div class="board-card" data-rec="'+r.id+'" tabindex="0" role="button">'+
            '<div class="bc-thumb">'+coverArt(r)+'</div>'+
            '<div class="bc-b"><div class="bt">'+esc(r.title)+'</div>'+
            '<div class="tiny">'+fmtCN(r.date)+' · '+esc(t.metricLabel)+' '+esc(t.metric(r))+'</div>'+
            '<div class="row" style="gap:5px">'+typeTag(r.type)+
            (c[0]!=='done'? '<button class="btn btn-xs" data-status="'+r.id+':done">'+ic('check')+'完成</button>'
              : '<button class="btn btn-xs" data-status="'+r.id+':plan">'+ic('clock')+'改计划</button>')+
            '</div></div></div>';
        }).join('') : '<div class="empty-mini">这一列暂时是空的</div>')+'</div>';
    }).join('')+'</div>';
  }else{
    body = '<div class="card"><div class="rec-list">'+shown.map(function(r){ return recRow(r); }).join('')+'</div></div>';
  }
  if(shown.length < list.length){
    body += '<div style="text-align:center;margin-top:14px"><button class="btn" data-more="1">'+ic('down')+'再显示 '+(Math.min(ui.limit,list.length-shown.length))+' 条（还有 '+(list.length-shown.length)+' 条）</button></div>';
  }
  return '<div id="recListBox"><div class="stack-s">'+bar+body+'</div></div>';
}

/* ---------- 日历 ---------- */
function renderCalendar(){
  const [y,m] = ui.calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const prevDays = new Date(y, m-1, 0).getDate();
  const cells = [];
  for(let i=startDow-1;i>=0;i--) cells.push({ d:new Date(y,m-2,prevDays-i), out:true });
  for(let i=1;i<=daysInMonth;i++) cells.push({ d:new Date(y,m-1,i), out:false });
  while(cells.length%7!==0 || cells.length<35) cells.push({ d:new Date(y,m, cells.length-startDow-daysInMonth+1), out:true });
  const byDate = {};
  db.records.forEach(function(r){ (byDate[r.date]=byDate[r.date]||[]).push(r); });
  const remByDate = {};
  reminders().forEach(function(x){ (remByDate[x.due]=remByDate[x.due]||[]).push(x); });

  let s = '<div class="page stack">';
  s += '<div class="row-b"><div class="seg">'+
      '<button data-cal-move="-1">'+ic('left')+'上月</button>'+
      '<button data-cal-move="0">回到今天</button>'+
      '<button data-cal-move="1">下月'+ic('right')+'</button></div>'+
    '<div class="row" style="gap:8px"><span class="tiny">'+ic('info')+' 有记录的日期显示圆点，逾期提醒显示红点</span>'+
    '<button class="btn btn-sm btn-p" data-new="walk">'+ic('plus')+'新增安排</button></div></div>';
  s += '<div class="cal-wrap"><section class="card">'+
    '<div class="cal-head"><span class="cal-month">'+y+' 年 '+(m)+' 月</span>'+
      '<div class="row" style="gap:14px">'+
        '<span class="row" style="gap:6px"><i style="width:8px;height:8px;border-radius:50%;background:'+C.green+'"></i><span class="tiny">已完成</span></span>'+
        '<span class="row" style="gap:6px"><i style="width:8px;height:8px;border-radius:50%;background:'+C.info+'"></i><span class="tiny">计划中</span></span>'+
        '<span class="row" style="gap:6px"><i style="width:8px;height:8px;border-radius:50%;background:'+C.warn+'"></i><span class="tiny">观察中</span></span>'+
        '<span class="row" style="gap:6px"><i style="width:8px;height:8px;border-radius:50%;background:'+C.red+'"></i><span class="tiny">逾期</span></span>'+
      '</div></div>'+
    '<div class="cal-dow">'+['日','一','二','三','四','五','六'].map(function(d){ return '<span>'+d+'</span>'; }).join('')+'</div>'+
    '<div class="cal-grid">';
  cells.forEach(function(c){
    const ds = toISO(c.d);
    const recs = byDate[ds]||[];
    const rems = remByDate[ds]||[];
    const overdue = rems.some(function(x){ return x.level==='overdue'; });
    const colors = [];
    recs.forEach(function(r){
      const col = r.status==='done'? C.green : r.status==='plan'? C.info : r.status==='watching'? C.warn : C.greenL;
      if(colors.indexOf(col)<0) colors.push(col);
    });
    if(rems.length) colors.push(C.apricotD);
    const first = recs[0];
    s += '<button class="cal-cell'+(c.out?' out':'')+(ds===todayISO()?' today':'')+(ds===ui.calSel?' sel':'')+'" data-cal-day="'+ds+'">'+
      '<span class="d">'+c.d.getDate()+'</span>'+
      (overdue? '<span class="ov" title="有逾期提醒"></span>':'')+
      (first? '<span class="tx">'+esc(first.title.slice(0,10))+'</span>':'')+
      '<span class="dots">'+colors.slice(0,5).map(function(x){ return '<i class="dts" style="background:'+x+'"></i>'; }).join('')+
        (recs.length>1? '<span class="more">+'+(recs.length-1)+'</span>':'')+'</span></button>';
  });
  s += '</div>'+chartSrc('养护记录库 · 日期字段与疫苗/驱虫/补货的下一次日期自动汇入')+'</section>';
  // 当日面板
  const dayRecs = sortRecs(byDate[ui.calSel]||[],'date','asc');
  const dayRems = remByDate[ui.calSel]||[];
  s += '<section class="day-panel stack-s"><div class="card">'+
    '<div class="cal-head"><div><div class="cal-month">'+fmtCN(ui.calSel)+' '+wk(ui.calSel)+'</div>'+
      '<div class="tiny">'+esc(relDay(ui.calSel))+' · 共 '+dayRecs.length+' 条记录'+(dayRems.length? ' · '+dayRems.length+' 条提醒':'')+'</div></div>'+
      '<button class="btn btn-sm btn-p" data-new="feeding" data-date="'+ui.calSel+'">'+ic('plus')+'新增</button></div>';
  if(dayRems.length){
    s += '<div style="padding:12px 15px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:7px">';
    dayRems.forEach(function(x){
      s += '<div class="row-w" style="gap:8px"><span class="pill '+(x.level==='overdue'?'overdue':x.level==='today'?'watching':'plan')+'"><i class="d"></i>'+
        (x.level==='overdue'?'逾期':x.level==='today'?'今天':'即将')+'</span>'+
        '<span style="font-size:13px">'+esc(x.title)+'</span>'+
        (x.ref? '<button class="btn btn-xs" data-rec="'+x.ref+'">'+ic('right')+'来源</button>':'')+'</div>';
    });
    s += '</div>';
  }
  s += '<div class="day-list">';
  if(!dayRecs.length) s += '<div class="empty-mini" style="padding:30px 18px">这一天还没有养护记录<br><button class="btn btn-sm btn-p" style="margin-top:10px" data-new="feeding" data-date="'+ui.calSel+'">'+ic('plus')+'补记一条</button></div>';
  else dayRecs.forEach(function(r){
    s += '<div class="day-item" data-rec="'+r.id+'"><div class="day-time">'+esc(r.time||'—')+'</div>'+
      '<div class="day-body"><div class="row-w" style="gap:7px">'+typeTag(r.type)+statusPill(r.status)+'</div>'+
      '<div style="font-size:13.5px;font-weight:600;line-height:1.45">'+esc(r.title)+'</div>'+
      '<div class="tiny">'+esc(T(r.type).metricLabel)+'：'+esc(T(r.type).metric(r))+(r.media&&r.media.length?' · '+r.media.length+' 张照片':'')+'</div>'+
      '</div></div>';
  });
  s += '</div></div>';
  s += '<div class="card"><div class="card-head"><span class="ttl">'+ic('bell')+'规则提醒</span><span class="tiny">按记录里的「下一次日期」自动推算</span></div>'+
    '<div class="rec-list">'+reminders().slice(0,6).map(function(x){
      return '<div class="day-item"'+(x.ref?' data-rec="'+x.ref+'"':'')+'><div class="day-time">'+fmtCN(x.due).replace('月','/').replace('日','')+'</div>'+

/* ---------- 数据洞察 ---------- */
function renderTrends(){
  const R0 = trendRange();
  const from = R0.from, to = R0.to, label = R0.label;
  const rk = ui.trendRange;
  const R = rangeStats(from,to);
  const st = stats();
  const segs = TYPE_KEYS.filter(function(k){ return R.byType[k]>0; })
    .map(function(k,i){ return { label:T(k).name, value:R.byType[k], color:T(k).tone }; });
  // 每日完成趋势
  const days = [];
  const n = Math.min(30, Math.max(1, dayDiff(to,from)+1));
  for(let i=n-1;i>=0;i--){
    const d0 = toISO(new Date(parseD(to).getTime() - i*86400000));
    if(d0<from) continue;
    const dayList = db.records.filter(function(r){ return r.date===d0; });
    days.push({ label:(parseD(d0).getMonth()+1)+'/'+parseD(d0).getDate(),
      value:dayList.length, done:dayList.filter(function(r){ return r.status==='done'; }).length });
  }
  const wChart = st.weights.map(function(w){ return { label:fmtCN(w.date), value:w.w }; });

  let s = '<div class="page stack">';
  s += '<div class="toolbar"><div class="tr"><span class="lbl" style="min-width:auto">时间范围</span>'+
    '<div class="seg">'+[['week','本周'],['month','本月'],['7d','近 7 天'],['30d','近 30 天'],['90d','近 90 天'],['custom','自定义']].map(function(x){
      return '<button class="'+(rk===x[0]?'on':'')+'" data-range="'+x[0]+'">'+x[1]+'</button>'; }).join('')+'</div>'+
    (rk==='custom'? '<input class="input" type="date" id="tFrom" value="'+esc(ui.customFrom)+'" style="height:38px;width:auto;font-size:14px"><span class="tiny">至</span><input class="input" type="date" id="tTo" value="'+esc(ui.customTo)+'" style="height:38px;width:auto;font-size:14px"><button class="btn btn-sm btn-p" data-range="apply">应用</button>':'')+
    '<div class="spacer"></div><button class="btn btn-sm" data-report="1">'+ic('file')+'生成本期报告</button></div></div>';
  s += '<div class="stat-cap">'+
    '<div class="sc"><div class="k">记录总数</div><div class="v">'+R.total+'<small>条</small></div></div>'+
    '<div class="sc"><div class="k">完成率</div><div class="v">'+R.rate+'<small>%</small></div></div>'+
    '<div class="sc"><div class="k">散步里程</div><div class="v">'+R.dist+'<small>km</small></div></div>'+
    '<div class="sc"><div class="k">散步时长</div><div class="v">'+R.dur+'<small>分钟</small></div></div>'+
    '</div>';
  s += '<div class="cols"><div class="stack">';
  s += '<section class="card"><div class="card-head"><span class="ttl">'+ic('trends')+'每日完成趋势</span>'+
    '<span class="tiny">'+label+' · 浅色为当日未完成</span></div>'+
    '<div class="chart-box">'+chartColumns(days,{w:Math.max(420, days.length*26), h:200})+'</div>'+
    chartSrc('养护记录库 · 按记录日期与状态字段聚合（'+label+'，共 '+R.total+' 条）')+'</section>';
  s += '<section class="card"><div class="card-head"><span class="ttl">'+ic('scale')+'体重变化</span>'+
    '<span class="tiny">'+wChart.length+' 个体重数据点</span></div>'+
    '<div class="chart-box">'+chartLine(wChart,{w:700,h:230})+'</div>'+
    (R.wMin!=null? '<div class="legend"><span class="lg"><i class="sw" style="background:'+C.green+'"></i>区间 '+R.wMin+' – '+R.wMax+'kg</span>'+
      '<span class="lg"><i class="sw" style="background:'+C.coffee+'"></i>最新 '+R.wLast+'kg</span>'+
      '<span class="lg">参考区间 10–13kg（柯基成犬）</span></div>':'')+
    chartSrc('健康记录中填写了「体重」字段的条目（'+wChart.length+' 条）')+'</section>';
  s += '<section class="card"><div class="card-head"><span class="ttl">'+ic('walk')+'每周散步里程</span></div>'+
    '<div class="chart-box">'+chartColumns(st.weeks.map(function(w){ return { label:(parseD(w.to).getMonth()+1)+'/'+parseD(w.to).getDate(), value:w.dist }; }),{w:700,h:190,color:C.greenM})+'</div>'+
    chartSrc('散步记录的里程字段，按周汇总（共 '+st.weeks.length+' 周）')+'</section>';
  s += '</div><div class="stack">';
  s += '<section class="card"><div class="card-head"><span class="ttl">'+ic('grid')+'记录分类占比</span></div>'+
    '<div class="chart-box" style="display:flex;justify-content:center">'+chartDonut(segs,190)+'</div>'+
    '<div class="legend">'+segs.map(function(g){
      return '<span class="lg"><i class="sw" style="background:'+g.color+'"></i>'+esc(g.label)+' '+g.value+' 条 · '+(R.total?Math.round(g.value/R.total*100):0)+'%</span>';
    }).join('')+'</div>'+
    chartSrc(''+label+'内全部 '+R.total+' 条记录按模块分类')+'</section>';
  s += '<section class="card"><div class="card-head"><span class="ttl">'+ic('info')+'可以解释的建议</span><span class="tiny">每条都能追溯到记录</span></div>'+
    '<div style="padding:15px 18px;display:flex;flex-direction:column;gap:11px">';
  const adv = advices();
  if(!adv.length) s += '<div class="empty-mini">当前数据还不足以给出建议，再多记几条就会出现。</div>';
  adv.slice(0,5).forEach(function(a){
    s += '<div class="advice'+(a.level==='warn'?' warn':'')+'">'+ic(a.level==='warn'?'alert':'check')+
      '<div class="tx">'+a.text+(a.ref? ' <button class="btn btn-xs" style="margin-left:4px" data-rec="'+a.ref+'">'+ic('right')+'查看来源</button>':'')+'</div></div>';
  });
  s += '</div>'+chartSrc('由逾期提醒、体重序列、周里程与饮水记录自动推导')+'</section>';
  s += '<section class="card"><div class="card-head"><span class="ttl">'+ic('paw')+'模块分布明细</span></div><div style="padding:15px 18px">'+
    chartBars(TYPE_KEYS.map(function(k){
      return { label:T(k).name, value:R.byType[k]||0, text:(R.byType[k]||0)+' 条', color:T(k).tone };
    }))+'</div>'+chartSrc(''+label+'内 9 个养护模块的记录条数')+'</section>';
  s += '</div></div></div>';
  document.getElementById('view').innerHTML = s;
}

function startWizard(type, opts){
  const o = opts||{};
  if(o.editId){ const r = byId(o.editId); if(!r) return; ui.draft = draftFrom(r); }
  else ui.draft = newDraft(type, o.date);
  ui.step = (o.editId || type) ? 2 : 1;
  ui.page = 'wizard';
  go(o.editId? '#/edit/'+o.editId : (type? '#/new/'+type : '#/new'));
}
function wizardSteps(){
  const names = ['选类型','填字段','照片与确认'];
  const cur = ui.step;
  return '<div class="steps">'+names.map(function(n,i){
    const cls = cur===i+1? 'on' : (cur>i+1? 'did':'');
    return '<button class="step '+cls+'" data-step="'+(i+1)+'"><span class="n">'+(cur>i+1? ic('check','',('width:14px;height:14px')) : (i+1))+'</span><span class="lbl">'+n+'</span></button>'+
      (i<2? '<span class="ln"></span>':'');
  }).join('')+'</div>';
}
function fieldControl(def, val, forceId){
  const id = forceId || ('w_'+def.k);
  if(def.t==='select'){
    return '<div class="field'+(def.span2?' span2':'')+'"><label for="'+id+'">'+esc(def.l)+'</label>'+
      '<select class="select" id="'+id+'" data-wfield="'+def.k+'">'+
      '<option value="">请选择</option>'+
      (def.opts||[]).map(function(o){ return '<option value="'+esc(o)+'"'+(String(val)===String(o)?' selected':'')+'>'+esc(o)+'</option>'; }).join('')+
      '</select></div>';
  }
  if(def.t==='textarea'){
    return '<div class="field'+(def.span2?' span2':'')+'"><label for="'+id+'">'+esc(def.l)+'</label>'+
      '<textarea class="textarea" id="'+id+'" data-wfield="'+def.k+'" placeholder="'+esc(def.ph||'')+'">'+esc(val||'')+'</textarea></div>';
  }
  const type = def.t==='number' ? 'number' : (def.t==='date' ? 'date' : 'text');
  const extra = def.t==='number' ? ' inputmode="decimal" step="any"' : '';
  return '<div class="field'+(def.span2?' span2':'')+'"><label for="'+id+'">'+esc(def.l)+'</label>'+
    '<input class="input" id="'+id+'" type="'+type+'"'+extra+' data-wfield="'+def.k+'" placeholder="'+esc(def.ph||'')+'" value="'+esc(val==null?'':val)+'"></div>';
}
function renderWizard(){
  const d = ui.draft;
  if(!d){ ui.page='today'; renderToday(); return; }
  let s = '<div class="page stack">';
  s += '<div class="row-w"><button class="btn btn-sm" data-wizard-cancel="1">'+ic('left')+'放弃并返回</button>'+
    '<div class="spacer"></div><span class="tiny">'+(d.editId? '正在编辑：'+esc((byId(d.editId)||{}).title||'') : '新增一条养护记录')+'</span></div>';
  s += '<div class="card" style="overflow:hidden">'+wizardSteps()+'<div style="padding:20px">';
  if(ui.step===1){
    s += '<div class="stack">'+
      '<div><div class="h2">第 1 步 · 这条记录属于哪一类？</div>'+
      '<div class="body" style="margin-top:4px">选好类型后，表单只会显示这一类真正用得到的字段，不会一次堆出几十个输入框。</div></div>'+
      '<div class="type-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">';
    TYPE_KEYS.forEach(function(k){
      const t = TYPES[k];
      s += '<button class="type-opt'+(d.type===k?' on':'')+'" data-step-type="'+k+'">'+
        '<span class="si" style="color:'+t.tone+'">'+ic(t.icon,'',('width:30px;height:30px'))+'</span>'+
        '<span class="tn">'+t.name+'</span><span class="td">'+t.desc+'</span>'+
        '<span class="tiny" style="color:'+t.tone+'">已记录 '+recsOfType(k).length+' 条</span></button>';
    });
    s += '</div></div>';
  }
  else if(ui.step===2){
    const t = T(d.type);
    s += '<div class="stack">'+
      '<div class="row" style="gap:10px"><span style="color:'+t.tone+'">'+ic(t.icon,'',('width:34px;height:34px'))+'</span>'+
      '<div><div class="h2">第 2 步 · 填写'+t.name+'的核心字段</div>'+
      '<div class="body">带 * 的是关键字段，其余可以之后再补。</div></div></div>';
    s += '<div class="fold"><div class="fold-h" data-fold="1"><span class="tt">'+ic('file')+'基础信息</span>'+ic('down','chev'+(ui.fold1?'':' open'))+'</div>'+
      '<div class="fold-b" id="fold1" style="'+(ui.fold1?'':'display:none')+'">'+
      '<div class="field span2"><label for="w_title">记录标题 <span style="color:'+C.red+'">*</span></label>'+
        '<input class="input" id="w_title" data-wfield="__title" placeholder="'+esc(t.titlePh)+'" value="'+esc(d.title)+'"></div>'+
      '<div class="field"><label for="w_date">日期 <span style="color:'+C.red+'">*</span></label><input class="input" id="w_date" type="date" data-wfield="__date" value="'+esc(d.date)+'"></div>'+
      '<div class="field"><label for="w_time">时间</label><input class="input" id="w_time" type="time" data-wfield="__time" value="'+esc(d.time||'')+'"></div>'+
      '<div class="field span2"><label>状态</label><div class="seg" id="wStatus">'+
        [['done','已完成'],['plan','计划中'],['watching','观察中']].map(function(x){
          return '<button class="'+(d.status===x[0]?'on':'')+'" data-wstatus="'+x[0]+'">'+x[1]+'</button>'; }).join('')+
        '</div></div>'+
      '<div class="field span2"><label>标签（可多选，点一下切换）</label><div class="row-w" style="gap:6px">'+
        (t.tags.concat(db.customCats||[])).map(function(tg){
          return '<button class="chip'+(d.tags.indexOf(tg)>=0?' on':'')+'" data-wtag="'+esc(tg)+'">'+
            (d.tags.indexOf(tg)>=0? ic('check'):'')+esc(tg)+'</button>'; }).join('')+
        '</div><div class="tiny" style="margin-top:5px">找不到合适的标签？可以到「我的 · 标签与分类」里新增，保存后这里会立即出现。</div></div>'+
      '</div></div>';
    s += '<div class="fold"><div class="fold-h" data-fold="2"><span class="tt">'+ic(t.icon)+t.name+'专属字段</span>'+ic('down','chev'+(ui.fold2?'':' open'))+'</div>'+

      t.fields.map(function(f){ return fieldControl(f, d.fields[f.k]); }).join('')+'</div></div>';
    s += '<div class="fold"><div class="fold-h" data-fold="3"><span class="tt">'+ic('edit')+'补充说明</span>'+ic('down','chev'+(ui.fold3?'':' open'))+'</div>'+
      '<div class="fold-b" id="fold3" style="'+(ui.fold3?'':'display:none')+'">'+

    s += '<div class="row-w" style="justify-content:space-between">'+
      '<button class="btn" data-step="1">'+ic('left')+'上一步</button>'+
      '<div class="row" style="gap:9px"><button class="btn" data-wizard-quick="1">'+ic('check')+'直接保存</button>'+
      '<button class="btn btn-p" data-step="3">下一步 · 上传照片'+ic('right')+'</button></div></div>';

  else {

      ['vaccineBook','疫苗本'],['medicine','药品'],['groom','美容'],['pet','豆丁肖像'],['album','相册'],['toy','玩具'],['supply','用品']];
    s += '<div class="stack">'+
      '<div><div class="h2">第 3 步 · 上传照片并确认</div>'+

    s += '<div class="upload-zone" id="uploadZone"><span class="ico">'+ic('upload','',('width:30px;height:30px;color:'+C.greenM))+''+'</span>'+
      '<div class="h3">点击或把照片拖到这里上传</div>'+
      '<div class="tiny">支持 JPG / PNG / WebP，单张最大 8MB，最多 9 张；也可以选择下方内置的场景插画作为封面</div>'+
      '<div class="pbar hidden" id="upBar" style="max-width:240px"><i></i></div>'+
      '<input type="file" id="mediaFile" accept="image/*" multiple class="hidden"></div>';
    if(d.media.length){
      s += '<div><div class="cap" style="margin-bottom:7px">已上传 '+d.media.length+' 张</div><div class="thumbs">'+
        d.media.map(function(m,i){
          return '<div class="thumb"><img src="'+m.data+'" alt="'+esc(m.name)+'">'+
            '<button class="rm" data-media-del="'+i+'" title="移除">'+ic('close')+'</button></div>'; }).join('')+'</div></div>';
    }
    if(d.upErr) s += '<div class="advice warn">'+ic('alert')+'<div class="tx">'+esc(d.upErr)+' <button class="btn btn-xs" data-retry-upload="1">'+ic('refresh')+'重新选择</button></div></div>';
    s += '<div class="fold"><div class="fold-h" data-fold="4"><span class="tt">'+ic('image')+'选择内置场景插画作为封面</span>'+ic('down','chev'+(ui.fold4?'':' open'))+'</div>'+
      '<div class="fold-b" id="fold4" style="grid-template-columns:repeat(auto-fill,minmax(96px,1fr));'+(ui.fold4?'':'display:none')+'">'+
      artKeys.map(function(a){
        return '<button class="thumb" data-cover-set="'+a[0]+'" title="'+a[1]+'" style="aspect-ratio:4/3;border-width:'+(d.cover===a[0]?2:1)+'px;border-color:'+(d.cover===a[0]?C.green:C.line)+'">'+ART[a[0]]()+'</button>';
      }).join('')+'</div></div>';
    s += '<div class="fold"><div class="fold-h" data-fold="5"><span class="tt">'+ic('file')+'附件 / 凭证 / 录音</span>'+ic('down','chev'+(ui.fold5?'':' open'))+'</div>'+
      '<div class="fold-b" id="fold5" style="'+(ui.fold5?'':'display:none')+'">'+
      '<div class="span2 row-w" style="gap:9px"><label class="btn" style="cursor:pointer">'+ic('file')+'选择文件 / 录音<input type="file" id="attFile" class="hidden"></label>'+
      '<span class="tiny">疫苗本照片、化验单、医嘱录音都可以放这里；小于 300KB 会一并存进本地</span></div>'+
      (d.attachments.length? '<div class="span2"><div class="cap" style="margin-bottom:6px">已添加 '+d.attachments.length+' 个附件</div>'+
        d.attachments.map(function(a,i){
          return '<div class="row-b" style="padding:8px 0;border-bottom:1px dashed var(--line)"><span class="row" style="gap:8px">'+ic('file')+

            '<button class="btn btn-sm btn-d" data-att-del="'+i+'">'+ic('trash')+'移除</button></div>';

    const shownFields = Object.keys(d.fields).filter(function(k){ return d.fields[k]!==''&&d.fields[k]!=null; });
    s += '<div class="card card-milk" style="border-radius:16px"><div class="card-head" style="border-bottom:1px solid var(--line)">'+
      '<span class="ttl">'+ic('check')+'确认一下</span><span class="tiny">保存后列表、日历、统计与相册会同时更新</span></div>'+
      '<div style="padding:16px" class="stack-s">'+
        '<div class="row-w">'+typeTag(d.type)+statusPill(d.status)+
          '<span class="chip sm">'+ic('calendar')+fmtFull(d.date)+' '+esc(d.time||'')+'</span>'+

        '<div class="h2">'+esc(d.title || (t.titlePh.replace('例：','')))+'</div>'+
        (shownFields.length? '<div class="kv-grid">'+shownFields.map(function(k){

          return '<div class="kv-i"><span class="k">'+esc(def.l)+'</span><span class="v">'+esc(d.fields[k])+'</span></div>';

        (d.note? '<div class="tiny">备注：'+esc(d.note)+'</div>':'')+
        '<div class="tiny">封面：'+(d.media.length? '你上传的第 1 张照片' : (d.cover? '内置场景插画' : t.name+'场景插画（默认）'))+

      '</div></div>';
    s += '<div class="row-w" style="justify-content:space-between">'+
      '<button class="btn" data-step="2">'+ic('left')+'上一步</button>'+
      '<button class="btn btn-p btn-lg" data-wizard-save="1">'+ic('check')+(d.editId? '保存修改' : '保存这条记录')+'</button></div>';
    s += '</div>';
  }
  s += '</div></div></div>';
  document.getElementById('view').innerHTML = s;
  bindUpload();
}

/* ---------- 阶段报告 ---------- */
function renderReport(){
  const from = ui.reportFrom || shift(-29);
  const to = ui.reportTo || todayISO();
  const R = rangeStats(from,to);
  const list = sortRecs(R.list,'date','desc');
  const highlights = list.filter(function(r){ return ['grooming','walk','health','photo'].indexOf(r.type)>=0; }).slice(0,3);
  const seps = TYPE_KEYS.filter(function(k){ return R.byType[k]>0; }).map(function(k){ return { label:T(k).name, value:R.byType[k], color:T(k).tone }; });
  const concern = reminders().slice(0,3);
  const wPoints = R.list.filter(function(r){ return r.type==='health' && r.fields.weight; })
    .map(function(r){ return { label:fmtCN(r.date), value:+r.fields.weight, d:r.date }; })
    .sort(function(a,b){ return a.d<b.d? -1 : a.d>b.d? 1 : 0; });
  let s = '<div class="page stack">';
  s += '<div class="toolbar"><div class="tr"><span class="lbl" style="min-width:auto">报告范围</span>'+
    '<input class="input" type="date" id="rFrom" value="'+esc(from)+'" style="height:38px;width:auto;font-size:14px">'+
    '<span class="tiny">至</span>'+
    '<input class="input" type="date" id="rTo" value="'+esc(to)+'" style="height:38px;width:auto;font-size:14px">'+
    '<button class="btn btn-sm btn-p" data-report-gen="1">'+ic('refresh')+'生成报告</button>'+
    '<div class="spacer"></div>'+
    '<button class="btn btn-sm" data-export="report">'+ic('download')+'导出为文本</button>'+
    '<button class="btn btn-sm" data-print="1">'+ic('file')+'打印 / 存为 PDF</button></div></div>';
  s += '<section class="card" style="padding:26px">'+
    '<div class="row-b" style="align-items:flex-start;flex-wrap:wrap;gap:16px">'+
      '<div><div class="hero-eyebrow"><i class="ln"></i>阶段报告</div>'+
      '<h1 class="h1" style="font-size:24px;margin-top:8px">'+esc(db.profile.name)+'的养护阶段报告</h1>'+
      '<div class="cap">'+fmtFull(from)+' — '+fmtFull(to)+' · 共 '+R.total+' 条记录 · 生成于 '+fmtFull(todayISO())+'</div></div>'+
      '<div style="width:110px;height:110px;flex:none">'+brandMark(110)+'</div>'+
    '</div>'+
    '<div class="bone-div" style="margin:18px 0"><span class="ln"></span>'+ic('paw','',('width:18px;height:18px'))+'<span class="ln"></span></div>'+
    '<div class="stat-cap" style="margin-bottom:18px">'+
      '<div class="sc"><div class="k">记录总数</div><div class="v">'+R.total+'<small>条</small></div></div>'+
      '<div class="sc"><div class="k">完成率</div><div class="v">'+R.rate+'<small>%</small></div></div>'+
      '<div class="sc"><div class="k">散步里程</div><div class="v">'+R.dist+'<small>km</small></div></div>'+
      '<div class="sc"><div class="k">散步时长</div><div class="v">'+R.dur+'<small>分钟</small></div></div>'+
    '</div>'+
    '<div class="cols" style="gap:22px"><div class="stack">'+
      '<div><div class="h2" style="margin-bottom:8px">一、这段时间都做了什么</div>'+
      '<p class="body">本阶段共记录 <b>'+R.total+'</b> 条养护事项，其中已完成 <b>'+R.done+'</b> 条，完成率 <b>'+R.rate+'%</b>。'+
      '散步 '+ (R.byType.walk||0) +' 次、累计 '+R.dist+' 公里；喂食记录 '+(R.byType.feeding||0)+' 次；'+
      '健康观察 '+(R.byType.health||0)+' 次；'+(R.byType.vaccine||0)+' 次疫苗与 '+(R.byType.deworm||0)+' 次驱虫登记；'+
      '照片 '+(R.byType.photo||0)+' 张进入相册。</p></div>'+
      '<div><div class="h2" style="margin-bottom:10px">二、模块分布</div>'+chartBars(seps.map(function(g){
        return { label:g.label, value:g.value, text:g.value+' 条', color:g.color }; }))+
        chartSrc('统计范围 '+fmtCN(from)+' 至 '+fmtCN(to)+' 的 '+R.total+' 条记录')+'</div>'+
      '<div><div class="h2" style="margin-bottom:8px">三、高光记录</div>';
  if(!highlights.length) s += '<div class="tiny">这一阶段还没有可列举的高光记录。</div>';
  else s += '<div class="rec-list">'+highlights.map(function(r){
      return '<div class="rec" data-rec="'+r.id+'"><div class="rec-thumb">'+coverArt(r)+'</div>'+
        '<div class="rec-main"><div class="rec-title">'+esc(r.title)+'</div>'+
        '<div class="rec-meta"><span class="kv">'+ic('calendar')+fmtCN(r.date)+'</span>'+
        '<span class="kv">'+ic(T(r.type).icon)+esc(T(r.type).metricLabel)+' <b>'+esc(T(r.type).metric(r))+'</b></span></div></div>'+
        '<div class="rec-right">'+typeTag(r.type)+'</div></div>';
    }).join('')+'</div>';
  s += '</div><div><div class="h2" style="margin-bottom:8px">四、需要留意</div>';
  if(!concern.length) s += '<div class="advice">'+ic('check')+'<div class="tx">这段时间没有逾期或待处理事项，疫苗、驱虫与用品补货都在计划之内。</div></div>';
  else s += '<div style="display:flex;flex-direction:column;gap:9px">'+concern.map(function(x){
      return '<div class="advice warn">'+ic('alert')+'<div class="tx"><b>'+esc(x.title)+'</b> · '+
        (x.days<0? '已逾期 '+Math.abs(x.days)+' 天' : x.days===0?'今天到期':x.days+' 天后到期')+
        '（应做日期 '+fmtCN(x.due)+'）'+(x.ref? ' <button class="btn btn-xs" data-rec="'+x.ref+'">'+ic('right')+'来源</button>':'')+'</div></div>';
    }).join('')+'</div>';
  s += '</div></div><div class="stack">'+
      '<div><div class="h2" style="margin-bottom:8px">五、体重与趋势</div>'+
      (wPoints.length? chartLine(wPoints,{w:420,h:200}) : '<div class="tiny">这段时间没有体重数据。</div>')+
      (R.wMin!=null? '<div class="tiny" style="margin-top:8px">区间 '+R.wMin+' – '+R.wMax+' kg，最新 '+R.wLast+' kg（柯基成犬参考 10–13kg）</div>':'')+
      chartSrc('健康记录中填写了「体重」字段的 '+wPoints.length+' 条记录')+'</div>'+
      '<div><div class="h2" style="margin-bottom:8px">六、下阶段建议</div>'+
      '<div style="display:flex;flex-direction:column;gap:10px">'+
      advices().slice(0,4).map(function(a){
        return '<div class="advice'+(a.level==='warn'?' warn':'')+'">'+ic(a.level==='warn'?'alert':'check')+'<div class="tx">'+a.text+'</div></div>'; }).join('')+
      '</div></div>'+
      '<div class="card card-milk" style="padding:16px"><div class="tiny" style="line-height:1.75">'+
        '报告人：'+esc(db.profile.owner)+'<br>宠物：'+esc(db.profile.name)+'（'+esc(db.profile.breed)+'，'+esc(db.profile.birthday)+' 出生）<br>'+
        '定点医院：'+esc(db.profile.hospital)+'<br>数据来源：本工作台养护记录库，共 '+db.records.length+' 条记录</div></div>'+
      '</div></div></section></div>';
  document.getElementById('view').innerHTML = s;
}

/* ---------- 弹层：大图 / 确认 / 提醒 / 档案编辑 / 快捷键 ---------- */
function closeLayer(){ document.getElementById('layer').innerHTML=''; }
function renderLayer(html){ document.getElementById('layer').innerHTML = html; }
function openLightbox(recId, mi){
  const r = byId(recId);
  if(!r) return;
  const m = (mi!=null && r.media && r.media[mi]) ? r.media[mi] : null;
  /* 大图查看：插画改用 meet 完整显示，绝不裁切（缩略图仍用 coverArt 的 slice 填满卡片） */
  const big = m ? '<img src="'+m.data+'" alt="'+esc(m.name||r.title)+'">'
                : coverArt(r).replace('preserveAspectRatio="xMidYMid slice"','preserveAspectRatio="xMidYMid meet"');
  const t = T(r.type);
  renderLayer('<div class="lightbox" data-layer-close="1"><div class="lb-inner" data-stop="1">'+
    '<div class="lb-media">'+big+'</div>'+

/* ---------- 数据导出 / 导入 ---------- */
function download(name, text, mime){
  try{
    const blob = new Blob([text], {type:(mime||'text/plain')+';charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 500);
    return true;
  }catch(e){ toast('err','导出失败','当前浏览器不允许直接下载文件，请改用「打印 / 存为 PDF」'); return false; }
}
function statusPillText(st){ return (STATUS[st]||STATUS.done).t; }
function exportCSV(){
  const head = ['记录编号','模块','标题','日期','时间','状态','标签','关键数值','体重(kg)','时长(分钟)','里程(km)','花费(¥)','地点','备注'];
  const rows = db.records.map(function(r){
    const f = r.fields||{};
    return [r.id, T(r.type).name, r.title, r.date, r.time||'', statusPillText(r.status), (r.tags||[]).join('/'),
      T(r.type).metric(r), f.weight||'', f.duration||'', f.distance||'', f.cost||'', f.place||f.shop||f.hospital||'', (r.note||'').replace(/[\r\n,]/g,' ')];
  });
  const csv = '\ufeff'+[head].concat(rows).map(function(row){
    return row.map(function(c){ const s=String(c==null?'':c); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',');
  }).join('\r\n');
  download('宠物养成-养护记录-'+todayISO()+'.csv', csv, 'text/csv');
  toast('ok','已导出 CSV','共 '+db.records.length+' 条记录，可用 Excel 或表格工具打开');

  reader.readAsText(file);

/* ---------- 上传：压缩 + 进度 + 失败重试 ---------- */
function compressImage(file, onProgress, cb){
  if(!/^image\//.test(file.type)) return cb(new Error('「'+file.name+'」不是图片文件'));
  if(file.size > 8*1024*1024) return cb(new Error('「'+file.name+'」超过 8MB，请先压缩后再上传'));
  const reader = new FileReader();
  reader.onprogress = function(e){ if(e.lengthComputable) onProgress(e.loaded/e.total*0.6); };
  reader.onerror = function(){ cb(new Error('「'+file.name+'」读取失败，请重试')); };
  reader.onload = function(){
    const img = new Image();
    img.onload = function(){
      const maxW = 800;
      let w = img.naturalWidth, h = img.naturalHeight;
      if(w>maxW){ h = Math.round(h*maxW/w); w = maxW; }
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      onProgress(1);
      cb(null, { data: cv.toDataURL('image/jpeg',0.78), name:file.name, size:file.size, w:w, h:h });
    };
    img.onerror = function(){ cb(new Error('「'+file.name+'」不是有效的图片，请换一张')); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function handleMediaFiles(files){
  const d = ui.draft;
  d.upErr = null;
  const arr = Array.prototype.slice.call(files);
  const room = 9 - d.media.length;
  const use = arr.slice(0, Math.max(0,room));
  if(arr.length>room) d.upErr = '最多 9 张，已忽略多出的 '+(arr.length-room)+' 张。';
  if(!use.length){ renderWizard(); return; }
  const bar = document.getElementById('upBar');
  if(bar) bar.classList.remove('hidden');
  let i = 0;
  const next = function(){
    if(i>=use.length){
      saveDB(); renderWizard();
      toast('ok','照片已处理好', use.length+' 张照片已压缩到 800px 宽并存入这条记录');
      return;
    }
    const f = use[i++];
    compressImage(f, function(p){
      const inner = bar && bar.firstChild;
      if(inner) inner.style.width = Math.round(((i-1+p)/use.length)*100)+'%';
    }, function(err, res){
      if(err){
        d.upErr = err.message;
        saveDB(); renderWizard();
        toast('err','上传失败', err.message);
        return;
      }
      d.media.push(res);
      next();
    });
  };
  next();
}
function handleAttachFile(file){
  const d = ui.draft;
  const add = function(dataUrl, note){
    d.attachments.push({ name:file.name, size:file.size, type:file.type||'未知类型', data:dataUrl||null });
    saveDB(); renderWizard(); toast('ok','附件已添加', file.name);
    if(note) toast('warn','附件较大','已只记录文件名与大小，未把内容存进本地存储');
  };
  if(file.size <= 300*1024){
    const r = new FileReader();
    r.onload = function(){ add(r.result); };
    r.onerror = function(){ add(null,true); };
    r.readAsDataURL(file);
  }else add(null, true);
}
function bindUpload(){
  const zone = document.getElementById('uploadZone');
  const input = document.getElementById('mediaFile');
  if(zone && input){
    zone.addEventListener('click', function(){ input.click(); });
    zone.addEventListener('dragover', function(e){ e.preventDefault(); zone.classList.add('drag'); });
    zone.addEventListener('dragleave', function(){ zone.classList.remove('drag'); });
    zone.addEventListener('drop', function(e){
      e.preventDefault(); zone.classList.remove('drag');
      if(e.dataTransfer && e.dataTransfer.files.length) handleMediaFiles(e.dataTransfer.files);
    });
    input.addEventListener('change', function(){ if(input.files.length) handleMediaFiles(input.files); });
  }
  const att = document.getElementById('attFile');
  if(att) att.addEventListener('change', function(){ if(att.files.length) handleAttachFile(att.files[0]); });
}

    const oldDate = r.date, oldStatus = r.status;
    Object.assign(r, { type:d.type, title:d.title, date:d.date, time:d.time, status:d.status,
      tags:d.tags.slice(), note:d.note, cover:d.cover, fields:fields, media:d.media.slice(),
      attachments:d.attachments.slice(), updatedAt: todayISO()+' '+nowTime() });
    logActivity('更新了「'+r.title+'」', r.type, r.id);
    saveDB();
    ui.draft=null; ui.step=1;
    toast('ok','修改已保存',(oldDate!==r.date? '日期已从 '+fmtCN(oldDate)+' 调整到 '+fmtCN(r.date)+'，日历与时间轴已重新排序；':'')+
      (oldStatus!==r.status? '状态已同步到列表与详情；':'')+'详情、列表、统计与相册均已更新');
    ui.page='detail'; ui.id=r.id; go('#/record/'+r.id);
    return;
  }
  const rec = { id:uid(d.type.slice(0,2)), type:d.type, date:d.date, time:d.time, title:d.title,
    status:d.status, tags:d.tags.slice(), cover:d.cover, fields:fields, note:d.note||'',
    media:d.media.slice(), attachments:d.attachments.slice(),
    createdAt: todayISO()+' '+nowTime(), updatedAt: todayISO()+' '+nowTime() };
  if(rec.type==='supply' && !fields.reorder){
    const dd = new Date(); dd.setDate(dd.getDate()+45); rec.fields.reorder = toISO(dd);
  }
  db.records.push(rec);
  logActivity('新增「'+rec.title+'」', rec.type, rec.id);
  saveDB();
  markPulse = rec.id;
  ui.draft = null; ui.step = 1;
  toast('ok','已记进档案本', DONE_TEXT[rec.type]||'记录已保存，相关统计已更新');
  ui.page = 'detail'; ui.id = rec.id; go('#/record/'+rec.id);
}
function readWizardForm(){
  const d = ui.draft; if(!d) return;
  const t = T(d.type);
  const f = {};
  t.fields.forEach(function(def){
    const el = document.getElementById('w_'+def.k);
    if(!el) return;
    let v = el.value;
    if(def.t==='number' && v!=='') v = (+v);
    f[def.k] = v;
  });
  d.fields = Object.assign({}, d.fields, f);
  const ti = document.getElementById('w_title'); if(ti) d.title = ti.value.trim();
  const da = document.getElementById('w_date'); if(da) d.date = da.value;
  const tm = document.getElementById('w_time'); if(tm) d.time = tm.value;
  const nt = document.getElementById('w_note'); if(nt) d.note = nt.value;
}

function renderFab(){

function renderPage(){
  switch(ui.page){
    case 'today': renderToday(); break;
    case 'records': renderRecords(); break;
    case 'detail': renderDetail(); break;
    case 'calendar': renderCalendar(); break;
    case 'trends': renderTrends(); break;
    case 'album': renderAlbum(); break;
    case 'me': renderMe(); break;
    case 'wizard': renderWizard(); break;
    case 'report': renderReport(); break;
    default: ui.page='today'; renderToday();
  }
  if(markPulse){
    const el = document.querySelector('.rec[data-rec="'+markPulse+'"], .rec-card[data-rec="'+markPulse+'"]');
    if(el) el.classList.add('paw-burst');

function refreshAll(){
  const changed = checkMilestones();
  if(changed) saveDB();
  renderChrome();
  renderPage();
  renderFab();
  if(pendingMilestone){
    const m = pendingMilestone; pendingMilestone = null;
    toast('ok','解锁了新的阶段成果', m.title+' · '+m.desc);
  }
}
function route(){
  const h = (location.hash||'').replace(/^#\/?/,'');
  const qsIdx = h.indexOf('?');
  const path = qsIdx>=0? h.slice(0,qsIdx) : h;
  const qs = qsIdx>=0? h.slice(qsIdx+1) : '';
  const parts = path.split('/').filter(Boolean);
  const p0 = parts[0] || 'today';
  if(qs){
    qs.split('&').forEach(function(kv){
      const a = kv.split('=');
      const k = decodeURIComponent(a[0]||''), v = decodeURIComponent(a[1]||'');
      if(k==='type'){ ui.filter.type = v; ui.filter.status='all'; ui.filter.tag='all'; ui.filter.q=''; }
      if(k==='q'){ ui.filter.q = v; }
      if(k==='tag'){ ui.filter.tag = v; }
      if(k==='status'){ ui.filter.status = v; }
    });
  }
  if(p0==='record'){ ui.page='detail'; ui.id=parts[1]; }
  else if(p0==='new'){
    ui.page='wizard'; ui.id=null;
    const wantType = parts[1]||null;
    if(!ui.draft || ui.draft.editId || ui.draft.type!==wantType){ ui.draft = newDraft(wantType); ui.step = wantType? 2:1; }
    else if(!ui.step || ui.step<1) ui.step = 1;
  }
  else if(p0==='edit'){ ui.page='wizard'; const r=byId(parts[1]); if(r){ ui.draft = draftFrom(r); ui.step=2; } else { ui.page='records'; ui.draft=null; } }
  else if(['today','records','calendar','trends','album','me','report'].indexOf(p0)>=0){ ui.page=p0; ui.id=null; ui.draft=null; }
  else { ui.page='today'; ui.draft=null; }
  refreshAll();
  window.scrollTo(0,0);
}

/* ---------- 提示条 ---------- */
function toast(kind, title, desc, undoLabel, undoFn){
  const box = document.getElementById('toasts');
  if(!box) return;
  const el = document.createElement('div');
  el.className = 'toast'+(kind==='err'?' err':kind==='warn'?' warn':'');
  const iconName = kind==='err'?'alert':kind==='warn'?'alert':'check';
  el.innerHTML = '<span class="ti">'+ic(iconName)+'</span>'+
    '<div class="tt"><div class="t1">'+esc(title)+'</div>'+(desc? '<div class="t2">'+esc(desc)+'</div>':'')+'</div>'+
    (undoLabel? '<button class="undo">'+esc(undoLabel)+'</button>':'');
  if(undoLabel && undoFn) el.querySelector('.undo').addEventListener('click', function(){ undoFn(); el.remove(); });
  box.appendChild(el);
  setTimeout(function(){ el.classList.add('out'); setTimeout(function(){ el.remove(); }, 260); }, kind==='err'? 5200 : 3800);
  while(box.children.length>4) box.removeChild(box.firstChild);
}

  }
  if(el.hasAttribute('data-tododone')){ toggleTodo(el.getAttribute('data-tododone')); return; }
  if(el.hasAttribute('data-f')){

          '，共找到 '+filterRecs(ui.filter).length+' 条'); return;
      }
      ui.rangeKey = val;
      if(val==='all'){ ui.filter.from=''; ui.filter.to=''; }
      else if(val==='custom'){ ui.filter.from = ui.filter.from||shift(-29); ui.filter.to = ui.filter.to||todayISO(); }

    refreshAll(); return;
  }
  if(el.hasAttribute('data-report')||el.hasAttribute('data-report-gen')){
    const rf = document.getElementById('rFrom'), rt = document.getElementById('rTo');

document.addEventListener('keydown', function(e){

  const typing = tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
  if(e.key==='Escape' && document.getElementById('layer').innerHTML){ closeLayer(); e.preventDefault(); return; }
  if(e.key==='Enter' && e.target.id==='globalSearch'){
    e.preventDefault();
    ui.filter.q = e.target.value.trim();
    if(ui.page!=='records'){ ui.page='records'; go('#/records'); } else { ui.limit=12; refreshAll(); }
    e.target.blur();
    return;
  }
  if(e.key==='Enter' && e.target.id==='newCat'){ e.preventDefault(); const b=document.querySelector('[data-cat-add]'); if(b) b.click(); return; }
  if(ui.page==='wizard' && (e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); readWizardForm(); saveDraft(); return; }
  if(typing || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if(k==='?'){ e.preventDefault(); shortcutsPanel(); return; }
  if(k==='/'){ e.preventDefault(); const gi=document.getElementById('globalSearch'); if(gi){ gi.focus(); gi.select(); } return; }
  if(k==='n'){ e.preventDefault(); startWizard(null); return; }
  if(k==='t'){ e.preventDefault(); nav('today'); return; }
  if(k==='r'){ e.preventDefault(); nav('records'); return; }
  if(k==='c'){ e.preventDefault(); nav('calendar'); return; }
  if(k==='a'){ e.preventDefault(); nav('album'); return; }
  if(k==='d'){ e.preventDefault(); nav('trends'); return; }
  if(k==='s'){ e.preventDefault(); nav('me'); return; }
  if(k==='p'){ e.preventDefault(); ui.reportFrom=shift(-29); ui.reportTo=todayISO(); ui.page='report'; go('#/report'); return; }
});
window.addEventListener('scroll', function(){
  const tt = document.getElementById('toTop');
  if(!tt) return;
  if(window.scrollY>640) tt.classList.remove('hidden'); else tt.classList.add('hidden');
}, {passive:true});
window.addEventListener('hashchange', route);
window.addEventListener('resize', function(){
  const tb = document.getElementById('topbar'); if(tb) tb.classList.remove('search-open');
});
window.addEventListener('beforeunload', function(){ try{ saveDB(); }catch(e){} });

/* ---------- 启动 ---------- */
function boot(){
  loadDB();
  if(!location.hash) location.hash = '#/today';
  route();
  if(!db.settings.viewed){
    db.settings.viewed = true; saveDB();
    setTimeout(function(){
      toast('ok','欢迎来到宠物养成','这是小夏给柯基「豆丁」用了三个多月的养护工作台，'+db.records.length+
        ' 条示例记录都按真实日期铺好了。可以直接改、直接删，也能到「我的」里按今天重新生成一整套。');
    }, 800);
  }
}
boot();
